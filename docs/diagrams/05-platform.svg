<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" lang="en">
<title id="t">The platform</title>
<desc id="d">Personas can be used as a local tool, as a hosted web service with your encrypted key, or by an agent through MCP. All three use your own AI engine and keep projects private. The Hub shares modules only: publish, search, download, signed versions, ratings.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5360"/></marker></defs>
<rect x="1" y="1" width="1198" height="718" rx="18" fill="#fbfbf9" stroke="#c4c8c1" stroke-width="2"/>
<text x="40" y="58" font-size="26" font-weight="700" fill="#17202a">The platform</text><text x="40" y="86" font-size="15" fill="#4a5360">Three ways to run studies, one shared library of modules.</text><g><rect x="40" y="116" width="710" height="504" rx="16" fill="#f4f5f2" stroke="#4a5360" stroke-width="1.6" stroke-dasharray="8 6"/><text x="62" y="148" font-size="16" font-weight="700" fill="#17202a">Your space: private</text><text x="62" y="170" font-size="14" fill="#4a5360">projects, pitches, studies, keys</text></g><g data-box="60,190,430,124"><rect x="60" y="190" width="430" height="124" rx="12" fill="#eaf2fc" stroke="#9ec5f4" stroke-width="1.5"/><circle cx="88" cy="219" r="14" fill="#2874d2"/><text x="88" y="224" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="112" y="224" font-size="17" font-weight="700" fill="#17202a">Local tool <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="0.92em">personas</tspan></text><circle cx="84" cy="247.5" r="2.6" fill="#2874d2"/><text x="94" y="252" font-size="14" fill="#4a5360">Dashboard in your browser, and a CLI</text><circle cx="84" cy="267.5" r="2.6" fill="#2874d2"/><text x="94" y="272" font-size="14" fill="#4a5360">Your own API key or subscription</text><circle cx="84" cy="287.5" r="2.6" fill="#2874d2"/><text x="94" y="292" font-size="14" fill="#4a5360">Data stays on your machine</text></g><g data-box="60,332,430,124"><rect x="60" y="332" width="430" height="124" rx="12" fill="#e8f4ec" stroke="#a3d4b5" stroke-width="1.5"/><circle cx="88" cy="361" r="14" fill="#0f6b2f"/><text x="88" y="366" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="112" y="366" font-size="17" font-weight="700" fill="#17202a">Hosted web service</text><circle cx="84" cy="389.5" r="2.6" fill="#0f6b2f"/><text x="94" y="394" font-size="14" fill="#4a5360">Nothing to install</text><circle cx="84" cy="409.5" r="2.6" fill="#0f6b2f"/><text x="94" y="414" font-size="14" fill="#4a5360">Your AI key, encrypted on the server</text><circle cx="84" cy="429.5" r="2.6" fill="#0f6b2f"/><text x="94" y="434" font-size="14" fill="#4a5360">One private space per account</text></g><g data-box="60,474,430,124"><rect x="60" y="474" width="430" height="124" rx="12" fill="#efedfa" stroke="#bdb5ea" stroke-width="1.5"/><circle cx="88" cy="503" r="14" fill="#4a3aa7"/><text x="88" y="508" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="112" y="508" font-size="17" font-weight="700" fill="#17202a">Agent via MCP</text><circle cx="84" cy="531.5" r="2.6" fill="#4a3aa7"/><text x="94" y="536" font-size="14" fill="#4a5360"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="0.92em">personas mcp</tspan> for Claude Code and co.</text><circle cx="84" cy="551.5" r="2.6" fill="#4a3aa7"/><text x="94" y="556" font-size="14" fill="#4a5360">Create projects, run and read studies</text><circle cx="84" cy="571.5" r="2.6" fill="#4a3aa7"/><text x="94" y="576" font-size="14" fill="#4a5360">Asks confirmation before spending</text></g><g data-box="520,190,210,408"><rect x="520" y="190" width="210" height="408" rx="12" fill="#f4f5f2" stroke="#c4c8c1" stroke-width="1.5"/><text x="540" y="224" font-size="17" font-weight="700" fill="#17202a">Your AI engine</text><text x="540" y="252" font-size="14" fill="#4a5360"><tspan font-weight="700">Subscription</tspan></text><text x="540" y="272" font-size="14" fill="#4a5360"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="0.92em">claude</tspan> CLI, local</text><text x="540" y="292" font-size="14" fill="#4a5360">and personal use</text><text x="540" y="332" font-size="14" fill="#4a5360"><tspan font-weight="700">API key</tspan></text><text x="540" y="352" font-size="14" fill="#4a5360">Anthropic, OpenAI,</text><text x="540" y="372" font-size="14" fill="#4a5360">Gemini, OpenRouter</text><text x="540" y="412" font-size="14" fill="#4a5360"><tspan font-weight="700">Local server</tspan></text><text x="540" y="432" font-size="14" fill="#4a5360">Ollama, vLLM</text><text x="540" y="472" font-size="14" fill="#4a5360">Cost estimate</text><text x="540" y="492" font-size="14" fill="#4a5360">and spending cap</text></g><path d="M494,252 L515,252" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M494,394 L515,394" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M494,536 L515,536" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><g data-box="846,116,314,504"><rect x="846" y="116" width="314" height="504" rx="16" fill="#eaf2fc" stroke="#2874d2" stroke-width="2"/><text x="868" y="154" font-size="24" font-weight="700" fill="#17202a">Hub</text><text x="868" y="178" font-size="14" fill="#4a5360">Shared library of modules</text><circle cx="884" cy="225" r="15" fill="#2874d2"/><path d="M884,231 L884,219 M879,224 L884,219 L889,224" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="912" y="230" font-size="16" font-weight="700" fill="#17202a">Publish</text><text x="912" y="251" font-size="14" fill="#4a5360">share a validated module</text><circle cx="884" cy="295" r="15" fill="#2874d2"/><circle cx="882.5" cy="293.5" r="4.5" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M886,297 L890,301" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><text x="912" y="300" font-size="16" font-weight="700" fill="#17202a">Search</text><text x="912" y="321" font-size="14" fill="#4a5360">find one for your target</text><circle cx="884" cy="365" r="15" fill="#2874d2"/><path d="M884,359 L884,371 M879,366 L884,371 L889,366" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="912" y="370" font-size="16" font-weight="700" fill="#17202a">Download</text><text x="912" y="391" font-size="14" fill="#4a5360">pinned to an exact version</text><circle cx="884" cy="435" r="15" fill="#2874d2"/><path d="M878,435 L882.5,439.5 L890,430" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="912" y="440" font-size="16" font-weight="700" fill="#17202a">Signed versions</text><text x="912" y="461" font-size="14" fill="#4a5360">immutable, checked locally</text><circle cx="884" cy="505" r="15" fill="#2874d2"/><polygon points="884.0,498.0 885.8,502.6 890.7,502.8 886.9,505.9 888.1,510.7 884.0,508.0 879.9,510.7 881.1,505.9 877.3,502.8 882.2,502.6" fill="#fff"/><text x="912" y="510" font-size="16" font-weight="700" fill="#17202a">Ratings</text><text x="912" y="531" font-size="14" fill="#4a5360">quality score, usage, stars</text><line x1="868" y1="550" x2="1138" y2="550" stroke="#9ec5f4" stroke-width="1.5"/><text x="868" y="578" font-size="13" fill="#1c5cab" font-style="italic">A module is data (YAML) with</text><text x="868" y="598" font-size="13" fill="#1c5cab" font-style="italic">sourced tables, never code</text></g><path d="M756,322 L840,322" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M840,440 L756,440" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="798" y="310" font-size="13" fill="#4a5360" text-anchor="middle">publish</text><text x="798" y="462" font-size="13" fill="#4a5360" text-anchor="middle">download</text><text x="798" y="378" font-size="13" font-weight="700" fill="#17202a" text-anchor="middle">modules</text><text x="798" y="396" font-size="13" font-weight="700" fill="#17202a" text-anchor="middle">only</text><g data-box="40,646,1120,50"><rect x="40" y="646" width="1120" height="50" rx="12" fill="#17202a"/><text x="600" y="677" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Projects stay private. Only modules are shared.</text></g>
</svg>

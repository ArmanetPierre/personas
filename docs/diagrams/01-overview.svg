<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="504" viewBox="0 0 1200 504" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" lang="en">
<title id="t">How Personas works</title>
<desc id="d">An idea (pitch, price, target) is shown to a synthetic population drawn from official statistics. Each persona reacts in a study. Results are objections, segments and variant comparisons, which lead to a decision or to the next study.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5360"/></marker></defs>
<rect x="1" y="1" width="1198" height="502" rx="18" fill="#fbfbf9" stroke="#c4c8c1" stroke-width="2"/>
<text x="40" y="58" font-size="26" font-weight="700" fill="#17202a">How Personas works</text><text x="40" y="86" font-size="15" fill="#4a5360">From an idea to a decision, through quick, cheap studies you can replay.</text><g data-box="40,124,196,166"><rect x="40" y="124" width="196" height="166" rx="12" fill="#f4f5f2" stroke="#c4c8c1" stroke-width="1.5"/><circle cx="68" cy="153" r="14" fill="#4a5360"/><text x="68" y="158" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="92" y="158" font-size="17" font-weight="700" fill="#17202a">An idea</text><circle cx="64" cy="181.5" r="2.6" fill="#4a5360"/><text x="74" y="186" font-size="14" fill="#4a5360">Pitch: what a user</text><text x="74" y="206" font-size="14" fill="#4a5360">would actually see</text><circle cx="64" cy="221.5" r="2.6" fill="#4a5360"/><text x="74" y="226" font-size="14" fill="#4a5360">Price, alternatives</text><circle cx="64" cy="241.5" r="2.6" fill="#4a5360"/><text x="74" y="246" font-size="14" fill="#4a5360">Who it is for</text></g><g data-box="271,124,196,166"><rect x="271" y="124" width="196" height="166" rx="12" fill="#eaf2fc" stroke="#9ec5f4" stroke-width="1.5"/><circle cx="299" cy="153" r="14" fill="#2874d2"/><text x="299" y="158" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="323" y="158" font-size="17" font-weight="700" fill="#17202a">A synthetic</text><text x="323" y="179" font-size="17" font-weight="700" fill="#17202a">population</text><text x="291" y="207" font-size="14" fill="#4a5360">People drawn from</text><text x="291" y="227" font-size="14" fill="#4a5360">official statistics: age,</text><text x="291" y="247" font-size="14" fill="#4a5360">income, household,</text><text x="291" y="267" font-size="14" fill="#4a5360">budget, subscriptions…</text></g><g data-box="502,124,196,166"><rect x="502" y="124" width="196" height="166" rx="12" fill="#eaf2fc" stroke="#9ec5f4" stroke-width="1.5"/><circle cx="530" cy="153" r="14" fill="#2874d2"/><text x="530" y="158" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="554" y="158" font-size="17" font-weight="700" fill="#17202a">A study</text><text x="522" y="186" font-size="14" fill="#4a5360">Each persona reacts:</text><text x="522" y="206" font-size="14" fill="#4a5360">“What do you do in</text><text x="522" y="226" font-size="14" fill="#4a5360">the next 7 days?”</text><text x="522" y="246" font-size="14" fill="#4a5360">Inertia is the default.</text></g><g data-box="733,124,196,166"><rect x="733" y="124" width="196" height="166" rx="12" fill="#e8f4ec" stroke="#a3d4b5" stroke-width="1.5"/><circle cx="761" cy="153" r="14" fill="#0f6b2f"/><text x="761" y="158" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="785" y="158" font-size="17" font-weight="700" fill="#17202a">Results</text><circle cx="757" cy="181.5" r="2.6" fill="#0f6b2f"/><text x="767" y="186" font-size="14" fill="#4a5360">Objections, verbatims</text><circle cx="757" cy="201.5" r="2.6" fill="#0f6b2f"/><text x="767" y="206" font-size="14" fill="#4a5360">Segments that respond</text><text x="767" y="226" font-size="14" fill="#4a5360">or drop out</text><circle cx="757" cy="241.5" r="2.6" fill="#0f6b2f"/><text x="767" y="246" font-size="14" fill="#4a5360">Variants compared</text></g><g data-box="964,124,196,166"><rect x="964" y="124" width="196" height="166" rx="12" fill="#efedfa" stroke="#bdb5ea" stroke-width="1.5"/><circle cx="992" cy="153" r="14" fill="#4a3aa7"/><text x="992" y="158" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="1016" y="158" font-size="17" font-weight="700" fill="#17202a">A decision</text><circle cx="988" cy="181.5" r="2.6" fill="#4a3aa7"/><text x="998" y="186" font-size="14" fill="#4a5360">Drop, adjust, or test</text><text x="998" y="206" font-size="14" fill="#4a5360">the next variant</text><circle cx="988" cy="221.5" r="2.6" fill="#4a3aa7"/><text x="998" y="226" font-size="14" fill="#4a5360">Prepare questions</text><text x="998" y="246" font-size="14" fill="#4a5360">for real interviews</text></g><path d="M241,207 L266,207" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M472,207 L497,207" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M703,207 L728,207" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M934,207 L959,207" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1062,294 L1062,320 Q1062,330 1052,330 L148,330 Q138,330 138,320 L138,296" fill="none" stroke="#4a5360" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><g data-box="300,316,600,28"><rect x="300" y="316" width="600" height="28" rx="6" fill="#fbfbf9"/><text x="600" y="335" font-size="15" font-weight="600" fill="#17202a" text-anchor="middle">Next study: a new variant, on the same sample</text></g><g data-box="40,374,1120,92"><rect x="40" y="374" width="1120" height="92" rx="12" fill="#17202a"/><text x="600" y="414" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">A filter for bad ideas and an objection generator, not an oracle.</text><text x="600" y="438" font-size="14" fill="#c9d1d9" text-anchor="middle">It does not predict a conversion rate and does not replace real customer interviews.</text></g>
</svg>

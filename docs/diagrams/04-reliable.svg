<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" lang="en">
<title id="t">What is reliable, what is indicative</title>
<desc id="d">Reliable: objections, segments that respond or drop out, differences between variants on the same sample, effect of the pitch's tone. Indicative: absolute levels of trying and paying, always shown with a correction and a confidence index.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5360"/></marker></defs>
<rect x="1" y="1" width="1198" height="648" rx="18" fill="#fbfbf9" stroke="#c4c8c1" stroke-width="2"/>
<text x="40" y="58" font-size="26" font-weight="700" fill="#17202a">What is reliable, what is indicative</text><text x="40" y="86" font-size="15" fill="#4a5360">LLMs are not customers. Their absolute numbers are biased in a known direction, so results come in two kinds.</text><g data-box="40,118,548,432"><rect x="40" y="118" width="548" height="432" rx="12" fill="#e8f4ec" stroke="#a3d4b5" stroke-width="1.5"/><path d="M40,130 Q40,118 52,118 L576,118 Q588,118 588,130 L588,188 L40,188 Z" fill="#0f6b2f"/><text x="64" y="162" font-size="24" font-weight="700" fill="#ffffff">Reliable</text><text x="564" y="161" font-size="15" font-weight="600" fill="#ffffff" text-anchor="end">Use it to decide</text><circle cx="76" cy="221" r="13" fill="#0f6b2f"/><path d="M70,221 L74.5,225.5 L82,216" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="226" font-size="16" font-weight="700" fill="#17202a">Objections and friction points</text><text x="102" y="248" font-size="14" fill="#4a5360">in the personas' own words</text><circle cx="76" cy="293" r="13" fill="#0f6b2f"/><path d="M70,293 L74.5,297.5 L82,288" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="298" font-size="16" font-weight="700" fill="#17202a">Segments that respond or drop out</text><text x="102" y="320" font-size="14" fill="#4a5360">age, income, household, modules, target vs control</text><circle cx="76" cy="365" r="13" fill="#0f6b2f"/><path d="M70,365 L74.5,369.5 L82,360" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="370" font-size="16" font-weight="700" fill="#17202a">Differences between variants</text><text x="102" y="392" font-size="14" fill="#4a5360">price, offer or target, tested on the same sample</text><circle cx="76" cy="437" r="13" fill="#0f6b2f"/><path d="M70,437 L74.5,441.5 L82,432" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="442" font-size="16" font-weight="700" fill="#17202a">The effect of the pitch's tone</text><text x="102" y="464" font-size="14" fill="#4a5360">a sales pitch inflates trust and shifts prices</text></g><g data-box="612,118,548,432"><rect x="612" y="118" width="548" height="432" rx="12" fill="#fff4d6" stroke="#e2c46b" stroke-width="1.5"/><path d="M612,130 Q612,118 624,118 L1148,118 Q1160,118 1160,130 L1160,188 L612,188 Z" fill="#7a5b00"/><text x="636" y="162" font-size="24" font-weight="700" fill="#ffffff">Indicative</text><text x="1136" y="161" font-size="15" font-weight="600" fill="#ffffff" text-anchor="end">Never read it alone</text><circle cx="648" cy="221" r="13" fill="#9a7300"/><path d="M641,219 q3.5,-3 7,0 t7,0 M641,225 q3.5,-3 7,0 t7,0" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="674" y="226" font-size="16" font-weight="700" fill="#17202a">Absolute levels: trying, paying</text><text x="674" y="248" font-size="14" fill="#4a5360">biased, and the bias has a known direction</text><circle cx="648" cy="293" r="13" fill="#9a7300"/><path d="M641,291 q3.5,-3 7,0 t7,0 M641,297 q3.5,-3 7,0 t7,0" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="674" y="298" font-size="16" font-weight="700" fill="#17202a">M1: observed payment within 7 days</text><text x="674" y="320" font-size="14" fill="#4a5360">almost always close to zero</text><circle cx="648" cy="365" r="13" fill="#9a7300"/><path d="M641,363 q3.5,-3 7,0 t7,0 M641,369 q3.5,-3 7,0 t7,0" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="674" y="370" font-size="16" font-weight="700" fill="#17202a">G → M2: “yes” at a low price tier</text><text x="674" y="392" font-size="14" fill="#4a5360">converted into an estimated paying share, with interval</text><circle cx="648" cy="437" r="13" fill="#9a7300"/><path d="M641,435 q3.5,-3 7,0 t7,0 M641,441 q3.5,-3 7,0 t7,0" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="674" y="442" font-size="16" font-weight="700" fill="#17202a">Always with correction and confidence index</text><text x="674" y="464" font-size="14" fill="#4a5360">sample size, calibration, pitch tone, model</text><line x1="636" y1="486" x2="1136" y2="486" stroke="#e2c46b" stroke-width="1.5"/><text x="636" y="509" font-size="13" fill="#7a5b00" font-style="italic">M2 is shown as “uncalibrated” until it is fitted</text><text x="636" y="528" font-size="13" fill="#7a5b00" font-style="italic">on products with a known outcome.</text></g><g data-box="40,574,1120,50"><rect x="40" y="574" width="1120" height="50" rx="12" fill="#17202a"/><text x="600" y="605" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Rule of thumb: compare variants on the same sample, don't forecast levels.</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" lang="en">
<title id="t">How a study runs</title>
<desc id="d">Eight steps: project with a neutral pitch, target and control group, cost estimate and cap, each persona answers under real constraints, answers are validated, analysis, recommendations, and the next study on the same sample.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5360"/></marker></defs>
<rect x="1" y="1" width="1198" height="718" rx="18" fill="#fbfbf9" stroke="#c4c8c1" stroke-width="2"/>
<text x="40" y="58" font-size="26" font-weight="700" fill="#17202a">How a study runs</text><text x="40" y="86" font-size="15" fill="#4a5360">From a project to findings you can act on, then the next variant on the same people.</text><g data-box="40,146,244,196"><rect x="40" y="146" width="244" height="196" rx="12" fill="#f4f5f2" stroke="#c4c8c1" stroke-width="1.5"/><text x="92" y="173" font-size="11" font-weight="700" fill="#4a5360" letter-spacing="0.08em">PREPARE</text><circle cx="68" cy="182" r="14" fill="#4a5360"/><text x="68" y="187" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="92" y="196" font-size="17" font-weight="700" fill="#17202a">Project</text><circle cx="64" cy="219.5" r="2.6" fill="#4a5360"/><text x="74" y="224" font-size="14" fill="#4a5360">Pitch, price, alternatives</text><circle cx="64" cy="239.5" r="2.6" fill="#4a5360"/><text x="74" y="244" font-size="14" fill="#4a5360">Tone check: a sales</text><text x="74" y="264" font-size="14" fill="#4a5360">pitch is refused</text><circle cx="64" cy="279.5" r="2.6" fill="#4a5360"/><text x="74" y="284" font-size="14" fill="#4a5360">An assistant proposes</text><text x="74" y="304" font-size="14" fill="#4a5360">a factual version</text></g><g data-box="324,146,244,196"><rect x="324" y="146" width="244" height="196" rx="12" fill="#f4f5f2" stroke="#c4c8c1" stroke-width="1.5"/><text x="376" y="173" font-size="11" font-weight="700" fill="#4a5360" letter-spacing="0.08em">PREPARE</text><circle cx="352" cy="182" r="14" fill="#4a5360"/><text x="352" y="187" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="376" y="196" font-size="17" font-weight="700" fill="#17202a">Target and</text><text x="376" y="217" font-size="17" font-weight="700" fill="#17202a">control group</text><circle cx="348" cy="240.5" r="2.6" fill="#4a5360"/><text x="358" y="245" font-size="14" fill="#4a5360">Who it is for: quotas,</text><text x="358" y="265" font-size="14" fill="#4a5360">eligibility, modules</text><circle cx="348" cy="280.5" r="2.6" fill="#4a5360"/><text x="358" y="285" font-size="14" fill="#4a5360">An off-target control</text><text x="358" y="305" font-size="14" fill="#4a5360">group shows who really</text><text x="358" y="325" font-size="14" fill="#4a5360">responds</text></g><g data-box="608,146,244,196"><rect x="608" y="146" width="244" height="196" rx="12" fill="#f4f5f2" stroke="#c4c8c1" stroke-width="1.5"/><text x="660" y="173" font-size="11" font-weight="700" fill="#4a5360" letter-spacing="0.08em">PREPARE</text><circle cx="636" cy="182" r="14" fill="#4a5360"/><text x="636" y="187" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="660" y="196" font-size="17" font-weight="700" fill="#17202a">Cost estimate</text><text x="660" y="217" font-size="17" font-weight="700" fill="#17202a">and cap</text><circle cx="632" cy="240.5" r="2.6" fill="#4a5360"/><text x="642" y="245" font-size="14" fill="#4a5360">Planned calls shown</text><text x="642" y="265" font-size="14" fill="#4a5360">before anything runs</text><circle cx="632" cy="280.5" r="2.6" fill="#4a5360"/><text x="642" y="285" font-size="14" fill="#4a5360">Spending cap per study</text><circle cx="632" cy="300.5" r="2.6" fill="#4a5360"/><text x="642" y="305" font-size="14" fill="#4a5360">Drawing and preview</text><text x="642" y="325" font-size="14" fill="#4a5360">are free</text></g><g data-box="892,146,244,196"><rect x="892" y="146" width="244" height="196" rx="12" fill="#eaf2fc" stroke="#2874d2" stroke-width="2.5"/><text x="944" y="173" font-size="11" font-weight="700" fill="#1c5cab" letter-spacing="0.08em">RUN</text><circle cx="920" cy="182" r="14" fill="#2874d2"/><text x="920" y="187" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="944" y="196" font-size="17" font-weight="700" fill="#17202a">Each persona</text><text x="944" y="217" font-size="17" font-weight="700" fill="#17202a">answers</text><circle cx="916" cy="240.5" r="2.6" fill="#2874d2"/><text x="926" y="245" font-size="14" fill="#4a5360">Real budget left this month</text><circle cx="916" cy="260.5" r="2.6" fill="#2874d2"/><text x="926" y="265" font-size="14" fill="#4a5360">Alternatives, often free</text><circle cx="916" cy="280.5" r="2.6" fill="#2874d2"/><text x="926" y="285" font-size="14" fill="#4a5360">Inertia by default</text><circle cx="916" cy="300.5" r="2.6" fill="#2874d2"/><text x="926" y="305" font-size="14" fill="#4a5360">What they actually do</text><text x="926" y="325" font-size="14" fill="#4a5360">in the next 7 days</text></g><g data-box="40,420,244,196"><rect x="40" y="420" width="244" height="196" rx="12" fill="#eaf2fc" stroke="#9ec5f4" stroke-width="1.5"/><text x="92" y="447" font-size="11" font-weight="700" fill="#1c5cab" letter-spacing="0.08em">RUN</text><circle cx="68" cy="456" r="14" fill="#2874d2"/><text x="68" y="461" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="92" y="470" font-size="17" font-weight="700" fill="#17202a">Validated</text><text x="92" y="491" font-size="17" font-weight="700" fill="#17202a">answers</text><circle cx="64" cy="514.5" r="2.6" fill="#2874d2"/><text x="74" y="519" font-size="14" fill="#4a5360">JSON schema and</text><text x="74" y="539" font-size="14" fill="#4a5360">coherence checks</text><circle cx="64" cy="554.5" r="2.6" fill="#2874d2"/><text x="74" y="559" font-size="14" fill="#4a5360">One repair, towards caution</text><circle cx="64" cy="574.5" r="2.6" fill="#2874d2"/><text x="74" y="579" font-size="14" fill="#4a5360">Saved as they arrive:</text><text x="74" y="599" font-size="14" fill="#4a5360">the study is resumable</text></g><g data-box="324,420,244,196"><rect x="324" y="420" width="244" height="196" rx="12" fill="#e8f4ec" stroke="#a3d4b5" stroke-width="1.5"/><text x="376" y="447" font-size="11" font-weight="700" fill="#0f6b2f" letter-spacing="0.08em">READ</text><circle cx="352" cy="456" r="14" fill="#0f6b2f"/><text x="352" y="461" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="376" y="470" font-size="17" font-weight="700" fill="#17202a">Analysis</text><circle cx="348" cy="493.5" r="2.6" fill="#0f6b2f"/><text x="358" y="498" font-size="14" fill="#4a5360">Objections and verbatims</text><circle cx="348" cy="513.5" r="2.6" fill="#0f6b2f"/><text x="358" y="518" font-size="14" fill="#4a5360">Segments: target vs control</text><circle cx="348" cy="533.5" r="2.6" fill="#0f6b2f"/><text x="358" y="538" font-size="14" fill="#4a5360">Levels M1 / G / M2</text><circle cx="348" cy="553.5" r="2.6" fill="#0f6b2f"/><text x="358" y="558" font-size="14" fill="#4a5360">Confidence index</text></g><g data-box="608,420,244,196"><rect x="608" y="420" width="244" height="196" rx="12" fill="#e8f4ec" stroke="#a3d4b5" stroke-width="1.5"/><text x="660" y="447" font-size="11" font-weight="700" fill="#0f6b2f" letter-spacing="0.08em">READ</text><circle cx="636" cy="456" r="14" fill="#0f6b2f"/><text x="636" y="461" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="660" y="470" font-size="17" font-weight="700" fill="#17202a">Recommendations</text><circle cx="632" cy="493.5" r="2.6" fill="#0f6b2f"/><text x="642" y="498" font-size="14" fill="#4a5360">Findings and next</text><text x="642" y="518" font-size="14" fill="#4a5360">variants to test</text><circle cx="632" cy="533.5" r="2.6" fill="#0f6b2f"/><text x="642" y="538" font-size="14" fill="#4a5360">Each one checked</text><text x="642" y="558" font-size="14" fill="#4a5360">against the data</text></g><g data-box="892,420,244,196"><rect x="892" y="420" width="244" height="196" rx="12" fill="#efedfa" stroke="#bdb5ea" stroke-width="1.5"/><text x="944" y="447" font-size="11" font-weight="700" fill="#4a3aa7" letter-spacing="0.08em">ITERATE</text><circle cx="920" cy="456" r="14" fill="#4a3aa7"/><text x="920" y="461" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><text x="944" y="470" font-size="17" font-weight="700" fill="#17202a">Next study</text><circle cx="916" cy="493.5" r="2.6" fill="#4a3aa7"/><text x="926" y="498" font-size="14" fill="#4a5360">New price, offer or target</text><text x="926" y="518" font-size="14" fill="#4a5360">on the same sample</text><circle cx="916" cy="533.5" r="2.6" fill="#4a3aa7"/><text x="926" y="538" font-size="14" fill="#4a5360">Compare the two studies</text></g><path d="M289,244 L319,244" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M289,518 L319,518" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M573,244 L603,244" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M573,518 L603,518" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M857,244 L887,244" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M857,518 L887,518" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1014,346 L1014,371 Q1014,381 1004,381 L172,381 Q162,381 162,391 L162,415" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1141,518 L1160,518 Q1170,518 1170,508 L1170,128 Q1170,118 1160,118 L172,118 Q162,118 162,128 L162,141" fill="none" stroke="#4a5360" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><g data-box="330,104,620,28"><rect x="330" y="104" width="620" height="28" rx="6" fill="#fbfbf9"/><text x="640" y="123" font-size="14" font-weight="600" fill="#17202a" text-anchor="middle">Same sample: differences come from the variant, not from the people</text></g><g data-box="40,648,1120,48"><rect x="40" y="648" width="1120" height="48" rx="12" fill="#17202a"/><text x="600" y="678" font-size="14" fill="#ffffff" text-anchor="middle">One LLM call per persona (plus about 10 % repairs). Drawing, checks and statistics are computed, not generated.</text></g>
</svg>

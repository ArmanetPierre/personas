<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" lang="en">
<title id="t">How a persona is born</title>
<desc id="d">A country pack of official statistics and optional thematic modules feed a statistical draw that fixes every attribute. The AI then writes a short narrative from the card, without changing any attribute. A fixed seed makes the draw reproducible.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5360"/></marker></defs>
<rect x="1" y="1" width="1198" height="778" rx="18" fill="#fbfbf9" stroke="#c4c8c1" stroke-width="2"/>
<text x="40" y="58" font-size="26" font-weight="700" fill="#17202a">How a persona is born</text><text x="40" y="86" font-size="15" fill="#4a5360">Statistics decide who the person is. The AI only tells their story.</text><g data-box="40,118,350,272"><rect x="40" y="118" width="350" height="272" rx="12" fill="#eaf2fc" stroke="#9ec5f4" stroke-width="1.5"/><text x="60" y="152" font-size="17" font-weight="700" fill="#17202a">Country pack</text><text x="60" y="178" font-size="14" fill="#4a5360">Official statistics, every table</text><text x="60" y="198" font-size="14" fill="#4a5360">cites its source</text><rect x="60" y="230" width="86" height="30" rx="15" fill="#ffffff" stroke="#9ec5f4" stroke-width="1.2"/><text x="103" y="250" font-size="13" fill="#17202a" text-anchor="middle">Age &amp; sex</text><rect x="154" y="230" width="65" height="30" rx="15" fill="#ffffff" stroke="#9ec5f4" stroke-width="1.2"/><text x="186.5" y="250" font-size="13" fill="#17202a" text-anchor="middle">Region</text><rect x="227" y="230" width="93" height="30" rx="15" fill="#ffffff" stroke="#9ec5f4" stroke-width="1.2"/><text x="273.5" y="250" font-size="13" fill="#17202a" text-anchor="middle">Occupation</text><rect x="60" y="270" width="65" height="30" rx="15" fill="#ffffff" stroke="#9ec5f4" stroke-width="1.2"/><text x="92.5" y="290" font-size="13" fill="#17202a" text-anchor="middle">Income</text><rect x="133" y="270" width="86" height="30" rx="15" fill="#ffffff" stroke="#9ec5f4" stroke-width="1.2"/><text x="176" y="290" font-size="13" fill="#17202a" text-anchor="middle">Household</text><rect x="227" y="270" width="72" height="30" rx="15" fill="#ffffff" stroke="#9ec5f4" stroke-width="1.2"/><text x="263" y="290" font-size="13" fill="#17202a" text-anchor="middle">Housing</text><rect x="60" y="310" width="86" height="30" rx="15" fill="#ffffff" stroke="#9ec5f4" stroke-width="1.2"/><text x="103" y="330" font-size="13" fill="#17202a" text-anchor="middle">Equipment</text><rect x="154" y="310" width="114" height="30" rx="15" fill="#ffffff" stroke="#9ec5f4" stroke-width="1.2"/><text x="211" y="330" font-size="13" fill="#17202a" text-anchor="middle">Subscriptions</text><rect x="60" y="350" width="121" height="30" rx="15" fill="#ffffff" stroke="#9ec5f4" stroke-width="1.2"/><text x="120.5" y="370" font-size="13" fill="#17202a" text-anchor="middle">Monthly budget</text></g><g data-box="40,406,350,154"><rect x="40" y="406" width="350" height="154" rx="12" fill="#e8f4ec" stroke="#a3d4b5" stroke-width="1.5"/><text x="60" y="440" font-size="17" font-weight="700" fill="#17202a">Thematic modules</text><text x="60" y="468" font-size="14" fill="#4a5360">Optional, declarative, sourced</text><text x="60" y="488" font-size="14" fill="#4a5360">Conditional attributes, e.g. works</text><text x="60" y="508" font-size="14" fill="#4a5360">in software, hosts guests, diet</text><text x="60" y="528" font-size="14" fill="#4a5360">Situations, never attitudes</text></g><g data-box="40,578,350,88"><rect x="40" y="578" width="350" height="88" rx="12" fill="#f4f5f2" stroke="#c4c8c1" stroke-width="1.5"/><text x="60" y="612" font-size="17" font-weight="700" fill="#17202a">Fixed seed</text><text x="60" y="640" font-size="14" fill="#4a5360">Same seed, same people</text></g><g data-box="440,118,300,548"><rect x="440" y="118" width="300" height="548" rx="12" fill="#f4f5f2" stroke="#4a5360" stroke-width="2"/><text x="590" y="154" font-size="18" font-weight="700" fill="#17202a" text-anchor="middle">Statistical draw</text><text x="590" y="178" font-size="13" fill="#4a5360" text-anchor="middle">Each attribute depends on the previous ones</text><rect x="472" y="204" width="236" height="36" rx="8" fill="#ffffff" stroke="#9ec5f4" stroke-width="1.5"/><text x="590" y="227" font-size="14" fill="#17202a" text-anchor="middle">Age and sex</text><path d="M590,243 L590,259" fill="none" stroke="#4a5360" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="472" y="262" width="236" height="36" rx="8" fill="#ffffff" stroke="#9ec5f4" stroke-width="1.5"/><text x="590" y="285" font-size="14" fill="#17202a" text-anchor="middle">Activity</text><path d="M590,301 L590,317" fill="none" stroke="#4a5360" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="472" y="320" width="236" height="36" rx="8" fill="#ffffff" stroke="#9ec5f4" stroke-width="1.5"/><text x="590" y="343" font-size="14" fill="#17202a" text-anchor="middle">Occupation</text><path d="M590,359 L590,375" fill="none" stroke="#4a5360" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="472" y="378" width="236" height="36" rx="8" fill="#ffffff" stroke="#9ec5f4" stroke-width="1.5"/><text x="590" y="401" font-size="14" fill="#17202a" text-anchor="middle">Income</text><path d="M590,417 L590,433" fill="none" stroke="#4a5360" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="472" y="436" width="236" height="36" rx="8" fill="#ffffff" stroke="#9ec5f4" stroke-width="1.5"/><text x="590" y="459" font-size="14" fill="#17202a" text-anchor="middle">Household, housing…</text><path d="M590,475 L590,491" fill="none" stroke="#4a5360" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="472" y="494" width="236" height="52" rx="8" fill="#ffffff" stroke="#a3d4b5" stroke-width="1.5"/><text x="590" y="515" font-size="14" fill="#17202a" text-anchor="middle">Each module, in its</text><text x="590" y="533" font-size="14" fill="#17202a" text-anchor="middle">own random stream</text><text x="590" y="604" font-size="15" font-weight="700" fill="#0f6b2f" text-anchor="middle">No LLM call:</text><text x="590" y="626" font-size="15" font-weight="700" fill="#0f6b2f" text-anchor="middle">free and deterministic</text></g><g data-box="790,118,370,304"><rect x="790" y="118" width="370" height="304" rx="12" fill="#ffffff" stroke="#4a5360" stroke-width="2"/><text x="810" y="152" font-size="17" font-weight="700" fill="#17202a">Drawn attributes</text><rect x="1070" y="135" width="70" height="24" rx="12" fill="#eaf2fc" stroke="#9ec5f4" stroke-width="1.2"/><text x="1105" y="151" font-size="11" font-weight="700" fill="#1c5cab" text-anchor="middle" letter-spacing="0.08em">LOCKED</text><line x1="806" y1="170" x2="1144" y2="170" stroke="#dcdfd8" stroke-width="1.5"/><text x="810" y="198" font-size="13" fill="#4a5360">Age, sex</text><rect x="976" y="188" width="120" height="11" rx="5.5" fill="#9ec5f4"/><text x="810" y="226" font-size="13" fill="#4a5360">Region</text><rect x="976" y="216" width="96" height="11" rx="5.5" fill="#9ec5f4"/><text x="810" y="254" font-size="13" fill="#4a5360">Occupation</text><rect x="976" y="244" width="150" height="11" rx="5.5" fill="#9ec5f4"/><text x="810" y="282" font-size="13" fill="#4a5360">Income</text><rect x="976" y="272" width="82" height="11" rx="5.5" fill="#9ec5f4"/><text x="810" y="310" font-size="13" fill="#4a5360">Household</text><rect x="976" y="300" width="134" height="11" rx="5.5" fill="#9ec5f4"/><text x="810" y="338" font-size="13" fill="#4a5360">Budget left</text><rect x="976" y="328" width="104" height="11" rx="5.5" fill="#9ec5f4"/><text x="810" y="366" font-size="13" fill="#4a5360">Subscriptions</text><rect x="976" y="356" width="160" height="11" rx="5.5" fill="#9ec5f4"/><text x="810" y="394" font-size="13" fill="#4a5360">Module attributes</text><rect x="976" y="384" width="128" height="11" rx="5.5" fill="#a3d4b5"/></g><path d="M975,426 L975,468" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><g data-box="981,432,166,30"><text x="989" y="452" font-size="13" fill="#636a74" font-style="italic">the card only</text></g><g data-box="790,474,370,192"><rect x="790" y="474" width="370" height="192" rx="12" fill="#efedfa" stroke="#bdb5ea" stroke-width="1.5"/><text x="810" y="508" font-size="17" font-weight="700" fill="#17202a">The AI writes</text><text x="810" y="529" font-size="17" font-weight="700" fill="#17202a">the narrative</text><text x="810" y="557" font-size="14" fill="#4a5360">A short story built from the card,</text><text x="810" y="578" font-size="14" fill="#4a5360">in the language of the pack</text><text x="810" y="599" font-size="14" fill="#4a5360">It cannot add or change</text><text x="810" y="620" font-size="14" fill="#4a5360">a single attribute</text><text x="810" y="641" font-size="14" fill="#4a5360"><tspan font-weight="700">Persona = attributes + narrative</tspan></text></g><path d="M395,250 L435,250" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M395,483 L435,483" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M395,622 L435,622" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M745,270 L785,270" fill="none" stroke="#4a5360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><g data-box="40,690,1120,66"><rect x="40" y="690" width="1120" height="66" rx="12" fill="#17202a"/><text x="600" y="717" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Reproducible: same pack + same modules + same seed = the same personas.</text><text x="600" y="741" font-size="14" fill="#c9d1d9" text-anchor="middle">Adding a module changes neither the base population nor the other modules.</text></g>
</svg>

# Module "Payments and fintech" (United States): banking status, credit cards, payment apps, mobile wallets, BNPL, online payment preference, cash use.
# Generic module for any app or SaaS project. Applies to every adult of the us socle. No socle_overrides, no affects_budget.
# Format: docs/modules.md. Declaration order = draw order.
id: us-payments-fintech
version: "2026.2"
changelog:
  - version: "2026.2"
    date: "2026-10-22"
    changes:
      - "First version: banking status, credit card holding and balance, payment apps, in-store mobile wallet, BNPL, preferred online payment method, weekly cash use."
      - "Cash use: the no-cash age factor for 65+ lowered from 0.82 to 0.68 so that the simulated share of 65+ adults with no cash purchases (was 42.1%) falls within the range around Pew's 33%. Other attributes unchanged."
label: Payments and fintech
short_label: Payments
description: >-
  How U.S. adults pay and manage money day to day: banking status (fully banked, underbanked, unbanked), credit card holding
  and carrying a balance, peer-to-peer payment apps, in-store mobile wallet use, buy now pay later use in the last 12 months,
  preferred way to pay online and cash use in a typical week. Conditioned on living standard, age, education, activity,
  smartphone ownership and tech adoption. Banking status is modelled at the adult level (about 4.5% unbanked, 15% underbanked;
  the FDIC survey itself counts households). Generic: not tied to any product, and it never changes the socle income or budget.
applies_to: [us]
requires: []

sources:
  fdic_2023:
    org: "FDIC"
    title: "2023 FDIC National Survey of Unbanked and Underbanked Households"
    year: 2024
    url: "https://www.fdic.gov/household-survey"
    detail: "Households: 4.2% unbanked, 14.2% underbanked; underbanked 23.1% without a high school diploma vs 10.4% with a college degree"
  shed_2025_credit:
    org: "Federal Reserve Board"
    title: "Economic Well-Being of U.S. Households in 2025 - Credit"
    year: 2026
    url: "https://www.federalreserve.gov/publications/2026-economic-well-being-of-us-households-in-2025-credit.htm"
    detail: "82% have a credit card (by income 46/71/88/97%; by age 65/78/86/92%); 37% of adults carried a balance; BNPL 16% (by income 18/23/18/12%; by age 22/21/17/9%)"
  shed_2025_full:
    org: "Federal Reserve Board"
    title: "Economic Well-Being of U.S. Households in 2025 (accessible version)"
    year: 2026
    url: "https://www.federalreserve.gov/publications/2026-economic-well-being-of-us-households-in-2025-accessible-version.htm"
    detail: "6% of adults unbanked, stable since 2020; 26% of BNPL users paid late"
  pew_payment_apps_2022:
    org: "Pew Research Center"
    title: "Payment app users say they make paying easier, but security a concern for some"
    year: 2022
    url: "https://www.pewresearch.org/short-reads/2022/09/08/payment-apps-like-venmo-and-cash-app-bring-convenience--and-security-concerns--to-some-users/"
    detail: "Ever used: PayPal 57%, Venmo 38%, Zelle 36%, Cash App 26%; at least one 76%; Venmo by age 57/49/28/15%"
  pew_cash_2026:
    org: "Pew Research Center"
    title: "Fewer Americans use cash today than a decade ago, but many still carry it"
    year: 2026
    url: "https://www.pewresearch.org/short-reads/2026/08/26/fewer-americans-use-cash-today-than-a-decade-ago-but-many-still-carry-it/"
    detail: "Typical week: 42% no cash purchases, 46% some, 12% all or almost all; gradients by age and household income"
  pew_methods_2026:
    org: "Pew Research Center (Atlanta Fed SDCPC 2025)"
    title: "From cash to credit: how Americans' payment methods have changed in the past decade"
    year: 2026
    url: "https://www.pewresearch.org/short-reads/2026/09/30/from-cash-to-credit-how-americans-payment-methods-have-changed-in-the-past-decade/"
    detail: "92% prefer a card (credit or debit) for online purchases; 78% in person"
  atlanta_fed_2025:
    org: "Federal Reserve Bank of Atlanta"
    title: "2025 Survey and Diary of Consumer Payment Choice: Summary Results"
    year: 2025
    url: "https://www.atlantafed.org/-/media/Project/Atlanta/FRBA/Documents/research-and-data/surveys/consumer-payments/survey-diary-consumer-payment-choice/2025/2025-SDCPC-results-report.pdf"
    detail: "Not verified (PDF unreadable): more than 72% paid with a phone at least once in 12 months; phones 27% of payments"
  pymnts_wallet_2025:
    org: "PYMNTS (industry survey)"
    title: "Apple Pay Turns 11 and Its Rivals Are Catching Up"
    year: 2025
    url: "https://www.pymnts.com/mobile/2025/digital-wallet-usage-doubles-but-apple-pay-still-isnt-everyones-default/"
    detail: "Not verified, industry survey: over 30% of consumers use a wallet in store weekly. Treat with caution."

conditions:
  everyone: {attr: banking_status, present: true}
  age_18_29: {attr: socle.age, lt: 30}
  age_30_49: {all: [{attr: socle.age, gt: 29}, {attr: socle.age, lt: 50}]}
  age_50_64: {all: [{attr: socle.age, gt: 49}, {attr: socle.age, lt: 65}]}
  age_65_plus: {attr: socle.age, gt: 64}
  income_below_035: {attr: socle.living_standard_ratio, lt: 0.35}
  income_below_065: {attr: socle.living_standard_ratio, lt: 0.65}
  income_above_13: {attr: socle.living_standard_ratio, gt: 1.3}
  has_smartphone: {attr: socle.has_smartphone, eq: true}
  no_smartphone: {attr: socle.has_smartphone, eq: false}
  college: {attr: socle.education, in: [bachelor, graduate]}
  tech_high: {attr: socle.tech_adoption, in: [innovator, early_adopter]}
  tech_low: {attr: socle.tech_adoption, in: [late_majority, laggard]}
  unbanked: {attr: banking_status, eq: unbanked}
  underbanked: {attr: banking_status, eq: underbanked}
  holds_card: {attr: has_credit_card, eq: cardholder}
  bnpl_user: {attr: bnpl_use_12m, eq: bnpl_user}
  wallet_frequent: {attr: mobile_wallet_in_store, in: [weekly, most_purchases]}
  wallet_never: {attr: mobile_wallet_in_store, eq: never}

tables:
  unbanked_edu:
    label: "Relative weight of being unbanked, by education"
    values: {below_hs: 2.5, high_school: 1.3, some_college: 1.0, associate: 0.8, bachelor: 0.35, graduate: 0.25}
    sources: [fdic_2023]
    assumption: true
    justification: "FDIC: unbanked and underbanked rates fall steeply with education (underbanked 23.1% without a diploma vs 10.4% with a college degree). The detailed unbanked gradient could not be extracted; coefficients are assumed."
  underbanked_edu:
    label: "Relative weight of being underbanked, by education"
    values: {below_hs: 1.8, high_school: 1.2, some_college: 1.1, associate: 1.0, bachelor: 0.7, graduate: 0.6}
    sources: [fdic_2023]
    assumption: true
    justification: "Anchored on 23.1% (no diploma) vs 10.4% (college degree) of households; intermediate levels interpolated."
  bnpl_age:
    label: "BNPL use by age, relative to the 16% average"
    bands:
      - {from: 18, to: 29, value: 1.35}
      - {from: 30, to: 44, value: 1.3}
      - {from: 45, to: 59, value: 1.05}
      - {from: 60, to: 79, value: 0.55}
    sources: [shed_2025_credit]
    assumption: true
    justification: "SHED 2025: 22%, 21%, 17% and 9% by age band, divided by 16% and slightly rescaled so the product with the income and card factors stays near 16%."

attributes:
  - key: banking_status
    label: Banking status
    type: enum
    values:
      - {code: fully_banked, label: "fully banked (has a bank account)"}
      - {code: underbanked, label: "underbanked (has an account but also uses services such as money orders or check cashing)"}
      - {code: unbanked, label: "unbanked (no checking or savings account)"}
    distribution:
      sampler: quasi
      weights:
        fully_banked: 0.80
        underbanked:
          mul:
            - 0.135
            - cases:
                - {when: income_below_035, value: 2.0}
                - {when: income_below_065, value: 1.5}
                - {when: {attr: socle.living_standard_ratio, lt: 1.0}, value: 1.1}
                - {when: {attr: socle.living_standard_ratio, lt: 1.5}, value: 0.8}
                - {else: 0.5}
            - {lookup: underbanked_edu, by: socle.education}
            - cases:
                - {when: age_18_29, value: 1.2}
                - {when: age_30_49, value: 1.1}
                - {when: age_65_plus, value: 0.7}
                - {else: 0.95}
        unbanked:
          mul:
            - 0.045
            - cases:
                - {when: income_below_035, value: 3.5}
                - {when: income_below_065, value: 2.0}
                - {when: {attr: socle.living_standard_ratio, lt: 1.0}, value: 0.8}
                - {when: {attr: socle.living_standard_ratio, lt: 1.5}, value: 0.3}
                - {else: 0.1}
            - {lookup: unbanked_edu, by: socle.education}
            - cases:
                - {when: age_18_29, value: 1.2}
                - {when: age_65_plus, value: 0.85}
                - {else: 1.0}
            - {pick: socle.activity_status, values: {unemployed: 1.6, inactive: 1.3}, default: 1.0}
            - {if: no_smartphone, then: 1.3, else: 1.0}
    sources: [fdic_2023, shed_2025_full]
    assumption: true
    justification: "Adult-level targets of about 4.5% unbanked (FDIC 2023 households: 4.2%; SHED 2025 adults: 6%, so a value between the two, closer to the FDIC figure) and 15% underbanked (FDIC: 14.2%). Gradients by living standard, education, age and activity follow the FDIC and SHED patterns, but the detailed FDIC income and age tables could not be extracted, so coefficients are assumed. Race and nativity are not used. Unbanked is not tied to having no smartphone (small factor only). A probabilistic trait, not a basis to infer other traits."

  - key: has_credit_card
    label: Credit card holding
    type: enum
    values:
      - {code: cardholder, label: has a credit card}
      - {code: no_card, label: has no credit card}
    distribution:
      weights:
        cardholder:
          min:
            - 0.985
            - mul:
                - cases:
                    - {when: income_below_035, value: 0.46}
                    - {when: income_below_065, value: 0.71}
                    - {when: income_above_13, value: 0.97}
                    - {else: 0.88}
                - cases:
                    - {when: age_18_29, value: 0.88}
                    - {when: age_30_49, value: 1.02}
                    - {when: age_50_64, value: 1.08}
                    - {else: 1.12}
                - {pick: banking_status, values: {unbanked: 0.3, underbanked: 0.85}, default: 1.04}
        no_card:
          add:
            - 1
            - mul:
                - -1
                - min:
                    - 0.985
                    - mul:
                        - cases:
                            - {when: income_below_035, value: 0.46}
                            - {when: income_below_065, value: 0.71}
                            - {when: income_above_13, value: 0.97}
                            - {else: 0.88}
                        - cases:
                            - {when: age_18_29, value: 0.88}
                            - {when: age_30_49, value: 1.02}
                            - {when: age_50_64, value: 1.08}
                            - {else: 1.12}
                        - {pick: banking_status, values: {unbanked: 0.3, underbanked: 0.85}, default: 1.04}
    sources: [shed_2025_credit]
    assumption: true
    justification: "SHED 2025: 82% of adults have a credit card; by income 46%, 71%, 88%, 97% (under $25k, $25-49k, $50-99k, $100k+) and by age 65%, 78%, 86%, 92%. Income brackets are mapped to the socle living standard ratio (cutoffs 0.35, 0.65, 1.3: assumed mapping). Unbanked adults rarely hold a card (assumed factor). Two-code enum (the weights are the former Bernoulli probability and its complement) so that it can serve directly as a segment dimension."

  - key: carries_card_balance
    label: Carries a credit card balance
    type: enum
    when: holds_card
    values:
      - {code: carries_balance, label: "carried a balance from month to month in the past year"}
      - {code: pays_in_full, label: "usually pays the balance in full"}
    distribution:
      weights:
        carries_balance:
          min:
            - 0.9
            - mul:
                - cases:
                    - {when: income_below_065, value: 0.57}
                    - {when: income_above_13, value: 0.34}
                    - {else: 0.5}
                - cases:
                    - {when: age_18_29, value: 1.1}
                    - {when: age_30_49, value: 1.1}
                    - {when: age_50_64, value: 1.0}
                    - {else: 0.75}
                - {if: underbanked, then: 1.2, else: 0.98}
        pays_in_full:
          add:
            - 1
            - mul:
                - -1
                - min:
                    - 0.9
                    - mul:
                        - cases:
                            - {when: income_below_065, value: 0.57}
                            - {when: income_above_13, value: 0.34}
                            - {else: 0.5}
                        - cases:
                            - {when: age_18_29, value: 1.1}
                            - {when: age_30_49, value: 1.1}
                            - {when: age_50_64, value: 1.0}
                            - {else: 0.75}
                        - {if: underbanked, then: 1.2, else: 0.98}
    sources: [shed_2025_credit]
    assumption: true
    justification: "SHED 2025: 37% of all adults (45% of cardholders) carried a balance at least once in 12 months. Only the overall figure is published; gradients by income and age are assumed (higher at lower and middle incomes and under 45). Two-code enum (weights are the former Bernoulli probability and its complement) so that it can serve directly as a segment dimension."

  - key: p2p_apps
    label: Payment apps used
    type: set
    items:
      - {code: paypal, label: PayPal, card_label: PayPal, rate: {base: 0.66, factors: {age_18_29: 0.95, age_65_plus: 0.8, no_smartphone: 0.7, unbanked: 0.35, underbanked: 0.85, college: 1.12, tech_high: 1.15, tech_low: 0.75}}}
      - {code: venmo, label: Venmo, card_label: Venmo, rate: {base: 0.45, factors: {age_18_29: 1.5, age_30_49: 1.3, age_50_64: 0.74, age_65_plus: 0.4, no_smartphone: 0.3, unbanked: 0.4, underbanked: 0.85, college: 1.2, tech_high: 1.3, tech_low: 0.6, income_below_035: 0.8}}}
      - {code: zelle, label: Zelle, card_label: Zelle, rate: {base: 0.42, factors: {age_30_49: 1.2, age_50_64: 0.95, age_65_plus: 0.7, no_smartphone: 0.5, unbanked: 0.1, underbanked: 0.8, college: 1.15, tech_high: 1.2, tech_low: 0.7}}}
      - {code: cash_app, label: Cash App, card_label: Cash App, rate: {base: 0.32, factors: {age_18_29: 1.5, age_30_49: 1.2, age_50_64: 0.8, age_65_plus: 0.35, income_below_065: 1.3, income_above_13: 0.7, unbanked: 1.1, underbanked: 1.3, college: 0.75, no_smartphone: 0.3, tech_low: 0.7}}}
      - {code: apple_cash, label: Apple Cash, card_label: Apple Cash, rate: {base: 0.09, factors: {age_18_29: 1.8, age_30_49: 1.2, age_65_plus: 0.5, no_smartphone: 0.05, unbanked: 0.3, college: 1.2, tech_high: 1.8}}}
    rate_cap: 0.9
    display: {empty: none of the common payment apps}
    sources: [pew_payment_apps_2022]
    assumption: true
    justification: "Pew (July 2022, ever used): PayPal 57%, Venmo 38%, Zelle 36%, Cash App 26%, at least one of the four 76%; Venmo by age 57/49/28/15%. Options are drawn independently, so the share with no app is likely below the 24% implied by Pew (correlation not modelled beyond shared factors). Zelle depends on a bank account; Cash App is higher at lower incomes and among underbanked adults (income and banking status, not race). Apple Cash has no reliable figure (assumed)."

  - key: mobile_wallet_in_store
    label: Mobile wallet use in stores (Apple Pay, Google Pay, Samsung Pay)
    type: enum
    when: has_smartphone
    values:
      - {code: never, label: never pays with a phone wallet in stores}
      - {code: rarely, label: rarely pays with a phone wallet in stores}
      - {code: monthly, label: pays with a phone wallet in stores a few times a month}
      - {code: weekly, label: pays with a phone wallet in stores about weekly}
      - {code: most_purchases, label: pays with a phone wallet for most in-store purchases}
    distribution:
      sampler: quasi
      weights:
        never:
          mul:
            - 30
            - cases: [{when: age_65_plus, value: 1.7}, {when: age_50_64, value: 1.25}, {when: age_30_49, value: 0.85}, {else: 0.55}]
            - {pick: socle.tech_adoption, values: {innovator: 0.3, early_adopter: 0.5, early_majority: 0.9, late_majority: 1.4, laggard: 2.2}, default: 1}
            - {pick: banking_status, values: {unbanked: 1.5, underbanked: 1.2}, default: 1}
        rarely:
          mul:
            - 20
            - cases: [{when: age_65_plus, value: 1.2}, {when: age_50_64, value: 1.1}, {when: age_30_49, value: 0.95}, {else: 0.85}]
            - {pick: socle.tech_adoption, values: {innovator: 0.6, early_adopter: 0.8, early_majority: 1.0, late_majority: 1.15, laggard: 1.3}, default: 1}
            - {pick: banking_status, values: {unbanked: 1.1, underbanked: 1.05}, default: 1}
        monthly:
          mul:
            - 13
            - cases: [{when: age_65_plus, value: 0.9}, {when: age_50_64, value: 1.0}, {when: age_30_49, value: 1.05}, {else: 1.0}]
            - {pick: socle.tech_adoption, values: {innovator: 0.9, early_adopter: 1.0, early_majority: 1.0, late_majority: 1.0, laggard: 0.8}, default: 1}
            - {pick: banking_status, values: {unbanked: 0.8, underbanked: 0.95}, default: 1}
        weekly:
          mul:
            - 23
            - cases: [{when: age_65_plus, value: 0.65}, {when: age_50_64, value: 0.85}, {when: age_30_49, value: 1.1}, {else: 1.3}]
            - {pick: socle.tech_adoption, values: {innovator: 1.5, early_adopter: 1.3, early_majority: 1.05, late_majority: 0.8, laggard: 0.5}, default: 1}
            - {pick: banking_status, values: {unbanked: 0.6, underbanked: 0.9}, default: 1}
        most_purchases:
          mul:
            - 14
            - cases: [{when: age_65_plus, value: 0.4}, {when: age_50_64, value: 0.7}, {when: age_30_49, value: 1.15}, {else: 1.5}]
            - {pick: socle.tech_adoption, values: {innovator: 2.2, early_adopter: 1.6, early_majority: 1.05, late_majority: 0.6, laggard: 0.3}, default: 1}
            - {pick: banking_status, values: {unbanked: 0.5, underbanked: 0.8}, default: 1}
    sources: [atlanta_fed_2025, pymnts_wallet_2025]
    assumption: true
    justification: "No official in-store frequency distribution. Anchors: more than 72% paid with a phone at least once in 12 months (Atlanta Fed 2025, includes in-app and P2P, not verified); an industry survey reports over 30% use a wallet in store weekly (PYMNTS, not verified). Targets among smartphone owners are kept conservative (about 30% never). Only for smartphone owners; strong gradients by age and tech adoption (assumed)."

  - key: bnpl_use_12m
    label: Used buy now, pay later in the past 12 months
    type: enum
    values:
      - {code: bnpl_user, label: "used buy now, pay later in the past 12 months"}
      - {code: non_user, label: "did not use buy now, pay later in the past 12 months"}
    distribution:
      weights:
        bnpl_user:
          mul:
            - 0.15
            - {lookup: bnpl_age, by: socle.age}
            - cases:
                - {when: income_below_035, value: 1.1}
                - {when: income_below_065, value: 1.4}
                - {when: income_above_13, value: 0.75}
                - {else: 1.1}
            - cases:
                - {when: {attr: carries_card_balance, eq: carries_balance}, value: 1.3}
                - {when: {attr: has_credit_card, eq: no_card}, value: 0.9}
                - {else: 0.75}
            - {if: no_smartphone, then: 0.5, else: 1.0}
        non_user:
          add:
            - 1
            - mul:
                - -1
                - mul:
                    - 0.15
                    - {lookup: bnpl_age, by: socle.age}
                    - cases:
                        - {when: income_below_035, value: 1.1}
                        - {when: income_below_065, value: 1.4}
                        - {when: income_above_13, value: 0.75}
                        - {else: 1.1}
                    - cases:
                        - {when: {attr: carries_card_balance, eq: carries_balance}, value: 1.3}
                        - {when: {attr: has_credit_card, eq: no_card}, value: 0.9}
                        - {else: 0.75}
                    - {if: no_smartphone, then: 0.5, else: 1.0}
    sources: [shed_2025_credit]
    assumption: true
    justification: "SHED 2025: 16% of adults; by income 18%, 23%, 18%, 12%; by age 22%, 21%, 17%, 9%, so BNPL peaks in the middle-low income bracket and is not only a low-income behavior. Age and income are combined multiplicatively and calibrated to about 16%. Higher among adults who carry a card balance (assumed). Late payment and fees (26% of users paid late) are not encoded as a trait. Two-code enum (weights are the former Bernoulli probability and its complement) so that it can serve directly as a segment dimension."

  - key: preferred_online_payment
    label: Preferred way to pay online
    type: enum
    values:
      - {code: debit_card, label: "debit card (including prepaid)"}
      - {code: credit_card, label: "credit card"}
      - {code: paypal, label: "PayPal"}
      - {code: mobile_wallet, label: "mobile wallet (Apple Pay, Google Pay)"}
      - {code: bnpl, label: "buy now, pay later at checkout"}
      - {code: bank_transfer_or_other, label: "bank transfer or other method"}
    distribution:
      sampler: quasi
      weights:
        debit_card:
          mul:
            - 36
            - cases: [{when: income_below_065, value: 1.3}, {when: income_above_13, value: 0.8}, {else: 1.0}]
            - cases: [{when: age_18_29, value: 1.1}, {when: age_65_plus, value: 0.85}, {else: 1.0}]
            - {pick: banking_status, values: {unbanked: 0.5, underbanked: 1.2}, default: 1}
            - {if: holds_card, then: 1.0, else: 1.5}
        credit_card:
          if: holds_card
          then:
            mul:
              - 48
              - cases: [{when: income_below_035, value: 0.6}, {when: income_below_065, value: 0.85}, {when: income_above_13, value: 1.25}, {else: 1.0}]
              - {pick: banking_status, values: {unbanked: 0.6, underbanked: 0.8}, default: 1}
          else: 0
        paypal:
          mul:
            - 6
            - {pick: banking_status, values: {unbanked: 0.3, underbanked: 0.8}, default: 1}
            - {if: college, then: 1.1, else: 1.0}
            - {if: age_65_plus, then: 1.2, else: 1.0}
        mobile_wallet:
          if: has_smartphone
          then:
            mul:
              - 6
              - cases: [{when: age_18_29, value: 1.8}, {when: age_30_49, value: 1.3}, {when: age_50_64, value: 0.6}, {else: 0.3}]
              - {pick: socle.tech_adoption, values: {innovator: 2.0, early_adopter: 1.6, early_majority: 1.1, late_majority: 0.6, laggard: 0.3}, default: 1}
              - cases: [{when: wallet_frequent, value: 2.5}, {when: wallet_never, value: 0.4}, {else: 1.0}]
          else: 0
        bnpl:
          if: bnpl_user
          then: 6
          else: 0
        bank_transfer_or_other:
          mul:
            - 2.5
            - {pick: banking_status, values: {unbanked: 4, underbanked: 1.5}, default: 1}
    sources: [pew_methods_2026, atlanta_fed_2025]
    assumption: true
    justification: "Only the 92% card share (credit or debit) for online purchases is documented (Atlanta Fed 2025 via Pew); 38% most prefer credit cards across all payments. The split (credit about 48%, debit about 36%, PayPal 6%, wallet 6%, BNPL about 1%, other 2.5%) is assumed. Credit requires a card, BNPL requires recent use, wallets require a smartphone."

  - key: weekly_cash_use
    label: Cash use in a typical week
    type: enum
    values:
      - {code: no_cash, label: makes no purchases with cash in a typical week}
      - {code: some_cash, label: pays with cash for some purchases in a typical week}
      - {code: all_or_almost_all_cash, label: pays with cash for all or almost all purchases in a typical week}
    distribution:
      sampler: quasi
      weights:
        no_cash:
          mul:
            - cases: [{when: income_below_035, value: 24}, {when: income_below_065, value: 33}, {when: income_above_13, value: 58}, {else: 43}]
            - cases: [{when: age_18_29, value: 1.6}, {when: age_30_49, value: 1.05}, {when: age_50_64, value: 0.9}, {else: 0.68}]
            - {pick: banking_status, values: {unbanked: 0.12, underbanked: 0.6}, default: 1.1}
        some_cash:
          mul:
            - cases: [{when: income_below_035, value: 50}, {when: income_below_065, value: 51}, {when: income_above_13, value: 38}, {else: 47}]
            - {pick: banking_status, values: {underbanked: 1.05}, default: 1}
        all_or_almost_all_cash:
          mul:
            - cases: [{when: income_below_035, value: 26}, {when: income_below_065, value: 16}, {when: income_above_13, value: 4}, {else: 10}]
            - cases: [{when: age_18_29, value: 0.8}, {when: age_30_49, value: 0.85}, {when: age_50_64, value: 1.05}, {else: 1.4}]
            - {pick: banking_status, values: {unbanked: 3.0, underbanked: 1.6}, default: 0.8}
    sources: [pew_cash_2026, pew_methods_2026]
    assumption: true
    justification: "Pew (May-June 2026): 42% no cash, 46% some, 12% all or almost all; by household income no cash 24/33/43/58% and all or almost all 26/16/10/4%; no cash by age 51/46/37/33%. Income brackets mapped to the living standard ratio (assumed). The no-cash age factor for 18-29 was raised from 1.12 to 1.6 (assumed, calibrated) so that the simulated share of young adults with no cash purchases reaches Pew's 51% instead of about 42%. The 65+ factor was lowered from 0.82 to 0.68 (assumed, calibrated) because the simulated 65+ share (42.1%) exceeded the range around Pew's 33%. Other age factors and banking-status factors are assumed; unbanked adults skew to cash but are not all cash users."

card:
  - when: everyone
    template: "Banking: {banking_status}"
  - when: holds_card
    template: "Credit card: {has_credit_card}; {carries_card_balance}"
  - when: {attr: has_credit_card, eq: no_card}
    template: "Credit card: {has_credit_card}"
  - when: everyone
    template: "Payment apps used: {p2p_apps}"
  - when: has_smartphone
    template: "In stores: {mobile_wallet_in_store}"
  - when: everyone
    template: "Buy now, pay later: {bnpl_use_12m}"
  - when: everyone
    template: "Online, prefers to pay with: {preferred_online_payment}"
  - when: everyone
    template: "Cash: {weekly_cash_use}"

segments:
  - {id: paymentsBanking, attribute: banking_status, label: Banking status, compare: 3}
  - {id: paymentsCreditCard, attribute: has_credit_card, label: Credit card holding}
  - {id: paymentsCardBalance, attribute: carries_card_balance, label: Carries a card balance}
  - {id: paymentsWalletInStore, attribute: mobile_wallet_in_store, label: In-store mobile wallet use}
  - {id: paymentsBnpl, attribute: bnpl_use_12m, label: "Buy now, pay later use"}
  - {id: paymentsOnlineMethod, attribute: preferred_online_payment, label: Preferred online payment method}
  - {id: paymentsCashUse, attribute: weekly_cash_use, label: Weekly cash use}

eligibility_helpers:
  underserved_adults: "us-payments-fintech.banking_status in [unbanked, underbanked]"
  unbanked_adults: "us-payments-fintech.banking_status == unbanked"
  fully_banked_smartphone_users: "us-payments-fintech.banking_status == fully_banked and has_smartphone"
  card_balance_carriers: "us-payments-fintech.carries_card_balance == carries_balance"
  paid_in_full_cardholders: "us-payments-fintech.carries_card_balance == pays_in_full"
  bnpl_users: "us-payments-fintech.bnpl_use_12m == bnpl_user"
  regular_phone_wallet_users: "us-payments-fintech.mobile_wallet_in_store in [weekly, most_purchases]"
  phone_first_under_45: "age < 45 and us-payments-fintech.mobile_wallet_in_store in [weekly, most_purchases]"
  cash_first_adults: "us-payments-fintech.weekly_cash_use == all_or_almost_all_cash"
  paypal_online_preference: "us-payments-fintech.preferred_online_payment == paypal"

validation:
  margins:
    - {attribute: banking_status, title: "Banking status (expected from living standard, education, age and activity)"}
    - {attribute: mobile_wallet_in_store, title: "In-store mobile wallet use (expected from age, tech adoption and banking status)"}
    - {attribute: preferred_online_payment, title: "Preferred online payment method"}
    - {attribute: weekly_cash_use, title: "Cash use in a typical week (expected from income, age and banking status)"}
  shares:
    - label: "Unbanked adults (SHED 2025: 6%; FDIC 2023 households: 4.2%)"
      among: {attr: socle.age, gt: 17}
      share_of: unbanked
      range: [0.035, 0.085]
    - label: "Underbanked adults (FDIC 2023 households: 14.2%)"
      among: {attr: socle.age, gt: 17}
      share_of: underbanked
      range: [0.11, 0.19]
    - label: "Adults with a credit card (SHED 2025: 82%)"
      among: {attr: socle.age, gt: 17}
      share_of: holds_card
      range: [0.77, 0.87]
    - label: "Adults aged 18-29 with a credit card (SHED 2025: 65%)"
      among: age_18_29
      share_of: holds_card
      range: [0.57, 0.73]
    - label: "Adults who carried a card balance (SHED 2025: 37% of all adults)"
      among: {attr: socle.age, gt: 17}
      share_of: {attr: carries_card_balance, eq: carries_balance}
      range: [0.31, 0.43]
    - label: "Cardholders who carried a balance (SHED 2025: 45%)"
      among: holds_card
      share_of: {attr: carries_card_balance, eq: carries_balance}
      range: [0.39, 0.51]
    - label: "Adults who used BNPL in the past 12 months (SHED 2025: 16%)"
      among: {attr: socle.age, gt: 17}
      share_of: bnpl_user
      range: [0.13, 0.19]
    - label: "Adults aged 18-29 who used BNPL (SHED 2025: 22%)"
      among: age_18_29
      share_of: bnpl_user
      range: [0.16, 0.28]
    - label: "Adults aged 60+ who used BNPL (SHED 2025: 9%)"
      among: {attr: socle.age, gt: 59}
      share_of: bnpl_user
      range: [0.05, 0.13]
    - label: "Adults with no cash purchases in a typical week (Pew 2026: 42%)"
      among: {attr: socle.age, gt: 17}
      share_of: {attr: weekly_cash_use, eq: no_cash}
      range: [0.37, 0.47]
    - label: "Adults paying all or almost all with cash (Pew 2026: 12%)"
      among: {attr: socle.age, gt: 17}
      share_of: {attr: weekly_cash_use, eq: all_or_almost_all_cash}
      range: [0.09, 0.15]
    - label: "Adults aged 65+ with no cash purchases (Pew 2026: 33%)"
      among: age_65_plus
      share_of: {attr: weekly_cash_use, eq: no_cash}
      range: [0.26, 0.42]
    - label: "Adults aged 18-29 with no cash purchases (Pew 2026: 51%)"
      among: age_18_29
      share_of: {attr: weekly_cash_use, eq: no_cash}
      range: [0.44, 0.58]
    - label: "Adults preferring a card (credit or debit) for online purchases (Atlanta Fed 2025 via Pew: 92%, includes wallet-linked cards)"
      among: {attr: socle.age, gt: 17}
      share_of: {attr: preferred_online_payment, in: [debit_card, credit_card]}
      range: [0.78, 0.95]
    - label: "Smartphone owners using a wallet in stores weekly or more (industry survey: over 30%, not verified)"
      among: has_smartphone
      share_of: wallet_frequent
      range: [0.30, 0.50]

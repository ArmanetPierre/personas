# Module "Open-source software": awareness, work use, contribution, attitude and donation readiness.
# Generic module for the US socle, reusable by any developer tool, app or SaaS project.
# Most adults do not know the term: general-population shares are assumptions anchored on developer-survey ratios.
id: us-open-source
version: "2026.2"
changelog:
  - version: "2026.2"
    date: "2026-10-22"
    changes: ["First version (US socle): desktop OS, awareness (computer owners only), work use, contribution, employer sponsorship, attitude, donation readiness."]
label: Open-source software
short_label: Open source
description: >-
  Awareness and use of open-source software (Firefox, VLC, LibreOffice, Linux, WordPress, Signal) and main desktop OS
  for personas with a computer, use of open source in daily work for employed personas, contribution to projects
  (issues, docs, code, maintaining), employer sponsorship, attitude toward open source versus proprietary software,
  and openness to donating. Conditioned on occupation group, education, age, sex, tech adoption and computer ownership.
  Industry surveys (Stack Overflow, Linux Foundation, Tidelift, GitHub) are self-selected developer samples and are used
  for ratios only, not for absolute shares of the general population.
applies_to: [us]
requires: []

sources:
  statcounter_us_desktop:
    org: "StatCounter Global Stats"
    title: "Desktop Operating System Market Share United States Of America"
    year: 2026
    url: "https://gs.statcounter.com/os-market-share/desktop/united-states-of-america"
    detail: "Page views, not individuals, Sept 2026: Windows 64.45%, macOS (OS X + macOS) about 26.5%, ChromeOS 5.34%, Linux 3.69%. The Aug 2026 Linux spike (about 18%) is probably bot traffic and is ignored."
  so_survey_2025:
    org: "Stack Overflow"
    title: "Developer Survey 2025 (developers)"
    year: 2025
    url: "https://survey.stackoverflow.co/2025/developers"
    detail: "Professional developers (global, multi-select): Windows 49.5%, macOS 32.9%, Ubuntu 27.7%, WSL 16.8%, Linux outside WSL 16.7%. Self-selected sample. Not verified."
  lf_dei_gender:
    org: "Linux Foundation / literature review"
    title: "Women's Participation in Open Source Software: A Survey of the Literature"
    year: 2021
    url: "https://arxiv.org/abs/2105.08777"
    detail: "Women about 9.8% of OSS contributors (5.2% at Apache, 9.9% in the Linux kernel); an older Linux Foundation survey had 82% male respondents. Global developer samples. Not verified."
  lf_funding_2024:
    org: "Linux Foundation / GitHub / Harvard"
    title: "2024 Open Source Software Funding Report"
    year: 2024
    url: "https://opensourcefundingsurvey2024.com/"
    detail: "Organizations contribute $7.7B a year to OSS: 86% as employee and contractor labor, 14% as direct financial contributions. Global survey of organizations. Not verified."
  tidelift_2024:
    org: "Tidelift"
    title: "2024 State of the Open Source Maintainer Report"
    year: 2024
    url: "https://assets-eu-01.kc-usercontent.com/ef593040-b591-0198-9506-ed88b30bc023/d325a56f-05be-4379-bfd1-ee4776fcad41/2024-tidelift-state-of-the-open-source-maintainer-report-.pdf"
    detail: "About 400 maintainers (global): 60% call themselves unpaid hobbyists, 47% are not paid for maintaining. Not verified."
  github_octoverse_2025:
    org: "GitHub"
    title: "Octoverse 2025"
    year: 2025
    url: "https://github.blog/news-insights/octoverse/octoverse-a-new-developer-joins-github-every-second-as-ai-leads-typescript-to-1/"
    detail: "More than 180M developer accounts worldwide. Accounts are not people employed as developers. Not verified."
  bls_oews:
    org: "BLS"
    title: "Occupational Employment and Wages, May 2025"
    year: 2025
    url: "https://www.bls.gov/news.release/pdf/ocwage.pdf"
    detail: "Computer and mathematical occupations: about 5.26M wage and salary jobs in May 2025, about 3.4% of employment. Not verified."

conditions:
  employed: {attr: socle.activity_status, eq: employed}
  has_computer: {attr: socle.has_computer, eq: true}
  tech_pcs: {attr: socle.pcs, eq: computer_engineering_science}
  knowing: {attr: oss_awareness, eq: uses_knowingly}
  unknowing: {attr: oss_awareness, eq: uses_unknowingly}
  unaware: {attr: oss_awareness, eq: unaware}
  core_work: {attr: oss_work_use, eq: core_of_work}

tables:
  pcs_factor:
    label: "Occupation group factor for knowing use of open source"
    values:
      management: 1.4
      business_finance: 1.3
      computer_engineering_science: 5.0
      education_legal_community_arts: 1.2
      healthcare_practitioners: 0.8
      service: 0.6
      sales: 0.8
      office_admin: 0.8
      farming: 0.4
      construction: 0.5
      installation_repair: 0.7
      production: 0.5
      transportation: 0.5
      none: 0.8
    sources: [bls_oews]
    assumption: true
    justification: "No published general-population series. Software-heavy occupations (computer, engineering, science; about 3.4% of employment for computer and mathematical jobs alone, BLS) get a strong factor; other groups are set from an assumed education and computer-use gradient."
  education_factor:
    label: "Education factor for knowing use of open source"
    values: {below_hs: 0.4, high_school: 0.7, some_college: 1.0, associate: 1.0, bachelor: 1.5, graduate: 1.8}
    assumption: true
    justification: "Assumed gradient: awareness of software terms rises with education. No US general-population source."
  age_factor:
    label: "Age factor for knowing use of open source"
    bands:
      - {from: 18, to: 29, value: 1.3}
      - {from: 30, to: 44, value: 1.2}
      - {from: 45, to: 59, value: 0.9}
      - {from: 60, to: 79, value: 0.5}
    assumption: true
    justification: "Assumed: younger adults are more likely to know the term and to use named open-source apps."
  tech_factor:
    label: "Tech adoption factor for knowing use of open source"
    values: {innovator: 2.5, early_adopter: 1.8, early_majority: 1.0, late_majority: 0.55, laggard: 0.25}
    assumption: true
    justification: "Assumed: Rogers adoption profile is a proxy for curiosity about software."
  contribution_age_factor:
    label: "Age factor for contributing to open-source projects"
    bands:
      - {from: 18, to: 24, value: 1.0}
      - {from: 25, to: 44, value: 1.2}
      - {from: 45, to: 59, value: 0.7}
      - {from: 60, to: 79, value: 0.3}
    assumption: true
    justification: "Assumed: contributors skew toward 20-45 year olds (developer surveys); no US age breakdown found."

attributes:
  - key: oss_affinity_score
    label: Affinity score for knowing use of open source
    type: number
    when: {attr: socle.has_computer, eq: true}
    value:
      min:
        - 0.92
        - mul:
            - 0.16
            - {lookup: pcs_factor, by: socle.pcs}
            - {lookup: education_factor, by: socle.education}
            - {lookup: age_factor, by: socle.age}
            - {lookup: tech_factor, by: socle.tech_adoption}
    sources: [bls_oews]
    assumption: true
    justification: "Intermediate score (probability of knowingly using open source) used by the awareness weights. Multiplicative model on occupation group, education, age and tech adoption; base 0.16 chosen so that about 20% of computer owners know they use some. Drawn only for personas with a computer. No published general-population figure."

  - key: oss_awareness
    label: Awareness and use of open-source software
    type: enum
    when: {attr: socle.has_computer, eq: true}
    values:
      - {code: unaware, label: "does not know what open-source software is"}
      - {code: uses_unknowingly, label: "uses some without knowing it (browser engines, phones, web servers)"}
      - {code: uses_knowingly, label: "knowingly uses some (Firefox, VLC, LibreOffice, Linux, WordPress, Signal)"}
    distribution:
      weights:
        uses_knowingly: {attr: oss_affinity_score}
        uses_unknowingly: {mul: [0.38, {add: [1, {mul: [-1, {attr: oss_affinity_score}]}]}]}
        unaware: {mul: [0.62, {add: [1, {mul: [-1, {attr: oss_affinity_score}]}]}]}
    sources: [bls_oews]
    assumption: true
    justification: "No US survey on awareness of the term was found (Pew, Census and BLS are silent). Assumed about 50% unaware, 30% unknowing users and 20% knowing users among computer owners, with over 85% knowing in software-heavy occupations. Indirect use is near-universal (Android, browsers, servers), hence the middle category. Drawn only for personas with a computer; personas without one are treated as unaware by downstream attributes (default branches)."

  - key: desktop_os
    label: Main desktop or laptop operating system
    type: enum
    when: has_computer
    values:
      - {code: windows, label: Windows}
      - {code: macos, label: macOS}
      - {code: chromeos, label: ChromeOS}
      - {code: linux, label: Linux}
    distribution:
      weights:
        windows: {mul: [64.5, {if: tech_pcs, then: 0.75, else: 1.02}]}
        macos: {mul: [26.5, {if: tech_pcs, then: 1.4, else: 0.96}]}
        chromeos: {mul: [5.3, {if: tech_pcs, then: 0.4, else: 1.04}]}
        linux:
          mul:
            - 3.7
            - {if: tech_pcs, then: 2, else: 1}
            - {pick: socle.sex, values: {M: 1.3, F: 0.5}}
            - {if: knowing, then: 2.5, else: 0.6}
    sources: [statcounter_us_desktop, so_survey_2025]
    assumption: true
    justification: "Base weights are StatCounter US desktop shares (Sept 2026; page views, not people). Adjustments are assumed: developers and scientists use macOS and Linux more (Stack Overflow 2025), men and knowing open-source users choose Linux more. Factors are set so the average stays near the StatCounter split. Drawn only for personas with a computer."

  - key: oss_work_use
    label: Open source in daily work
    type: enum
    when: employed
    values:
      - {code: none, label: "no open-source software in their work"}
      - {code: some_tools, label: "uses some open-source libraries or tools at work"}
      - {code: core_of_work, label: "open source is at the core of their daily work"}
    distribution:
      weights:
        none: {cases: [{when: tech_pcs, value: 25}, {when: has_computer, value: 84}, {else: 98}]}
        some_tools:
          mul:
            - {cases: [{when: tech_pcs, value: 45}, {when: has_computer, value: 14}, {else: 2}]}
            - {cases: [{when: knowing, value: 1.5}, {when: unaware, value: 0.5}, {else: 1}]}
        core_of_work:
          mul:
            - {cases: [{when: tech_pcs, value: 30}, {when: has_computer, value: 2}, {else: 0.2}]}
            - {cases: [{when: knowing, value: 1.5}, {when: unaware, value: 0.2}, {else: 1}]}
    sources: [bls_oews, so_survey_2025]
    assumption: true
    justification: "The size of the computer and mathematical workforce (about 3.4% of employment) is sourced; usage shares are assumed from developer-survey context (about half of professional developers on Windows, Linux and WSL near 30%, heavy reliance on open-source tooling). The occupation group also includes engineering and science, so 'core of work' is capped near 30% there. Employed personas only."

  - key: oss_contribution
    label: Contribution to open-source projects
    type: enum
    when: knowing
    values:
      - {code: never, label: "has never contributed"}
      - {code: occasional, label: "contributes occasionally (bug reports, issues, documentation)"}
      - {code: regular_contributor, label: "regular code contributor"}
      - {code: maintainer, label: "maintains an open-source project"}
    distribution:
      weights:
        never: {if: tech_pcs, then: 60, else: 96}
        occasional:
          mul:
            - {if: tech_pcs, then: 25, else: 3.5}
            - {pick: socle.sex, values: {F: 0.25, M: 1.2}}
            - {lookup: contribution_age_factor, by: socle.age}
            - {pick: oss_work_use, values: {core_of_work: 2, some_tools: 1.2}, default: 0.6}
        regular_contributor:
          mul:
            - {if: tech_pcs, then: 11, else: 0.4}
            - {pick: socle.sex, values: {F: 0.17, M: 1.2}}
            - {lookup: contribution_age_factor, by: socle.age}
            - {pick: oss_work_use, values: {core_of_work: 2, some_tools: 1.2}, default: 0.6}
        maintainer:
          mul:
            - {if: tech_pcs, then: 4, else: 0.1}
            - {pick: socle.sex, values: {F: 0.17, M: 1.2}}
            - {lookup: contribution_age_factor, by: socle.age}
            - {pick: oss_work_use, values: {core_of_work: 2, some_tools: 1.2}, default: 0.6}
    sources: [lf_dei_gender, tidelift_2024, github_octoverse_2025]
    assumption: true
    justification: "The gender gap is sourced (women about 10% of contributors; global developer samples, no US-specific figure): the female factor of 0.17 on regular contributors and maintainers (0.25 kept for occasional contributors) targets roughly 10-12% women among regular contributors and maintainers; the preview with 0.25 gave 17.4%, above the declared 5-17% range. Absolute rates are assumed (15-25% occasional and 3-6% maintainers among knowing users in tech roles, under 4% occasional elsewhere). Only knowing users can contribute. GitHub accounts are not people employed as developers and are not used as a rate."

  - key: employer_sponsors_oss
    label: Employer sponsors or funds open source
    type: boolean
    when: {all: [employed, core_work]}
    rate: {pick: socle.class_of_worker, values: {private: 0.3, nonprofit: 0.15, government: 0.1, self_employed: 0.05}, default: 0.1}
    labels: {yes: "their employer sponsors or funds open source (donations, sponsorships or paid staff time)", no: "their employer does not fund open source"}
    sources: [lf_funding_2024]
    assumption: true
    justification: "Organizations give $7.7B a year to open source, 86% as labor and only 14% as direct money (global). Assumed about 30% of private-sector employers of core open-source workers give or sponsor in some form, much less elsewhere. Only for employed personas whose daily work is built on open source."

  - key: oss_attitude
    label: Attitude toward open source versus proprietary software
    type: enum
    values:
      - {code: prefers_proprietary_with_support, label: "prefers proprietary software with vendor support"}
      - {code: indifferent, label: "indifferent"}
      - {code: prefers_open_source_when_available, label: "prefers open source when available"}
      - {code: strong_advocate, label: "strong open-source advocate"}
    distribution:
      weights:
        prefers_proprietary_with_support:
          cases:
            - {when: knowing, value: {if: tech_pcs, then: 8, else: 12}}
            - {when: unknowing, value: 22}
            - {else: 25}
        indifferent:
          cases:
            - {when: knowing, value: {if: tech_pcs, then: 30, else: 45}}
            - {when: unknowing, value: 70}
            - {else: 74.5}
        prefers_open_source_when_available:
          mul:
            - cases:
                - {when: knowing, value: {if: tech_pcs, then: 42, else: 34}}
                - {when: unknowing, value: 7.5}
                - {else: 0.5}
            - {pick: oss_contribution, values: {occasional: 1.3, regular_contributor: 2, maintainer: 2.5}, default: 1}
        strong_advocate:
          mul:
            - cases:
                - {when: knowing, value: {if: tech_pcs, then: 20, else: 9}}
                - {when: unknowing, value: 0.5}
                - {else: 0.1}
            - {pick: oss_contribution, values: {occasional: 1.5, regular_contributor: 3, maintainer: 4}, default: 1}
    sources: [so_survey_2025]
    assumption: true
    justification: "No published US general-population figure. Assumed among adults about 20% prefer proprietary, 65% are indifferent, 13% prefer open source and 2% are strong advocates. Without awareness (or without a computer) 'indifferent' dominates; advocates are rare and concentrate among knowing users in tech roles and contributors."

  - key: oss_donation_readiness
    label: Openness to donating to open-source software
    type: enum
    values:
      - {code: never, label: "would not donate to open-source software"}
      - {code: would_tip_occasionally, label: "might tip or donate occasionally"}
      - {code: already_donates_or_pays_for_support, label: "already donates or pays for support"}
    distribution:
      weights:
        never:
          cases:
            - {when: knowing, value: 55}
            - {when: unknowing, value: 85}
            - {else: 97}
        would_tip_occasionally:
          mul:
            - cases:
                - {when: knowing, value: 30}
                - {when: unknowing, value: 14.5}
                - {else: 3}
            - {min: [1.8, {max: [0.4, {attr: socle.living_standard_ratio}]}]}
            - {pick: oss_attitude, values: {strong_advocate: 2.5, prefers_open_source_when_available: 1.6, prefers_proprietary_with_support: 0.5}, default: 1}
        already_donates_or_pays_for_support:
          mul:
            - cases:
                - {when: knowing, value: 15}
                - {when: unknowing, value: 0.5}
                - {else: 0}
            - {min: [1.8, {max: [0.4, {attr: socle.living_standard_ratio}]}]}
            - {pick: oss_attitude, values: {strong_advocate: 2.5, prefers_open_source_when_available: 1.6, prefers_proprietary_with_support: 0.5}, default: 1}
            - {pick: oss_contribution, values: {occasional: 1.2, regular_contributor: 1.5, maintainer: 1.5}, default: 1}
    sources: [lf_funding_2024, tidelift_2024]
    assumption: true
    justification: "Direct money is a small part of open-source support (14% of organizational contributions) and 60% of maintainers call themselves unpaid hobbyists, which points to scarce giving. No US consumer data: assumed about 3% already donate or pay for support among adults and about 15% of knowing users, none among unaware personas, rising with living standard and attitude."

card:
  - when: has_computer
    template: "Main computer OS: {desktop_os}"
  - when: has_computer
    template: "Open source: {oss_awareness}"
  - when: employed
    template: "Open source at work: {oss_work_use}"
  - when: knowing
    template: "Open-source contribution: {oss_contribution}"
  - when: core_work
    template: "Employer: {employer_sponsors_oss}"
  - "Attitude: {oss_attitude}"
  - "Donations: {oss_donation_readiness}"

segments:
  - {id: ossAwareness, attribute: oss_awareness, label: Open-source awareness, compare: 4}
  - {id: ossDesktopOs, attribute: desktop_os, label: Main desktop OS}
  - {id: ossWorkUse, attribute: oss_work_use, label: Open source in daily work}
  - {id: ossContribution, attribute: oss_contribution, label: Open-source contribution}
  - {id: usOssAttitude, attribute: oss_attitude, label: Attitude toward open source}
  - {id: ossDonation, attribute: oss_donation_readiness, label: Openness to donating}

eligibility_helpers:
  linux_user: "us-open-source.desktop_os == linux"
  oss_contributor: "us-open-source.oss_contribution in [occasional, regular_contributor, maintainer]"
  tech_worker: "pcs == computer_engineering_science and activity_status == employed"
  oss_advocate: "us-open-source.oss_attitude == strong_advocate"
  oss_knowing_user: "us-open-source.oss_awareness == uses_knowingly"
  oss_donor: "us-open-source.oss_donation_readiness == already_donates_or_pays_for_support"

validation:
  margins:
    - {attribute: desktop_os, title: "Main desktop OS (StatCounter US weights adjusted by occupation, sex and awareness)"}
    - {attribute: oss_awareness, title: "Open-source awareness (expected from the affinity score)"}
    - {attribute: oss_work_use, title: "Open source in daily work (expected from occupation)"}
    - {attribute: oss_contribution, title: "Open-source contribution (expected among knowing users)"}
    - {attribute: oss_attitude, title: "Attitude toward open source (expected)"}
    - {attribute: oss_donation_readiness, title: "Openness to donating (expected)"}
  shares:
    - label: "Windows among personas with a computer (StatCounter US, Sept 2026: 64.5% of page views)"
      among: has_computer
      share_of: {attr: desktop_os, eq: windows}
      range: [0.58, 0.70]
    - label: "macOS among personas with a computer (StatCounter US: about 26.5%)"
      among: has_computer
      share_of: {attr: desktop_os, eq: macos}
      range: [0.21, 0.32]
    - label: "ChromeOS among personas with a computer (StatCounter US: 5.3%)"
      among: has_computer
      share_of: {attr: desktop_os, eq: chromeos}
      range: [0.03, 0.08]
    - label: "Linux among personas with a computer (StatCounter US: 3.7% of page views)"
      among: has_computer
      share_of: {attr: desktop_os, eq: linux}
      range: [0.02, 0.06]
    - label: "Women among regular contributors and maintainers (literature review: about 10%)"
      among: {attr: oss_contribution, in: [regular_contributor, maintainer]}
      share_of: {attr: socle.sex, eq: F}
      range: [0.05, 0.17]

# Module "Software tools at work and hybrid / remote work" (Singapore socle).
# Generic and reusable by any app or SaaS project. Only employed personas get values (other personas: null).
# Format: docs/modules.md. Declaration order = draw order. No socle_overrides, no affects_budget.
# Does not condition on ethnicity, religion or home_language.
id: sg-work-software
version: "2026.2"
changelog:
  - version: "2026.2"
    date: "2026-10-22"
    changes:
      - "First version (sg-2026.2): form of employment, employer type, desk-based job, work arrangement, work software stack, generative AI use at work, who pays for work software, role in choosing it."
      - "Draft revision (version unchanged, never accepted): generative AI use recalibrated on IMDA 2025 and PwC Hopes and Fears 2026 (desk workers about 70 % any use, non-desk about 20 %); desk_profile removed and desk_based_job turned into the enum (desk_based / away_from_desk); desk, payer and decision-role weights adjusted to reach their declared shares."
label: Work software and hybrid work
short_label: Work tools
description: >-
  Employed people in Singapore only: form of employment (employee, own-account worker or freelancer, employer),
  type and size of employer (SME, large private firm, public sector, household), whether the job is mainly
  desk or computer-based (only asked of people with a computer), where work is done (on-site, hybrid, mostly remote), the work software used regularly
  (Microsoft 365/Teams, Google Workspace, Slack, project tools, accounting tools, messaging apps...), generative AI
  use at work, who pays for work software and the person's role in choosing it. Generic: not tied to any product.
  Conditioned on SSOC group, age, education, residency status (work pass holders and domestic workers are
  modelled as mostly on-site with low desk-job exposure), device access, tech adoption and living standard.
applies_to: [sg]
requires: []

sources:
  mom_lf_2024:
    org: "Ministry of Manpower (MOM)"
    title: "Labour Force in Singapore 2024"
    year: 2024
    url: "https://stats.mom.gov.sg/iMAS_PdfLibrary/mrsd_2024Labourforce.pdf"
    detail: "Employed residents: self-employed 11.8 %, own-account workers 8.1 %, contributing family workers 0.2 %, employees about 88 %; employers about 3.5 % by subtraction (not published). Seen via search summary only (PDF not read)."
  mom_lf_2025:
    org: "Ministry of Manpower (MOM)"
    title: "Labour Force in Singapore 2025"
    year: 2025
    url: "https://stats.mom.gov.sg/iMAS_PdfLibrary/mrsd_2025Labourforce.pdf"
    detail: "Self-employed 11.8 % of employed residents; primary own-account workers 7.3 %; 49.7 % of regular primary own-account workers chose it for flexibility of hours and location. Search summary only."
  mom_pq_telework:
    org: "Ministry of Manpower (MOM)"
    title: "Written answer to PQ on proportion of workforce telecommuting"
    year: 2023
    url: "https://www.mom.gov.sg/newsroom/parliament-questions-and-replies/2023/0207-written-answer-to-pq-on-proportion-of-workforce-telecommuting"
    detail: "2022 MOM survey: 34 % of employed residents worked from home at some point in the survey month (occasional work from home, not regular hybrid). Page opened and confirmed; it lists flexible formulas (flexi-time, flexi-shift, flexi-load) without percentages."
  singstat_sme:
    org: "SingStat"
    title: "Singapore Enterprise Landscape (infographic, 2024 data)"
    year: 2024
    url: "https://www.singstat.gov.sg/modules/infographics/singapore-enterprise-landscape"
    detail: "SMEs: 99 % of enterprises and about 70 % of total employment (3.59 million jobs); excludes migrant domestic workers, own-account workers and contributing family workers. SME = revenue up to S$100m or up to 200 workers. Search summary only (page returned 404 when re-checked)."
  ey_2024:
    org: "EY"
    title: "Employers in Singapore drive higher GenAI adoption and continue to value flexible work arrangements (Work Reimagined 2024)"
    year: 2024
    url: "https://www.ey.com/en_sg/newsroom/2024/10/employers-in-singapore-drive-higher-genai-adoption-and-continue-to-value-flexible-work-arrangements"
    detail: "50 employers: 76 % allow remote work 2-4 days a week, 16 % support fully remote, 2 % expect fully on-site. 250 employees: 79 % use GenAI (24 % in 2023). Small samples, online panel skewed to white-collar staff."
  imda_pulse_2025:
    org: "IMDA (via AAP / Cision press release)"
    title: "Singapore's Digital Economy at 18.6% of GDP... (Singapore Digital Economy Report 2025, pulse survey)"
    year: 2025
    url: "https://aapnews.aap.com.au/aapreleases/cision20251006AE88109"
    detail: "Online pulse survey of about 320 working Singaporeans (May-June 2025): 73.8 % use AI tools at work, often several times a week or daily (no frequency split published). Small online sample, probably skewed to white-collar workers; no breakdown by occupation. Page opened."
  pwc_hf_2026_sg:
    org: "PwC (via Red Hot Singapore)"
    title: "PwC Global Workforce Hopes and Fears Survey 2026, Singapore"
    year: 2026
    url: "https://www.redhot.sg/singapore-workers-embrace-ai-faster-than-global-peers-but-fewer-feel-secure-in-their-jobs-pwc-survey-726913.html"
    detail: "1,000 respondents in Singapore (May-June 2026): 28 % use GenAI daily at work, 45 % at least weekly (41 % a year earlier). No breakdown by occupation. Page opened."
  pwc_hf_2026_peoplematters:
    org: "PwC (via People Matters Global)"
    title: "Singapore AI adoption hits 74%, but job security confidence falls to 69%: PwC"
    year: 2026
    url: "https://sea.peoplemattersglobal.com/amp/news/ai-and-emerging-tech/singapore-ai-adoption-hits-74percent-but-job-security-confidence-falls-to-69percent-pwc-52694"
    detail: "Singapore 2026: 74 % used AI at work in the last 12 months (69 % in 2025); daily GenAI 28 %; weekly or more 45 %. Page opened."
  salesforce_yougov_2026:
    org: "Salesforce / YouGov (via Dataconomy)"
    title: "Only 6% Of Singapore Desk Workers Use AI Daily"
    year: 2026
    url: "https://dataconomy.com/2026/07/08/singapore-workers-ai-daily-usage-6-percent-salesforce/"
    detail: "More than 1,500 desk workers in 14 markets (Dec 2025-Jan 2026): 6 % of Singapore desk workers use AI as the core of their daily tasks (11 % globally). Very strict definition, not comparable with self-declared daily use; used as a lower bound only. Page opened."
  msft_wti_sg_2026:
    org: "Microsoft"
    title: "Microsoft's 2026 Work Trend Index shows Singapore workforce ahead on AI adoption"
    year: 2026
    url: "https://news.microsoft.com/source/asia/2026/06/16/microsofts-2026-work-trend-index-shows-singapore-workforce-ahead-on-ai-adoption-with-organisations-poised-to-capture-greater-value/"
    detail: "2,000 full-time workers in Singapore (Feb-Apr 2026). Among AI users, only 24 % report clear leadership alignment on AI. No adoption rate on the page."
  windowsnews_wti:
    org: "Windows News (secondary)"
    title: "Microsoft Report: Singapore Workers Racing Ahead With AI, But Employers Stuck in Neutral"
    year: 2026
    url: "https://windowsnews.ai/article/microsoft-report-singapore-workers-racing-ahead-with-ai-but-employers-stuck-in-neutral.428699"
    detail: "Secondary report: about 88 % of Singapore knowledge workers use AI at work (2026). Not confirmed on Microsoft's own page."
  pasona_2024:
    org: "Pasona"
    title: "Singapore Employees' Working Conditions 2024"
    year: 2024
    url: "https://pasona.com.sg/sg-working-conditions-2024/"
    detail: "84.5 % of employees have at least one scheduled flexible work arrangement; scheduled tele-working provided to about 70 % of PMETs. Private survey, search summary only."
  randstad_2024:
    org: "Randstad"
    title: "Workmonitor: flexible work a must-have in Singapore"
    year: 2024
    url: "https://www.randstad.com.sg/hr-trends/employer-brand/flexible-work-a-must-have-for-singapore-randstad-workmonitor/"
    detail: "49 % of Singapore workers would leave a job requiring more office days (preference, not incidence). Search summary only."

conditions:
  employed: {attr: socle.activity_status, in: [employed]}
  resident: {attr: socle.residency_status, in: [citizen, pr]}
  mdw: {attr: socle.residency_status, eq: mdw}
  low_pass: {attr: socle.residency_status, in: [wp, mdw]}
  own_account: {attr: employment_form, eq: own_account_worker}
  business_owner: {attr: employment_form, eq: employer}
  employed_with_computer: {all: [{attr: socle.activity_status, in: [employed]}, {attr: socle.has_computer, eq: true}]}
  desk: {attr: desk_based_job, eq: desk_based}
  # desk_based_job is null for people without a computer: they count as "not desk"
  not_desk: {not: {attr: desk_based_job, eq: desk_based}}
  sme: {attr: employer_type, eq: sme}
  large_private: {attr: employer_type, eq: large_private}
  public: {attr: employer_type, eq: public_or_gov_linked}
  large_or_public: {any: [{attr: employer_type, eq: large_private}, {attr: employer_type, eq: public_or_gov_linked}]}
  household_employer: {attr: employer_type, eq: household_employer}
  early_tech: {attr: socle.tech_adoption, in: [innovator, early_adopter]}
  late_tech: {attr: socle.tech_adoption, in: [late_majority, laggard]}
  young: {attr: socle.age, lt: 35}
  no_computer: {attr: socle.has_computer, eq: false}
  manager: {attr: socle.pcs, eq: "1"}
  professional: {attr: socle.pcs, in: ["2", "3"]}
  clerical: {attr: socle.pcs, eq: "4"}
  sales_service: {attr: socle.pcs, eq: "5"}
  low_income: {attr: socle.living_standard_ratio, lt: 0.7}
  high_income: {attr: socle.living_standard_ratio, gt: 1.6}
  hybrid_or_remote: {attr: work_arrangement, in: [hybrid, mostly_remote]}

tables:
  own_account_age:
    label: "Age coefficient for own-account work (residents)"
    bands:
      - {from: 18, to: 29, value: 0.35}
      - {from: 30, to: 39, value: 0.7}
      - {from: 40, to: 49, value: 0.9}
      - {from: 50, to: 59, value: 1.3}
      - {from: 60, to: 79, value: 2.2}
    sources: [mom_lf_2024]
    assumption: true
    justification: "MOM gives about 8.1 % own-account workers overall; the age gradient (older workers more often own-account) is assumed; coefficients average about 1 over the employed age structure."
  employer_age:
    label: "Age coefficient for being an employer (runs a business with staff)"
    bands:
      - {from: 18, to: 29, value: 0.15}
      - {from: 30, to: 39, value: 0.7}
      - {from: 40, to: 49, value: 1.2}
      - {from: 50, to: 59, value: 1.5}
      - {from: 60, to: 79, value: 1.6}
    sources: [mom_lf_2024]
    assumption: true
    justification: "Employers about 3.5 % of employed residents (derived by subtraction, not published); age profile assumed, rising with seniority."
  desk_pcs_rate:
    label: "Probability that the job is mainly desk or computer-based, by SSOC major group"
    values: {"1": 1.0, "2": 1.0, "3": 0.9, "4": 0.95, "5": 0.35, "6": 0.02, "7": 0.05, "8": 0.02, "9": 0.05, none: 0.1}
    assumption: true
    justification: "No published statistic gives the desk-based share by SSOC. Values follow the nature of each occupation group (managers, professionals and clerical: almost all desk; service and sales: a sizeable minority, e.g. back-office, online sales; trades, operators, labourers: almost none). Raised in the draft revision so that the declared shares are reached (employed people without a computer are not desk-based, which pulls the observed share down)."
  genai_age_factor:
    label: "Age coefficient for generative AI use at work"
    bands:
      - {from: 18, to: 29, value: 1.3}
      - {from: 30, to: 44, value: 1.15}
      - {from: 45, to: 54, value: 0.9}
      - {from: 55, to: 64, value: 0.6}
      - {from: 65, to: 79, value: 0.45}
    sources: [ey_2024]
    assumption: true
    justification: "EY 2024 reports higher adoption among Gen Z and millennials than Gen X and Boomers (split unclear); magnitudes assumed and deliberately steeper at 55+."
  genai_edu_factor:
    label: "Education coefficient for generative AI use at work"
    values: {below_secondary: 0.35, secondary: 0.6, post_secondary: 0.8, diploma: 1.0, degree: 1.2}
    assumption: true
    justification: "Graduates work more with text, data and analysis tasks where GenAI is used; gradient assumed."
  genai_tech_factor:
    label: "Tech-adoption coefficient for generative AI use at work"
    values: {innovator: 1.8, early_adopter: 1.5, early_majority: 1.0, late_majority: 0.6, laggard: 0.3}
    assumption: true
    justification: "Follows the Rogers profile of the socle; magnitudes assumed."
  genai_employer_factor:
    label: "Employer-type coefficient for generative AI use at work"
    values: {sme: 0.95, large_private: 1.05, public_or_gov_linked: 0.8, household_employer: 0.3, no_employer: 1.1}
    sources: [msft_wti_sg_2026]
    assumption: true
    justification: "Microsoft WTI 2026: only 24 % of AI users report clear leadership alignment on AI; public bodies assumed more restrictive, self-employed freer to use tools."
  genai_residency_factor:
    label: "Residency coefficient for generative AI use at work"
    values: {citizen: 1.0, pr: 1.0, ep: 1.15, spass: 0.9, wp: 0.3, mdw: 0.1, dependant: 0.9, student: 1.1}
    assumption: true
    justification: "Work Permit holders and domestic workers mostly hold non-desk jobs and have little access to work accounts and devices (no source found: values assumed, lowered in the draft revision to keep them much below residents); Employment Pass holders are mostly professionals."
  decision_age_factor:
    label: "Age coefficient for deciding on work software"
    bands:
      - {from: 18, to: 29, value: 0.35}
      - {from: 30, to: 39, value: 0.85}
      - {from: 40, to: 54, value: 1.2}
      - {from: 55, to: 79, value: 1.0}
    assumption: true
    justification: "Purchasing authority grows with seniority; no published source."

attributes:
  - key: employment_form
    label: Form of employment
    type: enum
    when: employed
    values:
      - {code: employee, label: employee}
      - {code: own_account_worker, label: "own-account worker or freelancer"}
      - {code: employer, label: "employer (runs a business with staff)"}
    distribution:
      weights:
        employee:
          cases:
            - {when: resident, value: 0.882}
            - {else: 1}
        own_account_worker:
          cases:
            - when: resident
              value:
                mul:
                  - 0.081
                  - {lookup: own_account_age, by: socle.age}
                  - {pick: socle.pcs, values: {"1": 0.6, "2": 1.0, "3": 0.9, "4": 0.4, "5": 1.4, "7": 1.5, "8": 1.8, "9": 1.0}, default: 1}
                  - {pick: socle.education, values: {below_secondary: 1.2, degree: 0.95}, default: 1}
            - {else: 0}
        employer:
          cases:
            - when: resident
              value:
                mul:
                  - 0.035
                  - {lookup: employer_age, by: socle.age}
                  - {pick: socle.pcs, values: {"1": 3.0, "2": 0.8, "3": 0.5, "4": 0.1, "5": 1.0, "7": 1.0, "8": 0.15, "9": 0.05}, default: 0.3}
            - {else: 0}
    sources: [mom_lf_2024, mom_lf_2025]
    assumption: true
    justification: "Resident marginals from MOM (about 88 % employees, 8.1 % own-account, about 3.5 % employers by subtraction; PDFs not opened, figures seen through search summaries, hence assumption). Non-residents (EP, S Pass, WP, domestic workers, dependants) are employees by construction because passes are tied to an employer. Age and SSOC gradients are assumed."

  - key: employer_type
    label: Type and size of employer
    type: enum
    when: employed
    values:
      - {code: sme, label: "SME (up to 200 staff)"}
      - {code: large_private, label: "large private firm"}
      - {code: public_or_gov_linked, label: "public sector or government-linked organisation"}
      - {code: household_employer, label: "private household (domestic worker)"}
      - {code: no_employer, label: "no employer (self-employed)"}
    distribution:
      weights:
        sme:
          cases:
            - {when: mdw, value: 0}
            - {when: own_account, value: 0}
            - {when: business_owner, value: 1}
            - else:
                mul:
                  - 0.70
                  - {pick: socle.pcs, values: {"1": 0.95, "2": 0.9, "5": 1.15, "7": 1.2, "9": 1.1}, default: 1}
                  - {pick: socle.residency_status, values: {wp: 1.3, spass: 1.1, ep: 0.8}, default: 1}
                  - {pick: socle.education, values: {degree: 0.9, below_secondary: 1.1}, default: 1}
        large_private:
          cases:
            - {when: mdw, value: 0}
            - {when: own_account, value: 0}
            - {when: business_owner, value: 0}
            - else:
                mul:
                  - 0.20
                  - {pick: socle.pcs, values: {"1": 1.05, "2": 1.15, "5": 0.9, "7": 0.8}, default: 1}
                  - {pick: socle.residency_status, values: {ep: 1.5, wp: 0.7, spass: 0.9}, default: 1}
        public_or_gov_linked:
          cases:
            - {when: mdw, value: 0}
            - {when: own_account, value: 0}
            - {when: business_owner, value: 0}
            - else:
                mul:
                  - 0.10
                  - {pick: socle.pcs, values: {"1": 0.8, "2": 1.4, "3": 1.3, "4": 1.2, "5": 0.3, "7": 0.2, "8": 0.5}, default: 1}
                  - {pick: socle.residency_status, values: {citizen: 1.6, pr: 0.6, ep: 0.05, spass: 0.02, wp: 0, dependant: 0.3, student: 0.5}, default: 1}
        household_employer:
          cases:
            - {when: mdw, value: 1}
            - {else: 0}
        no_employer:
          cases:
            - {when: own_account, value: 1}
            - {else: 0}
    sources: [singstat_sme]
    assumption: true
    justification: "SMEs hold about 70 % of employment excluding own-account workers and domestic workers (SingStat, search summary; page not re-opened, 404 on re-check); the 30 % large-firm group is split between private (about 20 %) and public or government-linked (about 10 %, not sourced). Conditioning on SSOC and residency (citizens dominate the public sector, work pass holders almost absent) is assumed. Domestic workers work for private households."

  - key: desk_based_job
    label: Job is mainly desk or computer-based
    type: enum
    # Only asked of people with a computer; others are null and treated as "not desk" by the conditions.
    # Enum (instead of a boolean) so that it can be used directly as a segment; replaces the former desk_profile mirror.
    when: employed_with_computer
    values:
      - {code: desk_based, label: "mainly desk or computer-based work"}
      - {code: away_from_desk, label: "mainly work away from a desk"}
    distribution:
      weights:
        desk_based:
          min:
            - 1
            - mul:
                - {lookup: desk_pcs_rate, by: socle.pcs}
                - {pick: socle.residency_status, values: {wp: 0.35, mdw: 0.02, spass: 0.95, dependant: 0.9}, default: 1}
                - {pick: socle.education, values: {below_secondary: 0.8, secondary: 0.95}, default: 1}
        away_from_desk:
          add:
            - 1
            - mul:
                - -1
                - min:
                    - 1
                    - mul:
                        - {lookup: desk_pcs_rate, by: socle.pcs}
                        - {pick: socle.residency_status, values: {wp: 0.35, mdw: 0.02, spass: 0.95, dependant: 0.9}, default: 1}
                        - {pick: socle.education, values: {below_secondary: 0.8, secondary: 0.95}, default: 1}
    sources: [mom_lf_2024]
    assumption: true
    justification: "No published statistic gives the desk-based share by SSOC; values follow the nature of each group. Work Permit holders and domestic workers are set low. Only drawn for people with a computer; employed people without a computer are treated as not desk-based. This attribute gates the software stack, AI and purchasing attributes. Weights raised in the draft revision to reach the declared shares (the earlier version gave 39 % of employed and 81 % of SSOC 1-2)."

  - key: work_arrangement
    label: Where work is done
    type: enum
    when: employed
    values:
      - {code: fully_on_site, label: "fully on-site"}
      - {code: hybrid, label: "hybrid (some days remote)"}
      - {code: mostly_remote, label: "mostly remote"}
    distribution:
      weights:
        fully_on_site:
          cases:
            - {when: not_desk, value: 0.975}
            - else:
                mul:
                  - 0.25
                  - {pick: employer_type, values: {public_or_gov_linked: 1.3, sme: 1.12, household_employer: 3, no_employer: 0.6}, default: 1}
                  - {pick: socle.residency_status, values: {wp: 2.0, spass: 1.5, mdw: 2.0}, default: 1}
                  - {pick: socle.tech_adoption, values: {laggard: 1.3, late_majority: 1.15, early_adopter: 0.85, innovator: 0.8}, default: 1}
        hybrid:
          cases:
            - {when: not_desk, value: 0.022}
            - else:
                mul:
                  - 0.60
                  - {pick: employer_type, values: {no_employer: 0.55, sme: 0.95, household_employer: 0.1}, default: 1}
                  - {pick: socle.residency_status, values: {wp: 0.5, spass: 0.8, mdw: 0.1}, default: 1}
                  - cases:
                      - {when: {attr: socle.children_under_12, gt: 0}, value: 1.1}
                      - {else: 1}
                  - {pick: socle.tech_adoption, values: {laggard: 0.8, late_majority: 0.9, early_adopter: 1.1, innovator: 1.1}, default: 1}
        mostly_remote:
          cases:
            - {when: not_desk, value: 0.003}
            - else:
                mul:
                  - 0.15
                  - {pick: employer_type, values: {no_employer: 2.4, public_or_gov_linked: 0.6, sme: 0.95, household_employer: 0.2}, default: 1}
                  - {pick: socle.residency_status, values: {wp: 0.3, spass: 0.6, mdw: 0.1}, default: 1}
                  - cases:
                      - {when: {attr: socle.children_under_12, gt: 0}, value: 1.2}
                      - {else: 1}
                  - {pick: socle.tech_adoption, values: {innovator: 1.3, early_adopter: 1.25, late_majority: 0.7, laggard: 0.5}, default: 1}
    sources: [ey_2024, mom_pq_telework, pasona_2024]
    assumption: true
    justification: "No official incidence of regular hybrid or remote work. EY 2024 (50 employers): 76 % allow remote work 2-4 days a week, 16 % fully remote; MOM 2022 (page opened): 34 % of employed residents worked from home at least once in the month (upper bound); Pasona: scheduled tele-working offered to about 70 % of PMETs. MOM gives no percentage for the other flexible formulas (flexi-time, flexi-shift, flexi-load). Target for desk workers: about 25 % on-site, 60 % hybrid, 15 % mostly remote (assumption, adjusted downward for non-desk jobs). The Tripartite Guidelines on Flexible Work Arrangement Requests (2024) only give a right to request, so they fix no shares."

  - key: work_software_stack
    label: Work software used regularly
    type: set
    when: employed
    rate_cap: 0.92
    items:
      - code: microsoft_365_teams
        label: Microsoft 365 / Teams
        card_label: Microsoft 365 / Teams
        rate: {base: 0.25, factors: {desk: 2.6, not_desk: 0.25, large_private: 1.3, public: 1.15, own_account: 0.7, no_computer: 0.5, low_pass: 0.4}}
      - code: google_workspace
        label: Google Workspace
        card_label: Google Workspace
        rate: {base: 0.22, factors: {desk: 1.5, not_desk: 0.3, sme: 1.3, own_account: 1.4, early_tech: 1.2, young: 1.2, public: 0.4, large_private: 0.8, no_computer: 0.5, low_pass: 0.4}}
      - code: slack
        label: Slack
        card_label: Slack
        rate: {base: 0.05, factors: {desk: 2.0, not_desk: 0.2, early_tech: 2.0, young: 1.5, sme: 1.2, public: 0.3, own_account: 0.8, no_computer: 0.5, low_pass: 0.4}}
      - code: zoom_meet
        label: Zoom / Google Meet
        card_label: Zoom / Google Meet
        rate: {base: 0.15, factors: {desk: 2.3, not_desk: 0.3, own_account: 1.5, early_tech: 1.2, public: 0.7, no_computer: 0.5, low_pass: 0.4}}
      - code: project_tools
        label: "Project and task tools (Asana, Trello, Jira, Monday...)"
        card_label: "project tools (Asana, Trello, Jira...)"
        rate: {base: 0.05, factors: {desk: 3.0, not_desk: 0.3, professional: 1.6, manager: 1.5, early_tech: 1.6, young: 1.2, no_computer: 0.5, low_pass: 0.4}}
      - code: notion_docs
        label: "Notion and collaborative docs"
        card_label: Notion
        rate: {base: 0.04, factors: {desk: 2.5, not_desk: 0.2, early_tech: 2.0, young: 1.6, own_account: 1.5, public: 0.4, late_tech: 0.4, no_computer: 0.5, low_pass: 0.4}}
      - code: accounting_invoicing
        label: "Accounting and invoicing (Xero, QuickBooks...)"
        card_label: "accounting and invoicing tools"
        rate: {base: 0.03, factors: {own_account: 7, business_owner: 12, clerical: 3, desk: 2, sme: 1.3, not_desk: 0.5, no_computer: 0.5, low_pass: 0.3}}
      - code: crm
        label: "CRM and sales tools"
        card_label: "CRM / sales tools"
        rate: {base: 0.03, factors: {desk: 2.5, sme: 1.2, business_owner: 3, early_tech: 1.3, sales_service: 2.5, not_desk: 0.4, public: 0.5, no_computer: 0.5, low_pass: 0.3}}
      - code: design_tools
        label: "Design tools (Canva, Figma, Adobe...)"
        card_label: "design tools (Canva, Figma, Adobe...)"
        rate: {base: 0.04, factors: {desk: 2.5, not_desk: 0.2, young: 1.6, own_account: 2.0, early_tech: 1.5, public: 0.8, late_tech: 0.5, no_computer: 0.5, low_pass: 0.3}}
      - code: messaging_apps_for_work
        label: "Messaging apps used for work (WhatsApp, Telegram, WeChat)"
        card_label: "WhatsApp / Telegram for work"
        rate: {base: 0.62, factors: {sme: 1.2, own_account: 1.3, large_private: 0.8, public: 0.7, not_desk: 1.1, household_employer: 1.4, late_tech: 0.85}}
      - code: company_apps
        label: "Company-specific apps (rostering, POS, HR portal, field-service apps)"
        card_label: "company apps (rostering, POS, HR portal)"
        rate: {base: 0.18, factors: {not_desk: 2.0, large_private: 1.5, public: 1.3, desk: 1.2, own_account: 0.3, household_employer: 0.1}}
    display: {template: "{value}", empty: "none of the usual office tools"}
    sources: [singstat_sme]
    assumption: true
    justification: "No Singapore figures on software adoption by persona were found. Structure assumed from firm-size patterns: large firms and the public sector lean on Microsoft 365/Teams, SMEs and own-account workers on Google Workspace, messaging apps and accounting tools; Slack and Notion are concentrated among younger, early-adopter desk workers; non-desk workers mostly use messaging and company apps. Work pass holders and domestic workers have much lower exposure. Zoom/Meet overlaps with video_tools of productivite-reunions (FR module), not required here."

  - key: genai_work_frequency
    label: Generative AI use at work
    type: enum
    when: employed
    values:
      - {code: never, label: never}
      - {code: occasional, label: "occasionally (less than weekly)"}
      - {code: weekly, label: weekly}
      - {code: daily, label: daily}
    distribution:
      weights:
        never:
          cases:
            - {when: desk, value: 0.25}
            - {else: 0.85}
        occasional:
          cases:
            - when: desk
              value:
                mul:
                  - 0.27
                  - {lookup: genai_age_factor, by: socle.age}
                  - {lookup: genai_edu_factor, by: socle.education}
                  - {lookup: genai_tech_factor, by: socle.tech_adoption}
                  - {lookup: genai_employer_factor, by: employer_type}
                  - {lookup: genai_residency_factor, by: socle.residency_status}
            - else:
                mul:
                  - 0.30
                  - {lookup: genai_age_factor, by: socle.age}
                  - {lookup: genai_edu_factor, by: socle.education}
                  - {lookup: genai_tech_factor, by: socle.tech_adoption}
                  - {lookup: genai_employer_factor, by: employer_type}
                  - {lookup: genai_residency_factor, by: socle.residency_status}
        weekly:
          cases:
            - when: desk
              value:
                mul:
                  - 0.30
                  - {lookup: genai_age_factor, by: socle.age}
                  - {lookup: genai_edu_factor, by: socle.education}
                  - {lookup: genai_tech_factor, by: socle.tech_adoption}
                  - {lookup: genai_employer_factor, by: employer_type}
                  - {lookup: genai_residency_factor, by: socle.residency_status}
            - else:
                mul:
                  - 0.17
                  - {lookup: genai_age_factor, by: socle.age}
                  - {lookup: genai_edu_factor, by: socle.education}
                  - {lookup: genai_tech_factor, by: socle.tech_adoption}
                  - {lookup: genai_employer_factor, by: employer_type}
                  - {lookup: genai_residency_factor, by: socle.residency_status}
        daily:
          cases:
            - when: desk
              value:
                mul:
                  - 0.18
                  - {lookup: genai_age_factor, by: socle.age}
                  - {lookup: genai_edu_factor, by: socle.education}
                  - {lookup: genai_tech_factor, by: socle.tech_adoption}
                  - {lookup: genai_employer_factor, by: employer_type}
                  - {lookup: genai_residency_factor, by: socle.residency_status}
            - else:
                mul:
                  - 0.09
                  - {lookup: genai_age_factor, by: socle.age}
                  - {lookup: genai_edu_factor, by: socle.education}
                  - {lookup: genai_tech_factor, by: socle.tech_adoption}
                  - {lookup: genai_employer_factor, by: employer_type}
                  - {lookup: genai_residency_factor, by: socle.residency_status}
    sources: [imda_pulse_2025, pwc_hf_2026_sg, pwc_hf_2026_peoplematters, salesforce_yougov_2026, ey_2024, msft_wti_sg_2026, windowsnews_wti]
    assumption: true
    justification: "Headline figures (all online panels, probably skewed to white-collar staff, no occupation breakdown): IMDA pulse survey 2025, 73.8 % of about 320 workers use AI tools at work; PwC Hopes and Fears 2026 (1,000 Singapore respondents), 74 % used AI at work in 12 months, 45 % GenAI weekly or more, 28 % daily; EY 2024, 79 % of 250 employees. Targets for desk workers: about 70 % any use (range 60-80 %), weekly or more about 45 % (40-55 %), daily about 15 % (Salesforce/YouGov: only 6 % use AI as the core of their daily tasks, a strict definition used as a lower bound). Non-desk workers (about 20 %, range 15-25 %) and the very low values for work permit holders and domestic workers have no source: assumptions. A secondary outlet's 88 % (Windows News) is not used for calibration. The split into frequency bands and the gradients by age, education, tech adoption, employer and residency are assumptions. Intentional overlap with ai_work_usage of productivite-reunions (FR only)."

  - key: software_payer
    label: Who pays for work software
    type: enum
    when: employed
    values:
      - {code: employer_pays_all, label: "the employer or business pays for all work software"}
      - {code: mixed_some_own_pocket, label: "the employer pays most, some tools paid out of own pocket"}
      - {code: mostly_own_pocket, label: "mostly pays for own work software"}
      - {code: not_applicable, label: "no paid work software involved"}
    distribution:
      weights:
        employer_pays_all:
          cases:
            - {when: own_account, value: 0.08}
            - {when: business_owner, value: 0.35}
            - {when: not_desk, value: 0.17}
            - {when: large_or_public, value: 0.9}
            - {else: 0.62}
        mixed_some_own_pocket:
          mul:
            - cases:
                - {when: own_account, value: 0.12}
                - {when: business_owner, value: 0.25}
                - {when: not_desk, value: 0.03}
                - {when: large_or_public, value: 0.09}
                - {else: 0.30}
            - cases:
                - {when: low_income, value: 0.7}
                - {when: high_income, value: 1.25}
                - {else: 1}
        mostly_own_pocket:
          mul:
            - cases:
                - {when: own_account, value: 0.80}
                - {when: business_owner, value: 0.40}
                - {when: not_desk, value: 0}
                - {when: large_or_public, value: 0.01}
                - {else: 0.08}
            - cases:
                - {when: low_income, value: 0.7}
                - {when: high_income, value: 1.25}
                - {else: 1}
        not_applicable:
          cases:
            - {when: desk, value: 0}
            - {when: own_account, value: 0.15}
            - {else: 0.8}
    sources: [mom_lf_2025]
    assumption: true
    justification: "No published figures on who pays for work software. Assumed: employees of large firms and the public sector mostly have everything paid; SME staff more often pay some tools themselves; own-account workers mostly pay their own (MOM: half of regular own-account workers chose this status for flexibility, search summary only), including those whose job is away from a desk (low weight on 'no paid software' for them, adjusted in the draft revision); non-desk employees mostly involve no paid software. Lower living standard slightly reduces out-of-pocket payment."

  - key: software_decision_role
    label: Role in choosing work software
    type: enum
    when: employed
    values:
      - {code: end_user_only, label: "end user only"}
      - {code: influencer, label: "influences the choice"}
      - {code: decision_maker, label: "decides or signs off the choice"}
      - {code: not_applicable, label: "not involved (no work software to choose)"}
    distribution:
      weights:
        end_user_only:
          cases:
            - {when: own_account, value: 0.05}
            - {when: business_owner, value: 0.03}
            - {when: not_desk, value: 0.42}
            - else:
                mul:
                  - {pick: socle.pcs, values: {"1": 0.2, "2": 0.5, "3": 0.55, "4": 0.9, "5": 0.7}, default: 0.85}
                  - cases:
                      - {when: large_or_public, value: 1.3}
                      - {else: 1}
        influencer:
          cases:
            - {when: own_account, value: 0.05}
            - {when: business_owner, value: 0.05}
            - {when: not_desk, value: 0.03}
            - else: {pick: socle.pcs, values: {"1": 0.35, "2": 0.35, "3": 0.3, "4": 0.1, "5": 0.2}, default: 0.1}
        decision_maker:
          cases:
            - {when: own_account, value: 0.95}
            - {when: business_owner, value: 0.96}
            - {when: not_desk, value: 0.005}
            - else:
                mul:
                  - {pick: socle.pcs, values: {"1": 0.45, "2": 0.15, "3": 0.15, "4": 0.02, "5": 0.1}, default: 0.05}
                  - cases:
                      - {when: sme, value: 1.4}
                      - {when: large_or_public, value: 0.5}
                      - {else: 1}
                  - {lookup: decision_age_factor, by: socle.age}
        not_applicable:
          cases:
            - {when: own_account, value: 0.03}
            - {when: business_owner, value: 0.02}
            - {when: not_desk, value: 0.55}
            - {else: 0}
    sources: [singstat_sme]
    assumption: true
    justification: "Role-based reasoning only; no published source. Employers and own-account workers decide for their own tools, whether or not their job is desk-based (the 'not involved' weight is small for them, adjusted in the draft revision); managers in SMEs decide most often (about 40-45 %), large firms keep most decisions in IT and procurement, professionals mostly influence, clerical and junior staff are end users. Useful as a B2B SaaS targeting filter."

card:
  - when: employed
    template: "Employment: {employment_form}; employer: {employer_type}"
  - when: employed_with_computer
    template: "Work setup: {desk_based_job}; {work_arrangement}"
  - when: no_computer
    template: "Work setup: {work_arrangement}"
  - when: employed
    template: "Work software used regularly: {work_software_stack}"
  - when: employed
    template: "Generative AI at work: {genai_work_frequency}"
  - when: employed
    template: "Software costs: {software_payer}; role in choosing it: {software_decision_role}"

segments:
  - {id: workSoftwareArrangement, attribute: work_arrangement, label: Work arrangement, compare: 1}
  - {id: workSoftwareEmployerType, attribute: employer_type, label: Employer type and size, compare: 2}
  - {id: workSoftwareEmploymentForm, attribute: employment_form, label: Form of employment}
  - {id: workSoftwareDeskBased, attribute: desk_based_job, label: Desk-based job}
  - {id: workSoftwareGenAi, attribute: genai_work_frequency, label: Generative AI use at work, compare: 3}
  - {id: workSoftwarePayer, attribute: software_payer, label: Who pays for work software}
  - {id: workSoftwareDecisionRole, attribute: software_decision_role, label: Role in choosing work software}

eligibility_helpers:
  desk_worker: "sg-work-software.desk_based_job == desk_based"
  hybrid_or_remote: "sg-work-software.work_arrangement in [hybrid, mostly_remote]"
  fully_on_site: "sg-work-software.work_arrangement == fully_on_site"
  genai_weekly_or_more: "sg-work-software.genai_work_frequency in [weekly, daily]"
  genai_daily: "sg-work-software.genai_work_frequency == daily"
  pays_own_software: "sg-work-software.software_payer in [mixed_some_own_pocket, mostly_own_pocket]"
  software_decision_maker: "sg-work-software.software_decision_role == decision_maker"
  software_buyer_or_influencer: "sg-work-software.software_decision_role in [decision_maker, influencer]"
  own_account_or_employer: "sg-work-software.employment_form in [own_account_worker, employer]"
  sme_staff: "sg-work-software.employer_type == sme and sg-work-software.employment_form == employee"
  sme_decision_maker: "sg-work-software.employer_type == sme and sg-work-software.software_decision_role == decision_maker"
  large_firm_hybrid_professional: "sg-work-software.employer_type in [large_private, public_or_gov_linked] and sg-work-software.work_arrangement == hybrid and pcs in [1, 2, 3]"

validation:
  margins:
    - {attribute: employment_form, title: "Form of employment (expected given residency, age and SSOC)"}
    - {attribute: employer_type, title: "Employer type and size (expected given form of employment, SSOC and residency)"}
    - {attribute: desk_based_job, title: "Desk-based job (expected given SSOC, residency and education)"}
    - {attribute: work_arrangement, title: "Work arrangement (expected given desk-based job, employer and residency)"}
    - {attribute: genai_work_frequency, title: "Generative AI use at work (expected)"}
    - {attribute: software_payer, title: "Who pays for work software (expected)"}
    - {attribute: software_decision_role, title: "Role in choosing work software (expected)"}
  shares:
    - label: "Employees among employed residents (MOM Labour Force 2024: about 88 %)"
      among: {all: [employed, resident]}
      share_of: {attr: employment_form, eq: employee}
      range: [0.85, 0.91]
    - label: "Own-account workers among employed residents (MOM 2024: 8.1 %)"
      among: {all: [employed, resident]}
      share_of: {attr: employment_form, eq: own_account_worker}
      range: [0.06, 0.10]
    - label: "Employers among employed residents (derived from MOM 2024: about 3.5 %, not published)"
      among: {all: [employed, resident]}
      share_of: {attr: employment_form, eq: employer}
      range: [0.02, 0.05]
    - label: "SME employment among workers with an employer, excluding domestic workers (SingStat: about 70 %)"
      among:
        all:
          - employed
          - {not: own_account}
          - {not: mdw}
      share_of: sme
      range: [0.60, 0.78]
    - label: "Desk-based jobs among employed (assumption, no published figure)"
      among: employed
      share_of: desk
      range: [0.42, 0.65]
    - label: "Desk-based jobs among SSOC 1-2 (assumption: 90-95 %)"
      among: {all: [employed, {attr: socle.pcs, in: ["1", "2"]}, resident]}
      share_of: desk
      range: [0.85, 0.97]
    - label: "Hybrid or mostly remote among all employed (MOM 2022: 34 % worked from home at least once in the month, upper bound)"
      among: employed
      share_of: hybrid_or_remote
      range: [0.20, 0.40]
    - label: "Hybrid or mostly remote among desk workers (EY 2024: 76 % of employers allow 2-4 remote days; Pasona: about 70 % of PMETs offered; assumption 55-80 %)"
      among: {all: [employed, desk]}
      share_of: hybrid_or_remote
      range: [0.55, 0.80]
    - label: "Fully on-site among non-desk workers (assumption: about 97 %)"
      among: {all: [employed, not_desk]}
      share_of: {attr: work_arrangement, eq: fully_on_site}
      range: [0.95, 1.0]
    - label: "Any generative AI use among desk workers (IMDA pulse 2025: 73.8 % of workers; PwC 2026: 74 % in 12 months; both panels skew white-collar)"
      among: {all: [employed, desk]}
      share_of: {attr: genai_work_frequency, in: [occasional, weekly, daily]}
      range: [0.60, 0.80]
    - label: "Generative AI weekly or more among desk workers (PwC Hopes and Fears 2026: 45 % of Singapore workers)"
      among: {all: [employed, desk]}
      share_of: {attr: genai_work_frequency, in: [weekly, daily]}
      range: [0.40, 0.55]
    - label: "Generative AI daily among desk workers (PwC 2026: 28 % of all workers; Salesforce/YouGov: 6 % as core of daily tasks; assumption 8-22 %)"
      among: {all: [employed, desk]}
      share_of: {attr: genai_work_frequency, eq: daily}
      range: [0.08, 0.22]
    - label: "Any generative AI use among non-desk workers (assumption, no source: 15-25 %)"
      among: {all: [employed, not_desk]}
      share_of: {attr: genai_work_frequency, in: [occasional, weekly, daily]}
      range: [0.15, 0.25]
    - label: "Any generative AI use among work permit holders and domestic workers (assumption: well below residents, under 12 %)"
      among: {all: [employed, low_pass]}
      share_of: {attr: genai_work_frequency, in: [occasional, weekly, daily]}
      range: [0.0, 0.12]
    - label: "Mostly paying own work software among own-account workers (assumption: about 80 %)"
      among: {all: [employed, own_account]}
      share_of: {attr: software_payer, eq: mostly_own_pocket}
      range: [0.65, 0.90]
    - label: "Decision makers on work software among employers and own-account workers (assumption: about 90 %)"
      among: {all: [employed, {any: [own_account, business_owner]}]}
      share_of: {attr: software_decision_role, eq: decision_maker}
      range: [0.85, 0.95]

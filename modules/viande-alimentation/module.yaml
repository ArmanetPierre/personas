# Module « Viande et contraintes alimentaires » (socle sg) : contrainte alimentaire du foyer, lieux d'achat,
# dépense mensuelle en viande, viandes préférées.
# S'applique à tout adulte du socle Singapour. Libellés et lignes de fiche en anglais.
# Format : docs/modules.md. L'ordre de déclaration est l'ordre de tirage.
id: viande-alimentation
version: "2026.3"
changelog:
  - version: "2026.3"
    date: "2026-10-20"
    changes: ["Attributs sensibles déclarés (religion/ethnie du socle), avec justification ; distributions inchangées."]
  - version: "2026.2"
    date: "2026-10-16"
    changes: ["Première version (socle sg) : contrainte alimentaire, lieux d'achat, dépense en viande, viandes préférées. Employées de maison et résidents de dortoirs : pas d'achat de viande pour leur foyer (valeurs nulles). La réception et le barbecue relèvent du module barbecue-reception."]
label: Meat buying and dietary restrictions
short_label: Meat
description: >-
  Dietary restriction of the household (halal, no pork, no beef, vegetarian), usual places to buy meat,
  household monthly meat spend in S$, and preferred meats. Domestic workers and dormitory residents do not
  buy meat for their own household (employer's or provided meals). Conditioned on religion, ethnicity,
  dwelling, household type, age, living standard and smartphone use.
applies_to: [sg]
requires: []

sources:
  hes2023_yahoo:
    org: "Yahoo News Singapore (citing SingStat HES 2023)"
    title: "How Much Does The Average Singaporean Household Spend Each Month On Groceries?"
    year: 2024
    url: "https://sg.news.yahoo.com/much-does-average-singaporean-household-000046743.html"
    detail: "Resident households, HES 2023: S$69.60/month on meat (about 15% of the food subtotal of S$424.40); total groceries S$349.80 (lowest quintile) to S$492.10 (top quintile), almost flat"
  singstat_hes2023:
    org: "SingStat"
    title: "Report on the Household Expenditure Survey 2023"
    year: 2024
    url: "https://www.singstat.gov.sg/publication-resources/report-on-the-household-expenditure-survey-2023"
    detail: "Not opened. The meat line by quintile and household size comes from the Table Builder."
  census2020_religion:
    org: "SingStat / Wikipedia (summary of Census 2020)"
    title: "Islam in Singapore / Census 2020 religion"
    year: 2020
    url: "https://en.wikipedia.org/wiki/Islam_in_Singapore"
    detail: "Residents: Buddhism 31.1%, Christianity 18.9%, Islam 15.6%, Taoism 8.8%, Hinduism 5.0%, no religion 20.0%; about 80% of Muslims are Malay, 99% of Hindus are Indian. Not verified."
  sfa_food_stats_2021:
    org: "Singapore Food Agency"
    title: "Singapore Food Statistics 2021"
    year: 2021
    url: "https://www.sfa.gov.sg/docs/default-source/publication/sg-food-statistics/singapore-food-statistics-2021.pdf"
    detail: "Supply of chicken, pork, beef and mutton (PDF not read). Not verified."
  indexbox_pork:
    org: "IndexBox"
    title: "Singapore's Fresh or Chilled Pig Meat Market Report 2026"
    year: 2026
    url: "https://www.indexbox.io/store/singapore-fresh-or-chilled-pig-meat-market-analysis-forecast-size-trends-and-insights/"
    detail: "Retail is about 30-40% of pork demand, split across supermarkets, wet markets and online; no split by channel. Industry estimate, not verified."

conditions:
  condo_landed: {attr: socle.dwelling, in: [condo, landed]}
  hdb_small: {attr: socle.dwelling, in: [hdb_1_2, hdb_3]}
  dorm: {attr: socle.dwelling, eq: dormitory}
  domestic_worker: {attr: socle.residency_status, eq: mdw}
  no_own_purchase: {any: [domestic_worker, dorm]}
  age_50_plus: {attr: socle.age, gt: 49}
  young_adult: {all: [{attr: socle.age, gt: 24}, {attr: socle.age, lt: 46}]}
  young_children: {attr: socle.children_under_12, gt: 0}
  no_smartphone: {attr: socle.has_smartphone, eq: false}
  high_income: {attr: socle.living_standard_ratio, gt: 1.3}
  low_income: {attr: socle.living_standard_ratio, lt: 0.7}
  chinese: {attr: socle.ethnicity, eq: chinese}
  malay: {attr: socle.ethnicity, eq: malay}
  indian: {attr: socle.ethnicity, eq: indian}
  vegetarian: {attr: dietary_restriction, eq: vegetarian}
  buys_meat_for_household: {all: [{not: vegetarian}, {not: no_own_purchase}]}
  no_pork_diet: {attr: dietary_restriction, in: [halal_strict, no_pork, vegetarian]}
  no_beef_diet: {attr: dietary_restriction, in: [no_beef, vegetarian]}

tables:
  household_size_factor:
    label: "Meat spend factor by household type (proxy for household size)"
    values: {alone: 0.5, couple_no_child: 0.85, couple_with_children: 1.3, single_parent: 1.0, with_parents: 1.35, other: 0.6}
    sources: [hes2023_yahoo]
    assumption: true
    justification: "HES 2023 average S$69.60 per resident household; scaling by household type is assumed (alone about S$30-40, couple about S$55-65, family with children about S$80-100). To be replaced by the Table Builder by household size."
  income_factor:
    label: "Meat spend factor by living standard ratio (spend rises only modestly with income)"
    bands:
      - {from: 0, to: 0.6, value: 0.8}
      - {from: 0.6, to: 1.0, value: 0.92}
      - {from: 1.0, to: 1.5, value: 1.05}
      - {from: 1.5, to: 3.0, value: 1.2}
      - {from: 3.0, to: 100, value: 1.3}
    sources: [hes2023_yahoo]
    assumption: true
    justification: "The grocery budget is almost flat across quintiles (S$350 lowest to S$492 top, HES 2023), so the income gradient is mild. Exact values are assumed."
  dwelling_spend_factor:
    label: "Meat spend factor by dwelling"
    values: {hdb_1_2: 0.75, hdb_3: 0.9, hdb_4: 1.0, hdb_5_exec: 1.05, condo: 1.15, landed: 1.25, dormitory: 0.4, other: 0.8}
    assumption: true
    justification: "Condo and landed households about 1.2 times the average (assumed); dormitory residents mostly eat catered meals (the attribute is null for them, the entry is kept for completeness)."
  diet_spend_factor:
    label: "Meat spend factor by dietary restriction"
    values: {none: 1.0, halal_strict: 0.95, no_pork: 0.85, no_beef: 0.9, vegetarian: 0.1}
    assumption: true
    justification: "Vegetarian households about 10% of the average (other members, guests); other restrictions remove one meat, partly replaced by others."

attributes:
  - key: dietary_restriction
    label: Household dietary restriction
    type: enum
    values:
      - {code: none, label: no dietary restriction}
      - {code: halal_strict, label: strictly halal}
      - {code: no_pork, label: no pork}
      - {code: no_beef, label: no beef}
      - {code: vegetarian, label: vegetarian}
    distribution:
      given: socle.religion
      sampler: quasi
      table:
        islam: {halal_strict: 96, vegetarian: 2, none: 2}
        hinduism: {no_beef: 62, vegetarian: 23, none: 15}
        sikhism: {no_beef: 40, vegetarian: 40, none: 20}
        buddhism: {none: 86, vegetarian: 10, no_beef: 4}
        taoism: {none: 88, vegetarian: 8, no_beef: 4}
        christianity: {none: 97, vegetarian: 2, no_pork: 1}
        other: {none: 90, vegetarian: 6, no_beef: 2, no_pork: 2}
        "none": {none: 97, vegetarian: 3}
        default: {none: 95, vegetarian: 3, no_beef: 1, no_pork: 1}
    sources: [census2020_religion]
    assumption: true
    justification: "Religion shares are from Census 2020 (not verified); dietary rules by religion are assumptions (Islam → halal about 96%; Hinduism → no beef about 62%, vegetarian about 23%; Sikhism no beef or vegetarian; Buddhism and Taoism vegetarian 8-10%). No survey of household restrictions found; MUIS halal data not consulted. Applied at household level."
    sensitive: true
    sensitive_justification: "Religion (Census 2020) drives the household dietary rule (halal, no pork, no beef, vegetarian): a buying constraint for any meat or food offer, not a preference. Read at household level only; no trait, opinion or behaviour is attached to the religion itself, and the narrative checks (checkNarrative) stay active."

  - key: meat_channels
    label: Usual places to buy meat
    type: set
    when: buys_meat_for_household
    items:
      - {code: wet_market, label: wet market, card_label: "wet market", rate: {base: 0.45, factors: {age_50_plus: 1.4, hdb_small: 1.2, condo_landed: 0.7, young_adult: 0.85}}}
      - {code: supermarket_mass, label: "mass supermarket (NTUC FairPrice, Sheng Siong)", card_label: "mass supermarket (FairPrice, Sheng Siong)", rate: {base: 0.8, factors: {high_income: 0.85}}}
      - {code: supermarket_premium, label: "premium supermarket (Cold Storage)", card_label: "premium supermarket (Cold Storage)", rate: {base: 0.2, factors: {condo_landed: 2.0, high_income: 1.6, low_income: 0.4, hdb_small: 0.5}}}
      - {code: premium_butcher, label: "premium butcher (Prime Butchery, Huber's)", card_label: "premium butcher (e.g. Huber's)", rate: {base: 0.08, factors: {condo_landed: 2.0, high_income: 2.0, low_income: 0.3, hdb_small: 0.4}}}
      - {code: online_grocery, label: "online grocery (RedMart, Shopee)", card_label: "online grocery (RedMart, Shopee)", rate: {base: 0.35, factors: {young_adult: 1.3, age_50_plus: 0.6, young_children: 1.3, no_smartphone: 0.3}}}
      - {code: online_butcher, label: online butcher, card_label: "online butcher", rate: {base: 0.1, factors: {condo_landed: 1.8, young_adult: 1.3, age_50_plus: 0.5, high_income: 1.5, no_smartphone: 0.2}}}
    rate_cap: 0.95
    min_items: 1
    display: {template: "{value}", empty: does not buy meat}
    sources: [indexbox_pork]
    assumption: true
    justification: "No published split by channel (IndexBox only says retail is split across supermarkets, wet markets and online). Assumed base rates: mass supermarkets about 80%, wet market about 45% (higher for 50+ and HDB), premium supermarkets about 20% and premium butchers about 8% (higher in condo/landed and top incomes), online grocery about 35%, online butcher about 10%. Absent for vegetarian households, domestic workers and dormitory residents (employer's or provided meals). To validate."

  - key: monthly_meat_spend
    label: Household monthly spend on meat
    type: number
    unit: S$/month
    when: {not: no_own_purchase}
    value:
      round:
        mul:
          - 65
          - {lookup: household_size_factor, by: socle.household_type}
          - {add: [1, {mul: [0.08, {attr: socle.children_under_12}]}]}
          - {lookup: income_factor, by: socle.living_standard_ratio}
          - {lookup: dwelling_spend_factor, by: socle.dwelling}
          - {lookup: diet_spend_factor, by: dietary_restriction}
          - {exp: {mul: [0.35, {normal: {}}]}}
    display: {format: eur, template: "about {value} a month"}
    sources: [hes2023_yahoo, singstat_hes2023]
    assumption: true
    justification: "Mean calibrated on HES 2023 (S$69.60 per resident household per month, Yahoo/SingStat; base 65 before the lognormal noise with sigma 0.35). Scaling by household type, children, income and dwelling is assumed and should be replaced with the Table Builder breakdown. Null for domestic workers and dormitory residents."

  - key: preferred_meats
    label: Preferred meats
    type: set
    when: buys_meat_for_household
    items:
      - {code: pork, label: pork, card_label: pork, rate: {base: 0.62, factors: {no_pork_diet: 0, chinese: 1.3, malay: 0.2, indian: 0.5}}}
      - {code: beef, label: beef, card_label: beef, rate: {base: 0.5, factors: {no_beef_diet: 0, indian: 0.6, chinese: 0.9, high_income: 1.2}}}
      - {code: lamb, label: lamb, card_label: lamb, rate: {base: 0.15, factors: {malay: 2.0, indian: 1.6, chinese: 0.7, condo_landed: 1.5, high_income: 1.3}}}
      - {code: chicken, label: chicken, card_label: chicken, rate: {base: 0.88, factors: {young_adult: 0.95}}}
    min_items: 1
    display: {template: "{value}", empty: no meat}
    sources: [sfa_food_stats_2021]
    assumption: true
    justification: "No consumer preference survey found. Chicken is the near-universal baseline (about 85%); pork excluded for halal and no-pork households and mostly Chinese elsewhere; beef about 45% overall, none for no-beef households; lamb about 15%, more among Malay and Indian households and in condo/landed. SFA supply statistics (PDF unread) could calibrate it. Null for vegetarian households, domestic workers and dormitory residents."
    sensitive: true
    sensitive_justification: "Ethnicity only tilts the meat mix (lamb, pork) on top of the dietary rule, with modest assumed coefficients; needed so that meat offers meet realistic households. No other trait is derived from ethnicity, and the narrative checks stay active."

card:
  - "Diet: {dietary_restriction}"
  - "Buys meat at: {meat_channels}"
  - "Household meat spend: {monthly_meat_spend}"
  - "Preferred meats: {preferred_meats}"

segments:
  - {id: meatDiet, attribute: dietary_restriction, label: Household dietary restriction}

eligibility_helpers:
  halal_household: "viande-alimentation.dietary_restriction == halal_strict"
  pork_eating_household: "viande-alimentation.dietary_restriction in [none, no_beef]"
  vegetarian_household: "viande-alimentation.dietary_restriction == vegetarian"
  high_meat_spend: "viande-alimentation.monthly_meat_spend >= 100"

validation:
  margins:
    - {attribute: dietary_restriction, title: "Household dietary restriction (expected from religion)"}
  shares:
    - label: "Muslims with a strictly halal household diet (assumed about 96%)"
      among: {attr: socle.religion, eq: islam}
      share_of: {attr: dietary_restriction, eq: halal_strict}
      range: [0.92, 0.99]
    - label: "Hindus with a no-beef household diet (assumed 55-65%)"
      among: {attr: socle.religion, eq: hinduism}
      share_of: {attr: dietary_restriction, eq: no_beef}
      range: [0.52, 0.72]
    - label: "Strictly halal households among resident adults (Census 2020: Islam 15.6%)"
      among: {attr: socle.residency_status, in: [citizen, pr]}
      share_of: {attr: dietary_restriction, eq: halal_strict}
      range: [0.11, 0.19]
    - label: "Households spending under S$70 a month on meat (HES 2023 mean S$69.60, right-skewed)"
      among: {all: [{attr: socle.age, gt: 17}, {not: no_own_purchase}]}
      share_of: {attr: monthly_meat_spend, lt: 70}
      range: [0.45, 0.72]

# Module « Entrepreneuriat » : intention et stade de création d'entreprise, pour tout adulte.
# La majorité n'a aucune intention ; l'intention est plus forte chez les jeunes, les cadres, les chômeurs,
# les indépendants (déjà lancés) et les pros du numérique. Format : docs/modules.md.
id: entrepreneuriat
version: "2026.3"
changelog:
  - version: "2026.3"
    date: "2026-10-15"
    changes:
      - "Frein « crédit immobilier » réservé à la persona qui rembourse elle-même un crédit (propriétaire accédante, hors « vit chez ses parents ») : le statut de logement des parents ne compte plus, et plus de taux de base sans crédit (4 % auparavant)."
      - "Contrôle de validation : aucun frein « crédit immobilier » sans crédit à soi."
      - "Dépend de numerique 2026.3 (revenu des freelances) : identifiants des nouvelles personas suffixés, personas en base inchangées."
  - version: "2026.2"
    date: "2026-10-14"
    changes: ["Première version (socle v2)."]
label: Entrepreneuriat
short_label: Entreprendre
description: >-
  Stade d'intention d'entreprendre (aucune intention, envie floue, idée, préparation, activité lancée,
  recherche d'associé), préférence seul ou à plusieurs, freins, réseaux et temps disponible.
applies_to: [fr]
requires: [numerique]

sources:
  ief_2023:
    org: "Bpifrance Création / Ifop"
    title: "Indice entrepreneurial français 2023 (communiqué et infographie)"
    year: 2023
    url: "https://bpifrance-creation.fr/system/files/Bpifrance_IEF2023_GENERAL_INFOGRAPHIE_202311.pdf"
    detail: "Chaîne entrepreneuriale 32 % des Français (chefs d'entreprise 17 %, anciens 18 %, porteurs de projet 13 %, intentionnistes 8 %, recouvrements) ; 58 % des moins de 30 ans, 27 % des 30 ans et plus ; hommes 37 %, femmes 28 % ; 44 % des hors-chaîne y ont pensé ; freins des intentionnistes : revenu insuffisant 29 %, risque d'échec 21 %, stress 21 %"
  ief_2025:
    org: "Bpifrance / Ifop"
    title: "Indice entrepreneurial français 2025"
    year: 2025
    url: "https://bpifrance-creation.fr/observatoire/etudes-thematiques/indice-entrepreneurial-francais/ief-2025"
    detail: "Chaîne entrepreneuriale 34 %, intentionnistes 11 %, 56 % des 18-29 ans"
  gem:
    org: "Global Entrepreneurship Monitor / Labex Entreprendre"
    title: "GEM France National Report 2024/2025"
    year: 2025
    url: "https://www.gemconsortium.org/news/a-year-of-contrast-for-entrepreneurship-in-france"
    detail: "Activité entrepreneuriale naissante (TEA) 8,7 % ; intention à 3 ans ≈ 14 % ; peur de l'échec 42,7 % ; 53 % de motivations de nécessité"
  insee_sine:
    org: "INSEE"
    title: "Les créateurs d'entreprise en 2022 (Insee Première n° 2007, enquête SINE)"
    year: 2024
    url: "https://insee.fr/fr/statistiques/fichier/8231755/ip2007.pdf"
    detail: "Deux créateurs sur trois se lancent seuls ; 16 % appuyés par une structure d'aide, 11 % par une plateforme de mise en relation ; formalités citées comme obstacle par 30 %"

conditions:
  independent: {all: [{attr: socle.activity_status, eq: employed}, {attr: socle.pcs, in: ["1", "2"]}]}
  salaried: {all: [{attr: socle.activity_status, eq: employed}, {not: independent}]}
  unemployed: {attr: socle.activity_status, eq: unemployed}
  digital: {attr: numerique.is_digital_worker, eq: true}
  digital_freelance: {attr: numerique.work_status, in: [freelance_micro, freelance_company]}
  has_intent: {attr: stage, in: [vague, idea, preparing, launched, seeking_partner]}
  vague: {attr: stage, eq: vague}
  young_children: {attr: socle.children_under_12, gt: 0}
  # Crédit immobilier remboursé par la persona elle-même (chez ses parents, le logement est le leur)
  mortgage: {all: [{attr: socle.tenure, eq: owner_mortgage}, {not: {attr: socle.household_type, eq: with_parents}}]}
  partner_not_employed: {attr: socle.partner_status, eq: not_employed}
  low_income: {attr: socle.living_standard_ratio, lt: 0.8}

tables:
  age_factor:
    label: "Coefficient d'âge de l'intention d'entreprendre (stades autres que « aucune »)"
    bands:
      - {from: 18, to: 24, value: 2.0}
      - {from: 25, to: 34, value: 1.6}
      - {from: 35, to: 44, value: 1.15}
      - {from: 45, to: 54, value: 0.85}
      - {from: 55, to: 64, value: 0.55}
      - {from: 65, to: 79, value: 0.25}
    sources: [ief_2023, ief_2025]
    assumption: true
    justification: "IEF : 56-58 % des moins de 30 ans dans la chaîne entrepreneuriale contre 27 % des 30 ans et plus ; décroissance supposée régulière avec l'âge."
  activity_factor:
    label: "Coefficient selon la situation d'activité"
    values: {employed: 1.0, unemployed: 1.5, student: 1.2, retired: 0.35, inactive: 0.6}
    sources: [gem]
    assumption: true
    justification: "GEM : 53 % de motivations de nécessité (chômeurs plus enclins) ; retraités et inactifs bien moins concernés (hypothèse)."
  pcs_factor:
    label: "Coefficient selon la PCS (salariés)"
    values: {"1": 1.0, "2": 1.0, "3": 1.35, "4": 1.1, "5": 0.9, "6": 0.8, none: 1.0}
    assumption: true
    justification: "Intention plus fréquente chez les cadres (diplôme, épargne, réseau), moindre chez les ouvriers : gradient supposé, aucune ventilation IEF par PCS publiée."
  sex_factor:
    label: "Coefficient de sexe"
    values: {M: 1.18, F: 0.82}
    sources: [ief_2023]
    assumption: true
    justification: "IEF 2023 : 37 % des hommes et 28 % des femmes dans la chaîne entrepreneuriale."

attributes:
  - key: stage
    label: Stade du projet de création
    type: enum
    values:
      - {code: none, label: aucune intention de créer une entreprise}
      - {code: vague, label: "envie floue d'entreprendre « un jour », sans idée précise"}
      - {code: idea, label: "une idée en tête, qu'il ou elle rumine sans rien engager"}
      - {code: preparing, label: "prépare concrètement un projet (étude de marché, prototype le soir, formation, rendez-vous)"}
      - {code: launched, label: "activité déjà lancée (indépendant, freelance, petite structure ou activité d'appoint)"}
      - {code: seeking_partner, label: "cherche activement un ou une associé·e"}
    distribution:
      # Modèle multiplicatif : poids de référence (salarié de 35-44 ans hors numérique) × âge × activité × PCS ×
      # numérique × sexe pour les stades d'intention ; les indépendants sont, par définition, déjà lancés.
      weights:
        none: {if: {attr: socle.activity_status, eq: retired}, then: 110, else: 44}
        vague: {mul: [22, {lookup: age_factor, by: socle.age}, {lookup: activity_factor, by: socle.activity_status}, {lookup: pcs_factor, by: socle.pcs}, {if: digital, then: 1.5, else: 1}, {lookup: sex_factor, by: socle.sex}]}
        idea: {mul: [8.5, {lookup: age_factor, by: socle.age}, {lookup: activity_factor, by: socle.activity_status}, {lookup: pcs_factor, by: socle.pcs}, {if: digital, then: 1.7, else: 1}, {lookup: sex_factor, by: socle.sex}]}
        preparing: {mul: [4.2, {lookup: age_factor, by: socle.age}, {lookup: activity_factor, by: socle.activity_status}, {lookup: pcs_factor, by: socle.pcs}, {if: digital, then: 1.7, else: 1}, {lookup: sex_factor, by: socle.sex}]}
        launched: {if: independent, then: 600, else: {mul: [3.2, {lookup: age_factor, by: socle.age}, {lookup: activity_factor, by: socle.activity_status}, {if: digital, then: 2, else: 1}, {lookup: sex_factor, by: socle.sex}]}}
        seeking_partner: {if: independent, then: 30, else: {mul: [0.8, {lookup: age_factor, by: socle.age}, {lookup: activity_factor, by: socle.activity_status}, {lookup: pcs_factor, by: socle.pcs}, {if: digital, then: 2, else: 1}, {lookup: sex_factor, by: socle.sex}]}}
    sources: [ief_2023, ief_2025, gem]
    assumption: true
    justification: "Poids calés pour retrouver les ordres de grandeur de l'IEF et du GEM sur les adultes : environ 60 % sans intention, un cinquième avec une envie floue, 10 à 18 % avec une intention plus précise ou un projet (intentionnistes 8-11 %, porteurs 13 %, recouvrements ; GEM : intention à 3 ans ≈ 14 %, TEA 8,7 %), 6 à 12 % déjà lancés (indépendants du socle et activités d'appoint). Les coefficients (âge, activité, PCS, numérique, sexe) sont détaillés dans les tables."

  - key: team
    label: Seul ou à plusieurs
    type: enum
    when: has_intent
    values:
      - {code: solo, label: "préfère se lancer seul·e"}
      - {code: open, label: "seul·e ou à plusieurs, sans idée arrêtée"}
      - {code: team, label: "veut s'associer"}
    distribution:
      given: stage
      table:
        vague: {solo: 45, open: 40, team: 15}
        idea: {solo: 45, open: 35, team: 20}
        preparing: {solo: 50, open: 25, team: 25}
        launched: {solo: 65, open: 27, team: 8}
        seeking_partner: {solo: 0, open: 20, team: 80}
    sources: [insee_sine]
    assumption: true
    justification: "INSEE SINE : deux créateurs sur trois se lancent seuls ; ceux qui cherchent un associé veulent par définition s'associer."

  - key: brakes
    label: Freins
    type: set
    when: has_intent
    rate_cap: 0.95
    max_items: 4
    items:
      - {code: job_security, label: "ne veut pas lâcher la sécurité de son emploi et de son salaire", rate: {base: 0.3, factors: {salaried: 1.5, independent: 0.2, unemployed: 0.5}}}
      - {code: unstable_income, label: "peur de revenus insuffisants ou irréguliers", rate: {base: 0.29, factors: {low_income: 1.4, digital_freelance: 1.2}}}
      - {code: fear_failure, label: "peur de l'échec", rate: {base: 0.25, factors: {vague: 1.3}}}
      - {code: stress, label: "redoute la charge mentale et les responsabilités", rate: {base: 0.21, factors: {}}}
      - {code: mortgage, label: "un crédit immobilier à rembourser", rate: {if: mortgage, then: 0.48, else: 0}}
      - {code: children, label: "des enfants en bas âge", rate: {base: 0.02, factors: {young_children: 22}}}
      - {code: partner_income, label: "le foyer dépend de son revenu (conjoint sans emploi)", rate: {base: 0.02, factors: {partner_not_employed: 20}}}
      - {code: no_idea, label: "pas d'idée assez solide", rate: {base: 0.18, factors: {vague: 2.5}}}
      - {code: missing_skills, label: "il lui manque des compétences complémentaires (vente, gestion, technique)", rate: {base: 0.25, factors: {}}}
      - {code: no_time, label: "pas le temps", rate: {base: 0.22, factors: {young_children: 1.6, salaried: 1.2}}}
      - {code: admin, label: "les démarches administratives et le statut", rate: {base: 0.13, factors: {independent: 1.3}}}
      - {code: financing, label: "le financement de départ", rate: {base: 0.12, factors: {unemployed: 1.5}}}
    display: {empty: aucun frein majeur exprimé}
    sources: [ief_2023, gem, insee_sine]
    assumption: true
    justification: "IEF 2023 : revenu insuffisant ou instable 29 %, risque d'échec 21 %, stress 21 % ; GEM : peur de l'échec 42,7 % ; SINE : formalités 30 %. Effets du crédit, des enfants, du conjoint et du manque d'idée supposés. Au plus 4 freins par persona."

  - key: networks
    label: Outils et réseaux utilisés
    type: set
    when: has_intent
    rate_cap: 0.98
    items:
      - {code: linkedin, label: "LinkedIn (compte gratuit)", rate: {mul: [{pick: socle.pcs, values: {"3": 0.75, "4": 0.5, "2": 0.45}, default: 0.2}, {if: digital, then: 1.15, else: 1}]}}
      - {code: ex_colleagues, label: "anciens collègues et camarades de promo", rate: {pick: socle.activity_status, values: {employed: 0.55, unemployed: 0.5, student: 0.45}, default: 0.25}}
      - {code: personal_network, label: "famille et amis", rate: 0.55}
      - {code: communities, label: "communautés Slack ou Discord de son métier", rate: {if: digital, then: 0.32, else: 0.04}}
      - {code: meetups, label: "meetups et événements de son secteur", rate: {mul: [{if: digital, then: 0.22, else: 0.05}, {pick: stage, values: {preparing: 1.6, seeking_partner: 1.8, vague: 0.6}, default: 1}]}}
      - {code: malt, label: "Malt (profil freelance)", rate: {if: digital_freelance, then: 0.53, else: 0.01}}
      - {code: social_groups, label: "groupes Facebook, WhatsApp ou forums d'entrepreneurs", rate: {mul: [0.07, {pick: stage, values: {preparing: 2, seeking_partner: 2}, default: 1}]}}
      - {code: support_network, label: "Bpifrance, CCI ou réseau d'accompagnement (BGE, Réseau Entreprendre, France Travail)", rate: {mul: [{if: independent, then: 0.2, else: {if: unemployed, then: 0.12, else: 0.02}}, {pick: stage, values: {preparing: 3, seeking_partner: 2.5}, default: 1}]}}
      - {code: incubator, label: "incubateur ou accélérateur", rate: {mul: [{if: digital, then: 0.03, else: 0.005}, {pick: stage, values: {preparing: 3, seeking_partner: 3}, default: 1}]}}
    display: {empty: aucun réseau pro actif}
    sources: [insee_sine]
    assumption: true
    justification: "Aucune donnée officielle sur l'usage de ces réseaux par les candidats à la création ; SINE : 16 % des créateurs appuyés par une structure d'aide, 11 % par une plateforme de mise en relation, l'entourage personnel en premier. Usage de LinkedIn croissant avec la PCS (hypothèse)."

  - key: weekly_hours
    label: Heures par semaine disponibles pour le projet
    type: number
    unit: h/semaine
    when: has_intent
    value: {max: [0, {round: {mul: [{pick: stage, values: {vague: 0, idea: 1, preparing: 6, launched: 8, seeking_partner: 7}, default: 0}, {if: young_children, then: 0.6, else: 1}, {exp: {mul: [0.4, {normal: {}}]}}]}}]}
    display: {template: "environ {value} h par semaine", empty: quasiment aucun pour l'instant}
    assumption: true
    justification: "Ordre de grandeur selon le stade, réduit de 40 % avec des enfants de moins de 12 ans."

card:
  - when: has_intent
    template: "Projet de création d'entreprise : {stage} ; {team} ; temps qu'il ou elle pourrait y consacrer : {weekly_hours}"
  - when: has_intent
    template: "Freins à la création : {brakes}"
  - when: has_intent
    template: "Réseaux utilisés aujourd'hui : {networks}"

segments:
  - {id: entrepreneurStage, attribute: stage, label: Stade du projet, compare: 1}
  - {id: entrepreneurTeam, attribute: team, label: Seul ou à plusieurs, compare: 2}

validation:
  margins:
    - {attribute: stage, title: "Stade du projet (attendu selon âge, activité, PCS, numérique, sexe)"}
    - {attribute: team, title: "Seul ou à plusieurs (attendu selon le stade)"}
  shares:
    - label: "Frein « crédit immobilier » sans crédit à soi (propriétaire accédant hors domicile parental) : jamais"
      among: {all: [has_intent, {not: mortgage}]}
      share_of: {attr: brakes, in: [mortgage]}
      range: [0, 0]
    - label: "Frein « crédit immobilier » chez ceux qui vivent chez leurs parents : jamais"
      among: {all: [has_intent, {attr: socle.household_type, eq: with_parents}]}
      share_of: {attr: brakes, in: [mortgage]}
      range: [0, 0]
    - label: "Adultes sans aucune intention d'entreprendre (IEF : ≈ 50-60 %)"
      share_of: {attr: stage, eq: none}
      range: [0.48, 0.62]
    - label: "Intention précise ou projet : idée, préparation, recherche d'associé (IEF : 10-18 %)"
      share_of: {attr: stage, in: [idea, preparing, seeking_partner]}
      range: [0.10, 0.18]
    - label: "Activité déjà lancée (indépendants et activités d'appoint, 6-12 %)"
      share_of: {attr: stage, eq: launched}
      range: [0.06, 0.12]
    - label: "18-29 ans avec au moins une envie d'entreprendre (IEF : 56-58 % dans la chaîne)"
      among: {attr: socle.age, lt: 30}
      share_of: has_intent
      range: [0.50, 0.68]
    - label: "Recherche active d'un associé, parmi les adultes (rare, < 3 %)"
      share_of: {attr: stage, eq: seeking_partner}
      range: [0.003, 0.03]

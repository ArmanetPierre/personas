# Module « Numérique » : la personne travaille-t-elle dans le numérique, dans quel métier et sous quel statut ?
# S'applique à tout adulte du socle. La grande majorité répond « non » (≈ 4,6 % des personnes en emploi).
# Format : docs/modules.md. L'ordre de déclaration est l'ordre de tirage (flux aléatoire propre au module).
id: numerique
version: "2026.3"
changelog:
  - version: "2026.3"
    date: "2026-10-15"
    changes:
      - "Revenu des freelances calculé par le module (TJM × jours facturés × part nette / 12, chiffre d'affaires plafonné en micro-entreprise) et substitué à celui du socle (`socle_overrides.monthly_income`) ; impôt, prestations, niveau de vie et reste-à-vivre recalculés."
      - "Outils pro payés de sa poche déduits du reste-à-vivre (`affects_budget`, prix publics) ; ils apparaissent dans les abonnements de la persona."
      - "Attribut `monthly_income` ajouté en dernier : les autres attributs gardent les tirages de la 2026.2. Les personas déjà en base (2026.2) ne sont pas réécrites ; les nouvelles tirées en 2026.3 ont un identifiant suffixé."
  - version: "2026.2"
    date: "2026-10-14"
    changes: ["Première version (socle v2) : appartenance, métier, statut, TJM, outils pro (information de fiche seulement)."]
label: Métiers du numérique
short_label: Numérique
description: >-
  Professionnels du numérique (informatique, données, produit, design, marketing digital, conseil IT…) :
  appartenance, métier, statut d'emploi (salarié, freelance, dirigeant, en transition), taux journalier des
  freelances et outils pro payés de sa poche. Conditionné au statut d'activité, à la PCS, à l'âge et au sexe du socle.
applies_to: [fr]
requires: []

sources:
  insee_num:
    org: "INSEE"
    title: "Métiers du numérique, fiche 4.3, Économie et société à l'ère du numérique, Insee Références, édition 2025"
    year: 2025
    url: "https://www.insee.fr/fr/statistiques/8616855"
    detail: "1,3 million de professionnels du numérique, 4,6 % des actifs occupés (2021-2023) ; 70 % de cadres ; 24 % de femmes ; 11 % d'indépendants ; 23 % de moins de 30 ans, 55 % de 30-49 ans"
  insee_fem:
    org: "INSEE"
    title: "Les femmes restent très minoritaires dans les métiers de la transformation numérique (Emploi, chômage, revenus du travail, édition 2023, éclairage)"
    year: 2023
    url: "https://www.insee.fr/fr/statistiques/7634470"
    detail: "Répartition par famille de métiers : informatique et SI 52 %, management 16 %, communication et interface 13 %, réseaux 8 %, conseil 8 %, données 3 %"
  insee_eri:
    org: "INSEE"
    title: "Emploi et revenus des indépendants, Insee Références, édition 2025"
    year: 2025
    url: "https://www.insee.fr/fr/statistiques/fichier/8376600/ERI2025.pdf"
    detail: "Information-communication : 68,5 % de micro-entrepreneurs parmi les non-salariés"
  insee_loc:
    org: "INSEE"
    title: "Localisation des emplois des secteurs du numérique, Insee Références, édition 2025"
    year: 2025
    url: "https://www.insee.fr/fr/statistiques/8616857"
    detail: "Emplois des secteurs du numérique fin 2022 : Île-de-France 47,4 %, Auvergne-Rhône-Alpes 10,8 %, Occitanie 7,0 %, PACA 6,2 % ; grandes métropoles (Paris, Lyon, Toulouse, Nantes…) ; 39 % des professionnels du numérique résident en Île-de-France (fiche 4.3)"
  malt:
    org: "Malt"
    title: "Freelancing in Europe 2024 et baromètre des tarifs (relayés par la presse spécialisée)"
    year: 2024
    url: "https://www.malt.fr/t/barometre-tarifs"

conditions:
  digital: {attr: is_digital_worker, eq: true}
  freelance: {attr: work_status, in: [freelance_micro, freelance_company]}

tables:
  pcs_rate:
    label: "Probabilité d'être professionnel du numérique, par PCS (personnes en emploi ou au chômage)"
    values: {"1": 0.0, "2": 0.08, "3": 0.13, "4": 0.027, "5": 0.0088, "6": 0.0049}
    sources: [insee_num]
    assumption: true
    justification: "4,6 % des actifs occupés, dont 70 % de cadres et 11 % d'indépendants (INSEE 2025) : P(numérique | PCS) = 4,6 % × part de la PCS parmi les pros du numérique / part de la PCS dans l'emploi (pack fr). Ventilation des 30 % de non-cadres entre professions intermédiaires (≈ 2/3), indépendants, employés et ouvriers : hypothèse."
  age_factor:
    label: "Coefficient d'âge (pros du numérique plus jeunes que l'ensemble des actifs)"
    bands:
      - {from: 18, to: 29, value: 1.4}
      - {from: 30, to: 49, value: 1.1}
      - {from: 50, to: 64, value: 0.66}
      - {from: 65, to: 79, value: 0.5}
    sources: [insee_num]
    assumption: true
    justification: "Moins de 30 ans : 23 % des pros du numérique contre ≈ 18 % des actifs occupés (coefficient porté à 1,4 pour compenser le faible taux d'emploi des 18-24 ans) ; 30-49 ans : 55 % contre ≈ 50 % ; 50 ans et plus : 21 % contre ≈ 32 %."
  sex_factor:
    label: "Coefficient de sexe"
    values: {M: 1.38, F: 0.58}
    sources: [insee_num]
    assumption: true
    justification: "24 % de femmes parmi les pros du numérique contre ≈ 48 % dans l'emploi ; coefficients calibrés par simulation pour retrouver 24 % à PCS donnée."
  region_factor:
    label: "Coefficient régional (concentration en Île-de-France et dans les grandes régions métropolitaines)"
    values: {IDF: 1.85, ARA: 1.02, OCC: 0.86, PAC: 0.91, BFC: 0.646, BRE: 0.646, CVL: 0.646, COR: 0.646, GES: 0.646, HDF: 0.646, NOR: 0.646, NAQ: 0.646, PDL: 0.646}
    sources: [insee_num, insee_loc]
    assumption: true
    justification: "Coefficient = part régionale visée chez les pros du numérique / part de la région chez les adultes : Île-de-France 39 % (résidence, INSEE 2025) contre 19 %, ramené à 1,85 car la taille d'agglomération (agglomération parisienne) y ajoute son effet ; ARA, Occitanie et PACA d'après les parts sectorielles rapportées aux 61 % hors Île-de-France ; les autres régions au prorata (la moyenne des coefficients pondérée par la population vaut 1)."
  town_factor:
    label: "Coefficient de taille d'agglomération"
    values: {rural: 0.45, uu_lt20k: 0.6, uu_20k_100k: 0.85, uu_100k_200k: 1.1, uu_200k_2m: 1.55, uu_paris: 1.25}
    sources: [insee_loc]
    assumption: true
    justification: "Emplois du numérique concentrés dans les grandes agglomérations (Paris, Lyon, Toulouse, Nantes, Bordeaux, Grenoble, Rennes…), sans ventilation publiée par taille d'unité urbaine ; le télétravail laisse une part en petites villes et en rural. L'agglomération parisienne a un coefficient modéré car l'effet Île-de-France est déjà dans le coefficient régional."
  daily_rate_ref:
    label: "Taux journalier moyen d'un freelance, par métier (€ HT)"
    values: {dev: 574, devops: 600, data: 667, product: 681, design: 507, marketing: 450, consulting: 650, sales: 500, support: 400, leadership: 750}
    sources: [malt]
    assumption: true
    justification: "TJM Malt relayés par la presse (développeur 574, data 667, chef de projet 681, UX 507) ; autres métiers estimés par proximité."
  billed_days_median:
    label: "Jours facturés par an (médiane), par statut de freelance"
    values: {freelance_micro: 80, freelance_company: 170}
    sources: [malt, insee_eri]
    assumption: true
    justification: "Malt : 157 jours facturés en moyenne ; les micro-entrepreneurs sont souvent en activité d'appoint (revenu moyen INSEE ≈ 1 010 €/mois) : 80 jours ; en société : 170 jours. Repris du module entrepreneuriat-tech (2026.1)."
  billed_days_sigma:
    label: "Dispersion des jours facturés, par statut de freelance"
    values: {freelance_micro: 0.6, freelance_company: 0.25}
    assumption: true
    justification: "Dispersion forte en micro-entreprise (de l'appoint au plein temps), faible en société."
  net_share:
    label: "Part du chiffre d'affaires qui reste en revenu net, par statut de freelance"
    values: {freelance_micro: 0.7, freelance_company: 0.5}
    assumption: true
    justification: "Micro : cotisations ≈ 24,6 % et quelques frais ; société : cotisations, impôt sur les sociétés et frais."
  rate_age_factor:
    label: "Coefficient d'âge du taux journalier"
    bands:
      - {from: 18, to: 29, value: 0.82}
      - {from: 30, to: 34, value: 0.94}
      - {from: 35, to: 39, value: 1.02}
      - {from: 40, to: 79, value: 1.1}
    sources: [malt]
    assumption: true
    justification: "Malt : TJM d'un développeur de 317 € (0-2 ans d'expérience) à 672 € (15 ans et plus) ; profil lissé par âge."

attributes:
  - key: is_digital_worker
    label: Travaille dans le numérique
    type: boolean
    when: {attr: socle.activity_status, in: [employed, unemployed]}
    rate: {mul: [{lookup: pcs_rate, by: socle.pcs}, {lookup: age_factor, by: socle.age}, {lookup: sex_factor, by: socle.sex}, {lookup: region_factor, by: socle.region}, {lookup: town_factor, by: socle.town_size}]}
    labels: {yes: travaille dans le numérique, no: ne travaille pas dans le numérique}
    sources: [insee_num]
    assumption: true
    justification: "Modèle multiplicatif PCS × âge × sexe × région × taille d'agglomération calé sur les parts INSEE (4,6 % des actifs occupés, 70 % de cadres, 24 % de femmes, 39 % en Île-de-France) ; les chômeurs sont traités comme leur dernier emploi."

  - key: occupation
    label: Métier du numérique
    type: enum
    when: digital
    values:
      - {code: dev, label: "Développeur·se / ingénieur·e logiciel"}
      - {code: devops, label: "DevOps / infrastructure / cloud"}
      - {code: data, label: "Data analyst / data scientist / IA"}
      - {code: product, label: "Chef·fe de projet / product owner / product manager"}
      - {code: design, label: "Designer UX/UI"}
      - {code: marketing, label: "Marketing digital / growth"}
      - {code: consulting, label: "Consultant·e IT / ESN / AMOA"}
      - {code: sales, label: "Commercial·e / avant-vente tech"}
      - {code: support, label: "Support / test / exploitation"}
      - {code: leadership, label: "Direction technique / CTO / dirigeant·e"}
    distribution:
      given: socle.pcs
      table:
        "3": {dev: 30, devops: 10, data: 6, product: 18, design: 6, marketing: 6, consulting: 16, sales: 5, support: 1, leadership: 2}
        "4": {dev: 25, devops: 14, data: 4, product: 8, design: 9, marketing: 7, consulting: 6, sales: 5, support: 22}
        "2": {dev: 22, devops: 6, data: 6, product: 8, design: 14, marketing: 12, consulting: 18, sales: 2, support: 2, leadership: 10}
        default: {dev: 20, devops: 8, data: 3, product: 5, design: 10, marketing: 14, consulting: 4, sales: 10, support: 26}
    sources: [insee_fem]
    assumption: true
    justification: "Familles INSEE (informatique et SI 52 %, management 16 %, communication et interface 13 %, réseaux 8 %, conseil 8 %, données 3 %) ventilées sur les métiers usuels ; devops, product, growth et avant-vente n'existent pas dans la nomenclature. Les cadres font plus de produit et de conseil, les professions intermédiaires plus de support et d'infrastructure, les indépendants plus de design, de conseil et de marketing (hypothèse)."

  - key: work_status
    label: Statut d'emploi dans le numérique
    type: enum
    when: digital
    values:
      - {code: salaried_cadre, label: {M: salarié cadre, F: salariée cadre}}
      - {code: salaried_tech, label: {M: salarié non cadre, F: salariée non cadre}}
      - {code: freelance_micro, label: freelance en micro-entreprise}
      - {code: freelance_company, label: "freelance en société (SASU, EURL)"}
      - {code: founder_small, label: {M: "dirigeant d'une petite structure (moins de 10 salariés)", F: "dirigeante d'une petite structure (moins de 10 salariés)"}}
      - {code: transition, label: "en transition (entre deux emplois, au chômage)"}
    distribution:
      given: [socle.activity_status, socle.pcs]
      table:
        employed:
          "2": {freelance_micro: 45, freelance_company: 35, founder_small: 20}
          "3": {salaried_cadre: 1}
          default: {salaried_tech: 1}
        default:
          default: {transition: 1}
    sources: [insee_num, insee_eri]
    assumption: true
    justification: "Le statut suit la PCS du socle : les indépendants (PCS 2) sont freelances ou dirigeants, les cadres salariés cadres, les autres salariés non cadres, les chômeurs en transition. Parmi les indépendants de l'information-communication, 68,5 % sont micro-entrepreneurs (INSEE ERI 2025) ; une part est en société ou dirige une petite structure (hypothèse : 45/35/20)."

  - key: daily_rate
    label: Taux journalier (freelance)
    type: number
    unit: € HT
    when: freelance
    value:
      round_to: 10
      value: {mul: [{lookup: daily_rate_ref, by: occupation}, {lookup: rate_age_factor, by: socle.age}, {exp: {mul: [0.2, {normal: {}}]}}]}
    display: {format: eur}
    sources: [malt]
    assumption: true
    justification: "TJM du métier × coefficient d'âge, dispersion individuelle ±20 %. Depuis la 2026.3, il fixe le revenu des freelances (attribut monthly_income)."

  - key: pro_tools
    label: Outils pro payés de sa poche
    type: set
    when: digital
    items:
      - {code: linkedin_career, label: LinkedIn Premium Career, card_label: "LinkedIn Premium Career 29,99 €/mois", rate: {pick: work_status, values: {transition: 0.18, freelance_micro: 0.06}, default: 0.04}, subscription: {name: "LinkedIn Premium Career", category: outil pro, monthly_eur: 29.99}}
      - {code: linkedin_business, label: LinkedIn Premium Business, card_label: "LinkedIn Premium Business 59,99 €/mois", rate: {pick: work_status, values: {freelance_company: 0.08, founder_small: 0.15}, default: 0.01}, subscription: {name: "LinkedIn Premium Business", category: outil pro, monthly_eur: 59.99}}
      - {code: chatgpt, label: ChatGPT Plus, card_label: "ChatGPT Plus 23 €/mois", rate: {pick: work_status, values: {freelance_micro: 0.3, freelance_company: 0.3, founder_small: 0.35}, default: 0.15}, subscription: {name: "ChatGPT Plus", category: outil pro, monthly_eur: 23}}
      - {code: copilot, label: GitHub Copilot Pro, card_label: "GitHub Copilot Pro 10 €/mois", rate: {pick: work_status, values: {freelance_micro: 0.15, freelance_company: 0.18}, default: 0.03}, subscription: {name: "GitHub Copilot Pro", category: outil pro, monthly_eur: 10}}
      - {code: notion, label: Notion Plus, card_label: "Notion Plus 11,5 €/mois", rate: {pick: work_status, values: {freelance_micro: 0.1, freelance_company: 0.1, founder_small: 0.15}, default: 0.03}, subscription: {name: "Notion Plus", category: outil pro, monthly_eur: 11.5}}
      - {code: figma, label: Figma Professional, card_label: "Figma Professional 15 €/mois", rate: {pick: work_status, values: {freelance_micro: 0.08, freelance_company: 0.06}, default: 0.01}, subscription: {name: "Figma Professional", category: outil pro, monthly_eur: 15}}
    display: {template: "outils pro payés de sa poche : {value}", empty: aucun outil pro payé de sa poche}
    # Payés par la persona (ceux que paie l'employeur ne sont pas dans cette liste) : déduits du reste-à-vivre
    affects_budget: true
    assumption: true
    justification: "Prix publics 2025-2026 ; taux d'abonnement supposés, plus élevés chez les indépendants (les salariés font payer leurs outils par l'employeur). Depuis la 2026.3, ces abonnements s'ajoutent à ceux de la persona et sont déduits de son reste-à-vivre."

  - key: monthly_income
    label: Revenu net mensuel tiré de l'activité freelance
    type: number
    unit: €/mois
    when: freelance
    # Remplace le revenu du socle (socle_overrides). TJM × jours facturés (≤ 220) × part nette / 12 ;
    # chiffre d'affaires plafonné à 77 700 € en micro-entreprise (plafond BNC).
    value:
      round:
        div:
          - mul:
              - cases:
                  - when: {attr: work_status, eq: freelance_micro}
                    value: {min: [{mul: [{attr: daily_rate}, {min: [220, {lognormal: {median: {lookup: billed_days_median, by: work_status}, sigma: {lookup: billed_days_sigma, by: work_status}}}]}]}, 77700]}
                  - else: {mul: [{attr: daily_rate}, {min: [220, {lognormal: {median: {lookup: billed_days_median, by: work_status}, sigma: {lookup: billed_days_sigma, by: work_status}}}]}]}
              - {lookup: net_share, by: work_status}
          - 12
    display: {format: eur}
    sources: [malt, insee_eri]
    assumption: true
    justification: "Même modèle que l'ancien module entrepreneuriat-tech (2026.1) : TJM Malt × jours facturés (médiane 80 en micro, 170 en société) × part nette (0,7 / 0,5). Remplace le revenu du socle, tiré pour la PCS indépendante sans tenir compte du métier ni du TJM."

socle_overrides:
  monthly_income: {attr: monthly_income, when: freelance}

card:
  - when: digital
    template: "Métier du numérique : {occupation} ; {work_status}"
  - when: freelance
    template: "Activité freelance : taux journalier ≈ {daily_rate} HT"
  - when: digital
    template: "Outils de travail : {pro_tools}"

segments:
  - {id: digitalStatus, attribute: work_status, label: Statut (numérique), compare: 3}
  - {id: digitalOccupation, attribute: occupation, label: Métier du numérique}

validation:
  margins:
    - {attribute: occupation, title: "Métier du numérique (attendu selon la PCS)"}
    - {attribute: work_status, title: "Statut d'emploi dans le numérique (attendu selon la PCS)"}
  shares:
    - label: "Pros du numérique parmi les personnes en emploi (INSEE : 4,6 %)"
      among: {attr: socle.activity_status, eq: employed}
      share_of: digital
      range: [0.040, 0.052]
    - label: "Cadres parmi les pros du numérique en emploi (INSEE : 70 %)"
      among: {all: [digital, {attr: socle.activity_status, eq: employed}]}
      share_of: {attr: socle.pcs, eq: "3"}
      range: [0.64, 0.76]
    - label: "Femmes parmi les pros du numérique (INSEE : 24 %)"
      among: digital
      share_of: {attr: socle.sex, eq: F}
      range: [0.20, 0.28]
    - label: "Indépendants parmi les pros du numérique en emploi (INSEE : 11 %)"
      among: {all: [digital, {attr: socle.activity_status, eq: employed}]}
      share_of: {attr: socle.pcs, eq: "2"}
      range: [0.08, 0.14]
    - label: "Île-de-France parmi les pros du numérique (INSEE : 39 % y résident)"
      among: digital
      share_of: {attr: socle.region, eq: IDF}
      range: [0.33, 0.45]
    - label: "Moins de 30 ans parmi les pros du numérique en emploi (INSEE : 23 %)"
      among: {all: [digital, {attr: socle.activity_status, eq: employed}]}
      share_of: {attr: socle.age, lt: 30}
      range: [0.17, 0.29]

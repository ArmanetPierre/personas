# Module « Entrepreneuriat tech » : porteurs de projet dans les métiers du numérique (25-45 ans).
# Converti du pack fr-tech-founders (founders.json) : mêmes données, mêmes tirages, même fiche.
# Format : docs/modules.md. L'ordre de déclaration des attributs est l'ordre de tirage.
id: entrepreneuriat-tech
version: "2026.1"
# Archivé le 2026-10-15 (modules/_archive) : remplacé par numerique + entrepreneuriat sur le socle v2.
# Gardé lisible pour le pack historique fr-tech-founders-2026.1 et ses études ; absent de la bibliothèque
# proposée, des filtres et des cibles.
status: legacy
label: Entrepreneuriat tech
short_label: Entreprendre
description: >-
  Statut professionnel, métier, revenu, stade du projet de création d'entreprise, préférence solo ou à plusieurs,
  freins, réseaux et outils pro payés de sa poche, pour des actifs du numérique qui envisagent de se lancer.
applies_to: [fr]
requires: []

sources:
  insee_num:
    org: "INSEE"
    title: "Métiers du numérique, fiche 4.3, Économie et société à l'ère du numérique, Insee Références, édition 2025"
    year: 2025
    url: "https://www.insee.fr/fr/statistiques/8616855"
  insee_fem:
    org: "INSEE"
    title: "Les femmes restent très minoritaires dans les métiers de la transformation numérique (Emploi, chômage, revenus du travail, édition 2023, éclairage)"
    year: 2023
    url: "https://www.insee.fr/fr/statistiques/7634470"
  apec:
    org: "Apec"
    title: "Les rémunérations des cadres dans 111 familles de métiers, édition 2025"
    year: 2025
    url: "https://corporate.apec.fr/files/live/sites/corporate/files/Nos%20etudes/PDF/Les%20remunerations%20des%20cadres%20dans%20111%20familles%20de%20metiers%202025.pdf"
  insee_eri:
    org: "INSEE"
    title: "Emploi et revenus des indépendants, Insee Références, édition 2025"
    year: 2025
    url: "https://www.insee.fr/fr/statistiques/fichier/8376600/ERI2025.pdf"
  malt:
    org: "Malt"
    title: "Freelancing in Europe 2024 et baromètre des tarifs (relayés par la presse spécialisée)"
    year: 2024
    url: "https://www.malt.fr/t/barometre-tarifs"
  insee_sine:
    org: "INSEE"
    title: "Les créateurs d'entreprise en 2022 (Insee Première n° 2007, enquête SINE)"
    year: 2024
    url: "https://insee.fr/fr/statistiques/fichier/8231755/ip2007.pdf"
  ief_2023:
    org: "Bpifrance Création / Ifop"
    title: "Indice entrepreneurial français 2023 (communiqué et infographie)"
    year: 2023
    url: "https://bpifrance-creation.fr/system/files/Bpifrance_IEF2023_GENERAL_INFOGRAPHIE_202311.pdf"
  ief_2025:
    org: "Bpifrance / Ifop"
    title: "Indice entrepreneurial français 2025"
    year: 2025
    url: "https://bpifrance-creation.fr/observatoire/etudes-thematiques/indice-entrepreneurial-francais/ief-2025"
  gem:
    org: "Global Entrepreneurship Monitor / Labex Entreprendre"
    title: "GEM France National Report 2024/2025"
    year: 2025
    url: "https://www.gemconsortium.org/news/a-year-of-contrast-for-entrepreneurship-in-france"

# Conditions nommées, réutilisées par les taux (freins) et la fiche.
conditions:
  salaried: {attr: status, in: [salaried_cadre, salaried_tech]}
  freelance: {attr: status, in: [freelance_micro, freelance_company]}
  founder: {attr: status, eq: founder_small}
  transition: {attr: status, eq: transition}
  freelance_micro: {attr: status, eq: freelance_micro}
  young_children: {attr: socle.children_under_12, gt: 0}
  mortgage: {attr: socle.tenure, eq: owner_mortgage}
  partner_not_employed: {attr: socle.partner_status, eq: not_employed}
  single: {attr: socle.partner_status, eq: none}
  low_income: {attr: socle.living_standard_ratio, lt: 0.8}
  vague: {attr: stage, eq: vague}
  has_daily_rate: {attr: daily_rate, present: true}

# Tables de référence (lookup), chacune sourcée ou hypothèse.
tables:
  salary_median:
    label: "Salaire net mensuel médian d'un salarié à 35 ans, par métier (€)"
    values: {dev: 3080, devops: 3270, data: 3400, product: 3460, design: 2890, marketing: 3210, consulting: 3530, sales: 3210, support: 3080, leadership: 4240}
    sources: [apec]
  salary_sigma:
    label: "Dispersion log-normale des salaires, par métier (ln(D9/D1)/2,563)"
    values: {dev: 0.26, devops: 0.284, data: 0.35, product: 0.27, design: 0.21, marketing: 0.27, consulting: 0.284, sales: 0.345, support: 0.215, leadership: 0.282}
    sources: [apec]
  daily_rate_ref:
    label: "Taux journalier moyen d'un freelance, par métier (€ HT)"
    values: {dev: 574, devops: 600, data: 667, product: 681, design: 507, marketing: 450, consulting: 650, sales: 500, support: 400, leadership: 750}
    sources: [malt]
    assumption: true
    justification: "TJM Malt relayés par la presse (développeur 574, data 667, chef de projet 681, UX 507) ; devops, marketing, conseil, vente, support et direction estimés par proximité."
  age_factor:
    label: "Coefficient d'âge des revenus (relatif à 35 ans)"
    bands:
      - {from: 25, to: 29, value: 0.82}
      - {from: 30, to: 34, value: 0.94}
      - {from: 35, to: 39, value: 1.02}
      - {from: 40, to: 45, value: 1.1}
    sources: [apec]
    assumption: true
    justification: "Rapport des médianes Apec <35 ans / 35-45 ans, interpolé par tranche de 5 ans."
  salary_factor:
    label: "Coefficient de salaire selon le statut (non-cadres)"
    values: {salaried_cadre: 1, salaried_tech: 0.72, freelance_micro: 1, freelance_company: 1, founder_small: 1, transition: 1}
    assumption: true
    justification: "Les non-cadres (techniciens, professions intermédiaires) gagnent environ 28 % de moins que les cadres du même métier (ordre de grandeur INSEE)."
  billed_days_median:
    label: "Jours facturés par an (médiane), par statut de freelance"
    values: {freelance_micro: 80, freelance_company: 170}
    sources: [malt, insee_eri]
    assumption: true
    justification: "Malt : 157 jours en moyenne ; micro-entrepreneurs souvent en activité d'appoint (revenu moyen INSEE 1 010 €/mois) : 80 jours ; sociétés : 170 jours."
  billed_days_sigma:
    label: "Dispersion des jours facturés, par statut de freelance"
    values: {freelance_micro: 0.6, freelance_company: 0.25}
    assumption: true
    justification: "Dispersion forte en micro-entreprise (activités d'appoint comme à plein temps), faible en société."
  net_share:
    label: "Part du chiffre d'affaires qui reste en revenu net, par statut de freelance"
    values: {freelance_micro: 0.7, freelance_company: 0.5}
    assumption: true
    justification: "Micro : cotisations ≈ 24,6 % et quelques frais ; société : cotisations, impôt sur les sociétés et frais."

attributes:
  - key: status
    label: Statut professionnel
    type: enum
    phase: work
    values:
      - code: salaried_cadre
        label: {M: "salarié cadre", F: "salariée cadre"}
        socle: {activity_status: employed, pcs: "3"}
      - code: salaried_tech
        label: {M: "salarié non cadre (technicien, profession intermédiaire)", F: "salariée non cadre (technicienne, profession intermédiaire)"}
        socle: {activity_status: employed, pcs: "4"}
      - code: freelance_micro
        label: {M: "freelance en micro-entreprise", F: "freelance en micro-entreprise"}
        socle: {activity_status: employed, pcs: "2"}
      - code: freelance_company
        label: {M: "freelance en société (SASU, EURL)", F: "freelance en société (SASU, EURL)"}
        socle: {activity_status: employed, pcs: "2"}
      - code: founder_small
        label: {M: "dirigeant d'une petite structure (moins de 10 salariés)", F: "dirigeante d'une petite structure (moins de 10 salariés)"}
        socle: {activity_status: employed, pcs: "2"}
      - code: transition
        label: {M: "en transition (entre deux emplois, au chômage ou en rupture conventionnelle)", F: "en transition (entre deux emplois, au chômage ou en rupture conventionnelle)"}
        socle: {activity_status: unemployed, pcs: "3"}
    distribution:
      sampler: quasi
      weights: {salaried_cadre: 0.53, salaried_tech: 0.19, freelance_micro: 0.08, freelance_company: 0.07, founder_small: 0.05, transition: 0.08}
    sources: [insee_num]
    assumption: true
    justification: "70 % de cadres et 11 % d'indépendants parmi les professionnels du numérique (INSEE 2025) ; les indépendants sont surreprésentés dans une population qui envisage de se lancer."
  - key: occupation
    label: Métier
    type: enum
    phase: work
    values:
      - {code: dev, label: "Développeur·se / ingénieur·e logiciel"}
      - {code: devops, label: "DevOps / infrastructure / cloud"}
      - {code: data, label: "Data analyst / data scientist / IA"}
      - {code: product, label: "Chef·fe de projet / product owner / product manager"}
      - {code: design, label: "Designer UX/UI"}
      - {code: marketing, label: "Marketing digital / growth"}
      - {code: consulting, label: "Consultant·e IT / ESN / AMOA"}
      - {code: sales, label: "Commercial·e / avant-vente tech"}
      - {code: support, label: "Support / test / exploitation"}
      - {code: leadership, label: "Direction technique / CTO / dirigeant·e"}
    distribution:
      sampler: quasi
      given: status
      table:
        salaried_cadre: {dev: 30, devops: 10, data: 5, product: 16, design: 7, marketing: 6, consulting: 15, sales: 5, support: 3, leadership: 3}
        salaried_tech: {dev: 30, devops: 10, data: 5, product: 8, design: 7, marketing: 6, consulting: 6, sales: 5, support: 18}
        freelance_micro: {dev: 30, devops: 10, data: 5, product: 16, design: 14, marketing: 12, consulting: 15, sales: 5, support: 3}
        freelance_company: {dev: 30, devops: 10, data: 5, product: 16, design: 7, marketing: 6, consulting: 20, sales: 5, support: 2}
        founder_small: {leadership: 60, dev: 10, product: 10, marketing: 8, consulting: 7, design: 5}
        transition: {dev: 30, devops: 10, data: 5, product: 16, design: 7, marketing: 6, consulting: 15, sales: 5, support: 7}
    sources: [insee_num, insee_fem]
    assumption: true
    justification: "Familles de métiers INSEE (informatique 52 %, management 16 %, communication et interface 13 %…) ; devops, product, growth et avant-vente n'existent pas dans la nomenclature : ventilation estimée."
  - key: daily_rate
    label: Taux journalier (freelance)
    type: number
    phase: work
    unit: € HT
    when: freelance
    value:
      round_to: 10
      value: {mul: [{lookup: daily_rate_ref, by: occupation}, {lookup: age_factor, by: socle.age}, {exp: {mul: [0.2, {normal: {}}]}}]}
    display: {format: eur}
    sources: [malt]
    assumption: true
    justification: "TJM du métier × coefficient d'âge, avec une dispersion individuelle de ±20 % (log-normale)."
  - key: monthly_income
    label: Revenu personnel net mensuel
    type: number
    phase: work
    unit: €/mois
    # Remplace le revenu du socle (voir socle_overrides). Freelance : TJM × jours facturés (≤ 220) ×
    # part nette / 12, chiffre d'affaires plafonné en micro ; dirigeant : log-normale ; salarié et
    # transition : salaire log-normal (métier × âge × statut), indemnisé à 70 % dans 75 % des cas en transition.
    value:
      round:
        cases:
          - when: freelance
            value:
              div:
                - mul:
                    - cases:
                        - when: freelance_micro
                          value: {min: [{mul: [{attr: daily_rate}, {min: [220, {lognormal: {median: {lookup: billed_days_median, by: status}, sigma: {lookup: billed_days_sigma, by: status}}}]}]}, 77700]}
                        - else: {mul: [{attr: daily_rate}, {min: [220, {lognormal: {median: {lookup: billed_days_median, by: status}, sigma: {lookup: billed_days_sigma, by: status}}}]}]}
                    - {lookup: net_share, by: status}
                - 12
          - when: founder
            value: {lognormal: {median: 2800, sigma: 0.6}}
          - else:
              mul:
                - lognormal:
                    median: {mul: [{lookup: salary_median, by: occupation}, {lookup: age_factor, by: socle.age}, {lookup: salary_factor, by: status}]}
                    sigma: {lookup: salary_sigma, by: occupation}
                - {if: transition, then: {mul: [{bernoulli: 0.75}, 0.7]}, else: 1}
    sources: [apec, insee_eri, malt]
    assumption: true
    justification: "Salaires Apec 2025 convertis en net (≈ 0,77 × brut / 12) ; freelances : plafond micro 77700 € ; dirigeants : se rémunèrent peu au démarrage (médiane 2800 €) ; transition : ARE ≈ 57 % du brut."
  - key: stage
    label: Stade du projet de création
    type: enum
    values:
      - {code: vague, label: "envie floue d'entreprendre « un jour », sans idée précise"}
      - {code: idea, label: "une idée en tête, qu'il ou elle rumine sans rien engager"}
      - {code: preparing, label: "prépare concrètement un projet (étude de marché, prototype le soir, formation, rendez-vous)"}
      - {code: launched_solo, label: "activité déjà lancée seul·e (freelance ou petite structure)"}
      - {code: seeking_partner, label: "cherche activement un ou une associé·e"}
    distribution:
      sampler: quasi
      given: status
      table:
        salaried_cadre: {vague: 50, idea: 28, preparing: 13, launched_solo: 3, seeking_partner: 6}
        salaried_tech: {vague: 55, idea: 25, preparing: 11, launched_solo: 3, seeking_partner: 6}
        freelance_micro: {vague: 15, idea: 22, preparing: 12, launched_solo: 43, seeking_partner: 8}
        freelance_company: {vague: 12, idea: 20, preparing: 12, launched_solo: 46, seeking_partner: 10}
        founder_small: {vague: 0, idea: 10, preparing: 10, launched_solo: 60, seeking_partner: 20}
        transition: {vague: 30, idea: 30, preparing: 22, launched_solo: 6, seeking_partner: 12}
    sources: [ief_2023, ief_2025]
    assumption: true
    justification: "Aucune source ne croise métier du numérique et stade du projet ; ordre de grandeur de l'IEF (intentionnistes 8-11 %, porteurs de projet 13 %) : l'envie floue domine, les porteurs actifs sont minoritaires, la recherche d'associé est rare."
  - key: team
    label: Seul ou à plusieurs
    type: enum
    values:
      - {code: solo, label: "préfère se lancer seul·e"}
      - {code: open, label: "seul·e ou à plusieurs, sans idée arrêtée"}
      - {code: team, label: "veut s'associer"}
    distribution:
      given: stage
      table:
        vague: {solo: 45, open: 40, team: 15}
        idea: {solo: 45, open: 35, team: 20}
        preparing: {solo: 50, open: 25, team: 25}
        launched_solo: {solo: 60, open: 30, team: 10}
        seeking_partner: {solo: 0, open: 20, team: 80}
    sources: [insee_sine]
    assumption: true
    justification: "INSEE SINE : deux créateurs sur trois se lancent seuls, six créateurs de société sur dix sont seuls ; les personnes qui cherchent un associé veulent par définition s'associer."
  - key: brakes
    label: Freins
    type: set
    rate_cap: 0.95
    max_items: 4
    items:
      - {code: job_security, label: "ne veut pas lâcher la sécurité de son emploi et de son salaire", rate: {base: 0.3, factors: {salaried: 1.5, freelance: 0.3, founder: 0.2, transition: 0.5}}}
      - {code: unstable_income, label: "peur de revenus insuffisants ou irréguliers", rate: {base: 0.29, factors: {low_income: 1.4, freelance: 1.2}}}
      - {code: fear_failure, label: "peur de l'échec", rate: {base: 0.25, factors: {vague: 1.3}}}
      - {code: stress, label: "redoute la charge mentale et les responsabilités", rate: {base: 0.21, factors: {}}}
      - {code: mortgage, label: "un crédit immobilier à rembourser", rate: {base: 0.04, factors: {mortgage: 12}}}
      - {code: children, label: "des enfants en bas âge", rate: {base: 0.02, factors: {young_children: 22}}}
      - {code: partner_income, label: "le foyer dépend de son revenu (conjoint sans emploi)", rate: {base: 0.02, factors: {partner_not_employed: 20}}}
      - {code: no_idea, label: "pas d'idée assez solide", rate: {base: 0.18, factors: {vague: 2.5}}}
      - {code: missing_skills, label: "il lui manque des compétences complémentaires (vente, gestion, technique)", rate: {base: 0.25, factors: {}}}
      - {code: no_time, label: "pas le temps", rate: {base: 0.22, factors: {young_children: 1.6, salaried: 1.2}}}
      - {code: admin, label: "les démarches administratives et le statut", rate: {base: 0.13, factors: {freelance: 1.3}}}
      - {code: financing, label: "le financement de départ", rate: {base: 0.12, factors: {transition: 1.5}}}
    display: {empty: aucun frein majeur exprimé}
    sources: [ief_2023, gem, insee_sine]
    assumption: true
    justification: "IEF 2023 : revenu insuffisant ou instable 29 %, risque d'échec 21 %, stress 21 % ; GEM : peur de l'échec 42,7 % ; SINE : formalités 30 %. Effets du crédit, des enfants, du conjoint et du manque d'idée supposés. Au plus 4 freins par persona."
  - key: networks
    label: Outils et réseaux utilisés
    type: set
    rate_cap: 0.98
    items:
      - code: linkedin
        label: "LinkedIn (compte gratuit)"
        rate: {pick: status, values: {freelance_micro: 0.85, freelance_company: 0.88, founder_small: 0.85}, default: 0.8}
      - code: ex_colleagues
        label: "anciens collègues et camarades de promo"
        rate: {pick: status, values: {}, default: 0.6}
      - code: communities
        label: "communautés Slack ou Discord de son métier"
        rate: {pick: status, values: {freelance_micro: 0.4, freelance_company: 0.4}, default: 0.3}
      - code: meetups
        label: "meetups et événements tech"
        rate: {mul: [{pick: status, values: {founder_small: 0.35}, default: 0.2}, {pick: stage, values: {preparing: 1.6, seeking_partner: 1.8, vague: 0.6}, default: 1}]}
      - code: malt
        label: "Malt (profil freelance)"
        rate: {pick: status, values: {freelance_micro: 0.55, freelance_company: 0.5, transition: 0.15}, default: 0.04}
      - code: social_groups
        label: "groupes Facebook, WhatsApp ou forums d'entrepreneurs"
        rate: {mul: [{pick: status, values: {freelance_micro: 0.12}, default: 0.06}, {pick: stage, values: {preparing: 2, seeking_partner: 2}, default: 1}]}
      - code: support_network
        label: "Bpifrance, CCI ou réseau d'accompagnement (BGE, Réseau Entreprendre, France Travail)"
        rate: {mul: [{pick: status, values: {founder_small: 0.3, transition: 0.12, freelance_micro: 0.06}, default: 0.02}, {pick: stage, values: {preparing: 3, seeking_partner: 2.5}, default: 1}]}
      - code: incubator
        label: "incubateur ou accélérateur"
        rate: {mul: [{pick: status, values: {founder_small: 0.2}, default: 0.01}, {pick: stage, values: {preparing: 3, seeking_partner: 3}, default: 1}]}
    display: {empty: aucun réseau pro actif}
    sources: [insee_sine]
    assumption: true
    justification: "Aucune donnée officielle sur l'usage de LinkedIn, Malt, communautés ou meetups par ces actifs ; SINE : 16 % des créateurs appuyés par une structure d'aide, 11 % par une plateforme de mise en relation."
  - key: pro_tools
    label: Outils pro payés de sa poche
    type: set
    items:
      - code: linkedin_career
        label: "LinkedIn Premium Career"
        card_label: "LinkedIn Premium Career 29,99 €/mois"
        rate: {pick: status, values: {transition: 0.18, freelance_micro: 0.06}, default: 0.04}
        subscription: {name: "LinkedIn Premium Career", category: outil pro, monthly_eur: 29.99}
      - code: linkedin_business
        label: "LinkedIn Premium Business"
        card_label: "LinkedIn Premium Business 59,99 €/mois"
        rate: {pick: status, values: {freelance_company: 0.08, founder_small: 0.15}, default: 0.01}
        subscription: {name: "LinkedIn Premium Business", category: outil pro, monthly_eur: 59.99}
      - code: chatgpt
        label: "ChatGPT Plus"
        card_label: "ChatGPT Plus 23 €/mois"
        rate: {pick: status, values: {freelance_micro: 0.3, freelance_company: 0.3, founder_small: 0.35}, default: 0.15}
        subscription: {name: "ChatGPT Plus", category: outil pro, monthly_eur: 23}
      - code: copilot
        label: "GitHub Copilot Pro"
        card_label: "GitHub Copilot Pro 10 €/mois"
        rate: {pick: status, values: {freelance_micro: 0.15, freelance_company: 0.18}, default: 0.03}
        subscription: {name: "GitHub Copilot Pro", category: outil pro, monthly_eur: 10}
      - code: notion
        label: "Notion Plus"
        card_label: "Notion Plus 11,5 €/mois"
        rate: {pick: status, values: {freelance_micro: 0.1, freelance_company: 0.1, founder_small: 0.15}, default: 0.03}
        subscription: {name: "Notion Plus", category: outil pro, monthly_eur: 11.5}
      - code: figma
        label: "Figma Professional"
        card_label: "Figma Professional 15 €/mois"
        rate: {pick: status, values: {freelance_micro: 0.08, freelance_company: 0.06}, default: 0.01}
        subscription: {name: "Figma Professional", category: outil pro, monthly_eur: 15}
    display: {template: "outils pro payés de sa poche : {value}", empty: aucun outil pro payé de sa poche}
    assumption: true
    justification: "Prix publics 2025-2026 (LinkedIn Premium, ChatGPT Plus, GitHub Copilot, Notion, Figma) ; taux d'abonnement supposés, plus élevés chez les indépendants : les salariés font souvent payer leurs outils par l'employeur."
  - key: weekly_hours
    label: Heures par semaine disponibles pour le projet
    type: number
    unit: h/semaine
    value: {max: [0, {round: {mul: [{pick: stage, values: {vague: 0, idea: 1, preparing: 6, launched_solo: 8, seeking_partner: 7}, default: 0}, {if: young_children, then: 0.6, else: 1}, {exp: {mul: [0.4, {normal: {}}]}}]}}]}
    display: {template: "environ {value} h par semaine", empty: quasiment aucun pour l'instant}
    assumption: true
    justification: "Ordre de grandeur selon le stade (0 h pour une envie floue, 6 à 8 h pour un projet en préparation ou lancé), réduit de 40 % avec des enfants de moins de 12 ans."

# Situation professionnelle imposée au socle (remplace activité, PCS et revenu du tirage général).
socle_overrides:
  activity_status: {from: status}
  pcs: {from: status}
  monthly_income: {attr: monthly_income}
  occupation_label: "{occupation} — {status}"

# Lignes de fiche, insérées après « Situation ». {attr} = libellé de la valeur (accordé au sexe).
card:
  - when: has_daily_rate
    template: "Activité freelance : taux journalier ≈ {daily_rate} HT"
  - "Projet de création d'entreprise : {stage} ; {team} ; temps qu'il ou elle pourrait y consacrer : {weekly_hours}"
  - "Freins : {brakes}"
  - "Outils et réseaux utilisés aujourd'hui : {networks} ; {pro_tools}"

# Dimensions d'analyse (ids stables : quotas, tableau de bord) ; compare = rang dans study:compare.
segments:
  - {id: workStatus, attribute: status, label: Statut, compare: 3}
  - {id: projectStage, attribute: stage, label: Stade du projet, compare: 1}
  - {id: teamPreference, attribute: team, label: Seul ou à plusieurs, compare: 2}
  - {id: profession, attribute: occupation, label: Métier}

validation:
  margins:
    - {attribute: status, title: Statut professionnel}
    - {attribute: occupation, title: Métier}
    - {attribute: stage, title: Stade du projet entrepreneurial}
  plausibility:
    - label: "Revenu médian — {group} (n={n})"
      value: socle.monthly_income
      group_by: status
      median_in: {salaried_cadre: [2600, 5000], salaried_tech: [1700, 3200], freelance_micro: [1500, 5000], freelance_company: [3000, 9000], founder_small: [1000, 6000], transition: [0, 3500]}
    - label: "Salaire médian cadre — {group} (n={n})"
      value: socle.monthly_income
      group_by: occupation
      filter: {attr: status, eq: salaried_cadre}
      median_vs_table: {table: salary_median, range: [0.75, 1.3]}

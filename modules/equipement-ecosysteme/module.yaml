# Module « Équipement et écosystème » : système de l'ordinateur principal, puce du Mac, système du smartphone, usage de l'ordinateur.
# S'applique à tout adulte du socle, mais ne tire rien pour qui n'a ni ordinateur ni smartphone (variables du socle).
# Aucun croisement publié par PCS ou niveau de vie n'a été trouvé : tous les gradients sont des hypothèses de calibration.
# Format : docs/modules.md. L'ordre de déclaration est l'ordre de tirage (flux aléatoire propre au module).
id: equipement-ecosysteme
version: "2026.2"
label: Équipement et écosystème
short_label: Équipement
description: >-
  Écosystème numérique personnel : système d'exploitation de l'ordinateur principal (Windows, macOS, Linux, ChromeOS),
  puce du Mac (Apple Silicon ou Intel), système du smartphone (iOS ou Android), usage de l'ordinateur (personnel,
  professionnel, les deux) et ordinateur fourni par l'employeur. Conditionné à la possession d'un ordinateur ou d'un
  smartphone dans le socle, à l'âge, à la PCS, au niveau de vie, à l'adoption technologique et au métier du numérique.
applies_to: [fr]
requires: [numerique]

sources:
  statcounter_desktop_fr:
    org: "StatCounter Global Stats"
    title: "Desktop Operating System Market Share France"
    year: 2026
    url: "https://gs.statcounter.com/os-market-share/desktop/france"
    detail: "France, desktop, sept. 2026, pages vues web (pas parc) : Windows 77,3 %, OS X 11,4 % + macOS 6 % (Apple ≈ 17,4 %), Linux 4,5 %, ChromeOS 0,9 %. La catégorie « Unknown » fait varier les parts. Série OS X relayée par un résumé secondaire : 18,2 % (2022), 17,9 % (2023), 16,7 % (2024). Page non revérifiée."
  statcounter_mobile_fr:
    org: "StatCounter Global Stats"
    title: "Mobile Operating System Market Share France"
    year: 2026
    url: "https://gs.statcounter.com/os-market-share/mobile/france"
    detail: "France, mobile, sept. 2026, pages vues web : Android 65,4 %, iOS 34,6 % (résultat de recherche seulement, page non ouverte). Trafic web, plus favorable à iOS que le parc."
  credoc_barometre_2026:
    org: "CREDOC / Arcep / Arcom / CGE / ANCT"
    title: "Baromètre du numérique, équipements et usages (édition 2026, terrain juin 2025)"
    year: 2026
    url: "https://www.credoc.fr/download/pdf/Sou/Sou2026-5064.pdf"
    detail: "4 145 personnes de 12 ans et plus : smartphone 91 %, ordinateur 89 %, tablette 54 % ; usage quotidien de l'ordinateur 55 %. Chiffres tirés d'un résumé, PDF illisible. Le Baromètre ne publie pas l'OS de l'ordinateur."
  arcep_barometre_2025:
    org: "Arcep / CREDOC"
    title: "Baromètre du numérique - édition 2025 (présentation)"
    year: 2025
    url: "https://www.arcep.fr/uploads/tx_gspublication/barometre-du-numerique_edition_2025_PRESENTATION_mars2025.pdf"
    detail: "Juillet-août 2024 : OS des smartphones Android 74 %, iOS 25 %, autres 1 % (population exacte non confirmée)."
  iphoneaddict_credoc_ios:
    org: "iPhoneAddict.fr (relais de l'étude CREDOC)"
    title: "En France, iOS domine chez les 18-24 ans (étude CREDOC)"
    year: 2025
    url: "https://iphoneaddict.fr/post/news-404302-france-ios-domine-chez-18-24-ans-etude-credoc"
    detail: "Parc 2024 : iOS 25 %, Android 73 % (22 % / 77 % en 2019) ; 18-24 ans : iOS 52 % (39 % en 2019) ; seniors : 17 % ; 40-69 ans : Android ≈ 80 %. Plus d'iPhone chez les plus jeunes, plus aisés et plus urbains (non chiffré par PCS)."
  kantar_ventes_ios:
    org: "Kantar Worldpanel (via presse)"
    title: "iOS contre Android : le fossé générationnel se creuse en France"
    year: 2025
    url: "https://leclaireur.fnac.com/article/586715-ios-contre-android-le-fosse-generationnel-se-creuse-en-france/"
    detail: "Ventes (pas parc) : déc. 2024 iOS 29,1 % ; fin 2025 iOS ≈ 30,3 % (source secondaire). Signe d'une hausse du parc iOS d'environ 1 à 3 points par an."
  idc_mac_pc:
    org: "IDC (via MacGeneration)"
    title: "Marché du PC : les livraisons de Mac chutent, mais Apple gagne des parts de marché"
    year: 2026
    url: "https://www.macg.co/mac/2026/10/marche-du-pc-les-livraisons-de-mac-chutent-mais-apple-gagne-des-parts-de-marche-311545"
    detail: "Monde, ventes T3 2026 : Apple 9,5 % des livraisons de PC (8,5 % un an plus tôt). Pas de chiffre France ni Apple Silicon."
  jvtech_mac_fr:
    org: "JVTECH (jeuxvideo.com)"
    title: "Mac ou PC ? Les Français ont tranché : part de marché des ordinateurs Apple"
    year: 2023
    url: "https://www.jeuxvideo.com/news/1873719/mac-ou-pc-les-francais-ont-tranche-on-connait-desormais-la-part-de-marche-des-ordinateurs-apple.htm"
    detail: "France, ventes, ≈ 14 % de part de marché Mac ; Mac en entreprise ≈ 5 % (source IDC non précisée, ancien). Page non ouverte (403), chiffres issus d'un résumé de recherche."
  harris_fleet_cadres_2021:
    org: "Harris Interactive pour Fleet (via CIO Online)"
    title: "La qualité du matériel fourni aux salariés, un facteur important de bien-être au travail"
    year: 2021
    url: "https://www.cio-online.com/actualites/lire-la-qualite-du-materiel-fourni-aux-salaries-un-facteur-important-de-bien-etre-au-travail-13703.html"
    detail: "France, 502 cadres du secteur privé (21 juillet-11 août 2021), postes fournis par l'employeur : Windows 87 %, macOS 6 %, Chrome OS 5 %. Mesure l'équipement professionnel, pas le parc personnel ; aucune ventilation par revenu."

conditions:
  has_computer: {attr: socle.has_computer, eq: true}
  has_smartphone: {attr: socle.has_smartphone, eq: true}
  digital: {attr: numerique.is_digital_worker, eq: true}
  mac: {attr: computer_os, eq: macos}
  employed: {attr: socle.activity_status, eq: employed}
  work_computer: {all: [{attr: socle.activity_status, eq: employed}, {attr: computer_usage, in: [professional, both]}]}

tables:
  mac_age:
    label: "Coefficient d'âge pour macOS"
    bands:
      - {from: 18, to: 29, value: 1.2}
      - {from: 30, to: 44, value: 1.15}
      - {from: 45, to: 64, value: 0.9}
      - {from: 65, to: 79, value: 0.65}
    sources: [statcounter_desktop_fr]
    assumption: true
    justification: "Aucun croisement âge × OS publié. Mac surreprésenté chez les 18-44 ans et sous-représenté chez les plus de 65 ans (≈ 8-10 % de macOS) : hypothèse."
  mac_pcs:
    label: "Coefficient de PCS pour macOS"
    values: {"1": 0.6, "2": 1.3, "3": 1.6, "4": 1.0, "5": 0.8, "6": 0.5, none: 0.8}
    sources: [statcounter_desktop_fr, jvtech_mac_fr, harris_fleet_cadres_2021]
    assumption: true
    justification: "Mac surreprésenté chez les cadres et les indépendants, sous-représenté chez ouvriers, agriculteurs et employés ; aucun chiffre français par PCS ou revenu n'a été trouvé (recherche ciblée : Kantar, IDC, GfK, CREDOC, Baromètre du numérique ne publient pas l'OS par PCS), ordres de grandeur supposés (cadres ≈ x1,6 à x2 avec les effets du niveau de vie et du métier). Seul chiffre approchant : 6 % de macOS sur les postes fournis aux cadres du privé (Harris/Fleet 2021, vérifié), qui porte sur le matériel d'entreprise et ne confirme pas une surreprésentation des cadres dans le parc personnel ; le gradient reste une hypothèse qualitative."
  mac_occupation:
    label: "Coefficient de métier du numérique pour macOS"
    values: {dev: 2.2, devops: 1.6, data: 1.8, product: 2.2, design: 3.0, marketing: 1.8, consulting: 1.5, sales: 1.2, support: 0.8, leadership: 2.0}
    sources: [statcounter_desktop_fr]
    assumption: true
    justification: "Mac à 35-50 % chez les développeurs, designers et product managers, d'après l'ordre de grandeur de la recherche (non sourcé précisément). Le coefficient s'ajoute à celui de la PCS : calibré pour ne pas dépasser ≈ 45 % chez un cadre développeur jeune aisé."
  mac_tech:
    label: "Coefficient d'adoption technologique pour macOS"
    values: {innovator: 1.5, early_adopter: 1.35, early_majority: 1.05, late_majority: 0.8, laggard: 0.55}
    sources: [statcounter_desktop_fr]
    assumption: true
    justification: "Les adopteurs précoces équipent plus volontiers en Apple ; gradient supposé."
  linux_sex:
    label: "Coefficient de sexe pour Linux"
    values: {M: 1.4, F: 0.5}
    sources: [statcounter_desktop_fr]
    assumption: true
    justification: "Linux très masculin (communautés techniques) ; coefficients supposés, moyenne proche de 1."
  linux_occupation:
    label: "Coefficient de métier du numérique pour Linux"
    values: {dev: 4.0, devops: 5.0, data: 3.0, product: 0.8, design: 0.4, marketing: 0.3, consulting: 1.0, sales: 0.3, support: 1.5, leadership: 2.0}
    sources: [statcounter_desktop_fr]
    assumption: true
    justification: "Linux à 10-15 % chez les développeurs et devops d'après la recherche (ordre de grandeur non sourcé), très rare ailleurs."
  linux_tech:
    label: "Coefficient d'adoption technologique pour Linux"
    values: {innovator: 2.5, early_adopter: 1.5, early_majority: 1.0, late_majority: 0.8, laggard: 0.6}
    sources: [statcounter_desktop_fr]
    assumption: true
    justification: "Linux surtout chez les profils techniques et innovateurs ; gradient supposé."
  chip_age:
    label: "Coefficient d'âge pour un Mac à puce Intel"
    bands:
      - {from: 18, to: 34, value: 0.7}
      - {from: 35, to: 54, value: 1.0}
      - {from: 55, to: 79, value: 1.8}
    sources: [idc_mac_pc]
    assumption: true
    justification: "Transition Intel → Apple Silicon commencée en novembre 2020 : parc Mac actif fin 2026 supposé à 80-85 % Apple Silicon. Les Mac Intel se renouvellent moins chez les plus de 55 ans. Aucune donnée France."
  chip_tech:
    label: "Coefficient d'adoption technologique pour un Mac à puce Intel"
    values: {innovator: 0.5, early_adopter: 0.6, early_majority: 1.0, late_majority: 1.5, laggard: 2.0}
    sources: [idc_mac_pc]
    assumption: true
    justification: "Les adopteurs précoces renouvellent plus vite leur Mac. Hypothèse sans source."
  ios_age:
    label: "Rapport de cotes iOS / Android selon l'âge (poids relatif à Android = 1)"
    bands:
      - {from: 18, to: 24, value: 1.22}
      - {from: 25, to: 39, value: 0.54}
      - {from: 40, to: 69, value: 0.25}
      - {from: 70, to: 79, value: 0.2}
    sources: [iphoneaddict_credoc_ios, arcep_barometre_2025, kantar_ventes_ios]
    assumption: true
    justification: "Parc 2024 : 52 % d'iOS chez les 18-24 ans, 17 % chez les seniors, Android ≈ 80 % chez les 40-69 ans ; glissement d'environ 2 points vers 2026 (ventes ≈ 30 %). Parts retenues : 55 % / 35 % / 20 % / 17 %, converties en rapports de cotes. Tranche 25-39 ans non publiée : hypothèse."
  ios_pcs:
    label: "Coefficient de PCS pour iOS"
    values: {"1": 0.8, "2": 1.1, "3": 1.35, "4": 1.0, "5": 0.95, "6": 0.85, none: 0.95}
    sources: [iphoneaddict_credoc_ios]
    assumption: true
    justification: "Le CREDOC indique qualitativement plus d'iPhone chez les plus aisés ; aucun chiffre par PCS."
  ios_town:
    label: "Coefficient de taille d'agglomération pour iOS"
    values: {rural: 0.85, uu_lt20k: 0.92, uu_20k_100k: 1.0, uu_100k_200k: 1.0, uu_200k_2m: 1.05, uu_paris: 1.25}
    sources: [iphoneaddict_credoc_ios]
    assumption: true
    justification: "Plus d'iPhone chez les urbains (CREDOC, qualitatif) ; gradient supposé."

attributes:
  - key: computer_os
    label: Système de l'ordinateur principal
    type: enum
    when: has_computer
    values:
      - {code: windows, label: Windows}
      - {code: macos, label: macOS}
      - {code: linux, label: Linux}
      - {code: chromeos, label: ChromeOS}
    distribution:
      weights:
        windows: 77
        macos:
          mul:
            - 14
            - {lookup: mac_age, by: socle.age}
            - {lookup: mac_pcs, by: socle.pcs}
            - {cases: [{when: {attr: socle.living_standard_ratio, lt: 0.7}, value: 0.6}, {when: {attr: socle.living_standard_ratio, lt: 1.0}, value: 0.85}, {when: {attr: socle.living_standard_ratio, lt: 1.5}, value: 1.1}, {else: 1.5}]}
            - {lookup: mac_tech, by: socle.tech_adoption}
            - {if: digital, then: {lookup: mac_occupation, by: numerique.occupation}, else: 1}
        linux:
          mul:
            - 4
            - {lookup: linux_sex, by: socle.sex}
            - {lookup: linux_tech, by: socle.tech_adoption}
            - {if: digital, then: {lookup: linux_occupation, by: numerique.occupation}, else: 1}
        chromeos:
          cases: [{when: {attr: socle.activity_status, eq: student}, value: 2.5}, {else: 1}]
      sampler: random
    sources: [statcounter_desktop_fr, jvtech_mac_fr]
    assumption: true
    justification: "Aucune source de parc installé de Mac en France (Kantar, IDC, GfK, CREDOC) trouvée : le Baromètre du numérique ne publie pas l'OS de l'ordinateur. La part macOS est donc une hypothèse calée entre les ventes (≈ 14 %, JVTECH, non vérifié) et le trafic web (Apple ≈ 17 %, StatCounter, qui n'est pas un parc) ; le parc personnel est supposé autour de 13-16 %, le parc d'entreprise plus bas (Mac ≈ 5-6 %). StatCounter n'est pas pris comme parc. Base nationale ≈ 77 % Windows, 4-5 % Linux, 1 % ChromeOS (StatCounter). Tous les gradients (âge, PCS, niveau de vie, adoption, métier du numérique) sont des hypothèses : aucun croisement publié trouvé."

  - key: mac_chip
    label: Puce du Mac
    type: enum
    when: mac
    values:
      - {code: apple_silicon, label: "puce Apple (M1 et suivants)"}
      - {code: intel, label: "processeur Intel"}
    distribution:
      weights:
        apple_silicon: 85
        intel:
          mul:
            - 15
            - {lookup: chip_age, by: socle.age}
            - {lookup: chip_tech, by: socle.tech_adoption}
            - {cases: [{when: {attr: socle.living_standard_ratio, lt: 0.8}, value: 1.4}, {when: {attr: socle.living_standard_ratio, gt: 1.3}, value: 0.8}, {else: 1}]}
      sampler: random
    sources: [idc_mac_pc]
    assumption: true
    justification: "Aucune source France sur la part Apple Silicon / Intel. Hypothèse fondée sur le calendrier d'Apple (transition depuis novembre 2020) : ≈ 80-85 % d'Apple Silicon dans le parc Mac actif fin 2026, davantage d'Intel chez les 55 ans et plus, les faibles niveaux de vie et les profils late_majority / laggard."

  - key: smartphone_os
    label: Système du smartphone
    type: enum
    when: has_smartphone
    values:
      - {code: ios, label: "iOS (iPhone)"}
      - {code: android, label: Android}
    distribution:
      weights:
        android: 100
        ios:
          mul:
            - 100
            - {lookup: ios_age, by: socle.age}
            - {lookup: ios_pcs, by: socle.pcs}
            - {lookup: ios_town, by: socle.town_size}
            - {cases: [{when: {attr: socle.living_standard_ratio, lt: 0.7}, value: 0.8}, {when: {attr: socle.living_standard_ratio, lt: 1.0}, value: 0.95}, {when: {attr: socle.living_standard_ratio, lt: 1.5}, value: 1.1}, {else: 1.3}]}
            - {pick: computer_os, values: {macos: 4}, default: 0.8}
      sampler: random
    sources: [arcep_barometre_2025, iphoneaddict_credoc_ios, kantar_ventes_ios]
    assumption: true
    justification: "Parc 2024 : iOS 25 %, Android 73-74 % (Arcep / CREDOC), glissement vers ≈ 27 % fin 2026 ; gradient d'âge sourcé (52 % chez les 18-24 ans, 17 % chez les seniors). Gradients de PCS, niveau de vie et agglomération supposés (qualitatifs dans la source). Un utilisateur de Mac a ≈ 65-75 % d'iPhone (hypothèse) : coefficient x4 sur le rapport de cotes, 0,8 pour les autres. Sources Arcep et relais CREDOC non revérifiées dans cette session."

  - key: computer_usage
    label: Usage de l'ordinateur principal
    type: enum
    when: has_computer
    values:
      - {code: personal, label: personnel}
      - {code: professional, label: professionnel}
      - {code: both, label: "personnel et professionnel"}
    distribution:
      given: [socle.activity_status, socle.pcs]
      table:
        employed:
          "1": {personal: 40, professional: 20, both: 40}
          "2": {personal: 15, professional: 15, both: 70}
          "3": {personal: 12, professional: 18, both: 70}
          "4": {personal: 25, professional: 25, both: 50}
          "5": {personal: 50, professional: 20, both: 30}
          "6": {personal: 65, professional: 10, both: 25}
          default: {personal: 35, professional: 25, both: 40}
        unemployed:
          default: {personal: 85, professional: 3, both: 12}
        student:
          default: {personal: 85, professional: 0, both: 15}
        retired:
          default: {personal: 97, professional: 0, both: 3}
        default:
          default: {personal: 97, professional: 0, both: 3}
      sampler: random
    sources: [credoc_barometre_2026]
    assumption: true
    justification: "Pas de source trouvée sur l'usage pro / perso de l'ordinateur. Hypothèse : non actifs presque toujours en usage personnel ; actifs en emploi ≈ 35 % personnel, 25 % professionnel, 40 % les deux en moyenne, cadres et indépendants surtout « les deux » (65-75 %), employés et ouvriers majoritairement personnel."

  - key: employer_provided_computer
    label: Ordinateur fourni par l'employeur
    type: boolean
    when: work_computer
    rate:
      min:
        - 0.95
        - mul:
            - cases:
                - {when: {attr: numerique.work_status, in: [freelance_micro, freelance_company, founder_small]}, value: 0.04}
                - {when: {attr: socle.pcs, eq: "3"}, value: 0.85}
                - {when: {attr: socle.pcs, eq: "4"}, value: 0.65}
                - {when: {attr: socle.pcs, eq: "5"}, value: 0.45}
                - {when: {attr: socle.pcs, eq: "6"}, value: 0.15}
                - {when: {attr: socle.pcs, eq: "1"}, value: 0.03}
                - {when: {attr: socle.pcs, eq: "2"}, value: 0.04}
                - {else: 0.3}
            - {pick: computer_usage, values: {professional: 1.15, both: 0.9}, default: 1}
    labels: {yes: ordinateur fourni par l'employeur, no: ordinateur personnel}
    sources: [credoc_barometre_2026]
    assumption: true
    justification: "Aucun chiffre France trouvé (Eurostat, Insee, Dares non localisés). Hypothèse pour les personnes en emploi qui utilisent leur ordinateur au travail : cadres salariés ≈ 85 %, professions intermédiaires ≈ 65 %, employés ≈ 45 %, ouvriers ≈ 15 %, indépendants et dirigeants ≈ 4 % ; un peu plus quand l'ordinateur est exclusivement professionnel. Un Mac fourni par l'employeur n'est pas modélisé séparément (Mac ≈ 5-6 % du parc d'entreprise : JVTECH ≈ 5 %, non vérifié ; Harris/Fleet 2021 : 6 % des postes de cadres du privé)."

card:
  - when: {attr: computer_os, present: true}
    template: "Ordinateur principal : {computer_os}"
  - when: mac
    template: "Mac : {mac_chip}"
  - when: {attr: computer_usage, present: true}
    template: "Usage de l'ordinateur : {computer_usage}"
  - when: {attr: employer_provided_computer, eq: true}
    template: "Ordinateur fourni par l'employeur"
  - when: {attr: smartphone_os, present: true}
    template: "Smartphone : {smartphone_os}"

segments:
  - {id: equipementComputerOs, attribute: computer_os, label: Système de l'ordinateur, compare: 4}
  - {id: equipementMacChip, attribute: mac_chip, label: Puce du Mac}
  - {id: equipementSmartphoneOs, attribute: smartphone_os, label: Système du smartphone}
  - {id: equipementComputerUsage, attribute: computer_usage, label: Usage de l'ordinateur}

validation:
  margins:
    - {attribute: computer_os, title: "Système de l'ordinateur (attendu selon l'âge, la PCS, le niveau de vie et le métier)"}
    - {attribute: mac_chip, title: "Puce du Mac (attendu selon l'âge, l'adoption et le niveau de vie)"}
    - {attribute: smartphone_os, title: "Système du smartphone (attendu selon l'âge, la PCS, l'agglomération et l'ordinateur)"}
    - {attribute: computer_usage, title: "Usage de l'ordinateur (attendu selon l'activité et la PCS)"}
  shares:
    - label: "macOS parmi les possesseurs d'ordinateur (hypothèse de parc 13-16 % entre ventes ≈ 14 %, JVTECH, et pages vues web Apple ≈ 17 %, StatCounter ; ni l'une ni l'autre n'est un parc, aucune source de parc trouvée)"
      among: has_computer
      share_of: mac
      range: [0.11, 0.20]
    - label: "Linux parmi les possesseurs d'ordinateur (StatCounter : 4,5 %)"
      among: has_computer
      share_of: {attr: computer_os, eq: linux}
      range: [0.025, 0.07]
    - label: "iOS parmi les possesseurs de smartphone (Arcep / CREDOC : 25 % en 2024, ≈ 27 % attendu fin 2026)"
      among: has_smartphone
      share_of: {attr: smartphone_os, eq: ios}
      range: [0.22, 0.32]
    - label: "iOS parmi les 18-24 ans avec smartphone (CREDOC : 52 % en 2024)"
      among: {all: [has_smartphone, {attr: socle.age, lt: 25}]}
      share_of: {attr: smartphone_os, eq: ios}
      range: [0.44, 0.62]
    - label: "iOS parmi les 70 ans et plus avec smartphone (CREDOC : seniors 17 %)"
      among: {all: [has_smartphone, {attr: socle.age, gt: 69}]}
      share_of: {attr: smartphone_os, eq: ios}
      range: [0.10, 0.24]
    - label: "Apple Silicon parmi les Mac (hypothèse : 80-85 % du parc fin 2026)"
      among: mac
      share_of: {attr: mac_chip, eq: apple_silicon}
      range: [0.72, 0.92]

eligibility_helpers:
  mac_user: "equipement-ecosysteme.computer_os == macos"
  apple_silicon_mac: "equipement-ecosysteme.computer_os == macos and equipement-ecosysteme.mac_chip == apple_silicon"
  apple_silicon_mac_at_work: "equipement-ecosysteme.computer_os == macos and equipement-ecosysteme.mac_chip == apple_silicon and activity_status == employed and equipement-ecosysteme.computer_usage in [professional, both]"
  mac_and_iphone: "equipement-ecosysteme.computer_os == macos and equipement-ecosysteme.smartphone_os == ios"
  windows_user: "equipement-ecosysteme.computer_os == windows"
  linux_user: "equipement-ecosysteme.computer_os == linux"
  iphone_user: "equipement-ecosysteme.smartphone_os == ios"
  employer_computer: "equipement-ecosysteme.employer_provided_computer"
  has_computer_for_work: "has_computer and equipement-ecosysteme.computer_usage in [professional, both]"

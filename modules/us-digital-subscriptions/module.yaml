# Module "US digital subscriptions": behaviours around subscriptions (churn, free trials, billing, tracking, app spend, ad tiers).
# Generic: not tied to any product. The socle already draws the subscriptions themselves; this module never changes income or budget.
id: us-digital-subscriptions
version: "2026.2"
changelog:
  - version: "2026.2"
    date: "2026-10-22"
    changes: ["First version: churn, free trials, billing cycle, awareness of own spending, unused subscriptions, paid app spend band, ad-supported tier acceptance."]
label: Digital subscriptions and online spending habits
short_label: Subscriptions
description: >-
  Generic behaviours around digital subscriptions and apps in the United States, reusable by any app or SaaS study:
  paid subscriptions cancelled in the last 6 months, free trial habits, monthly vs annual billing preference,
  awareness of own subscription spending (including tracker use and unused subscriptions), monthly spend on paid apps
  and in-app purchases, and acceptance of ad-supported plans. Conditioned on age, living standard, tech adoption,
  education, household type, activity status and class of worker. Most published figures come from industry surveys
  (Deloitte, Antenna, Self Financial, C+R Research) and cover streaming video or online non-probability samples:
  extending them to all apps and SaaS is an assumption. No effect on socle income or budget.
applies_to: [us]
requires: []

sources:
  deloitte_dmt_2026:
    org: "Deloitte Insights (industry survey)"
    title: "2026 Digital Media Trends: Capturing always-on fandom between releases and seasons"
    year: 2026
    url: "https://www.deloitte.com/us/en/insights/industry/technology/digital-media-trends-consumption-habits-survey.html"
    detail: "US consumers 14+, n=3,575, fielded Oct-Nov 2025. Churn (cancelled at least one paid SVOD in 6 months) 41%, millennials 52%, 68% with at least one ad-supported tier: figures from search summaries, not confirmed on the page text."
  deloitte_dmt_2025:
    org: "Deloitte Insights (industry survey)"
    title: "2025 Digital Media Trends: Social platforms are becoming a dominant force"
    year: 2025
    url: "https://www.deloitte.com/us/en/insights/industry/technology/digital-media-trends-consumption-habits-survey/2025.html"
    detail: "Fielded Oct 2024: over half of streaming subscribers use ad-supported tiers (54%, 58% among Gen X and Boomers per summaries); churn 39% in 6 months."
  antenna_serial_churn:
    org: "Antenna (industry data)"
    title: "Antenna's 2024 Top Subscription Insights: Serial Churn"
    year: 2024
    url: "https://www.antenna.live/insights/antennas-2024-top-subscription-insights-serial-churn"
    detail: "US premium SVOD, Q3 2024: serial churners (3+ cancellations in 2 years) = 23% of subscribers, 41% of gross adds."
  antenna_adds_ads:
    org: "Antenna / Deadline (industry data)"
    title: "Streaming Enters New Phase Of More Stable Growth As Ad Tiers Gain Traction"
    year: 2025
    url: "https://deadline.com/2025/06/antenna-streaming-data-stable-growth-ad-tiers-subscriber-churn-1236442624/"
    detail: "Ad-supported plans about 48% of US SVOD subscriptions and 57% of premium gross adds in Q1 2025 (subscriptions, not individuals). Page not opened."
  self_unused_subs_2026:
    org: "Self Financial (industry survey)"
    title: "Cost of Unused Paid Subscriptions 2026"
    year: 2026
    url: "https://www.self.inc/info/cost-of-unused-paid-subscriptions/"
    detail: "1,272 US adults with at least one paid subscription, March 2026: 59.9% have at least one subscription unused in 30 days; 70% forgot to cancel a free trial and were charged. Online non-probability sample."
  cr_research_2022:
    org: "C+R Research via CNBC (industry survey)"
    title: "Consumers spend an average $133 more each month on subscriptions than they realize"
    year: 2022
    url: "https://www.cnbc.com/2022/06/02/consumers-spend-133-more-monthly-on-subscriptions-than-they-realize.html"
    detail: "About 1,000 US consumers: guess $86/month vs actual $219; 42% forgot a charge for an unused subscription; younger respondents more likely to pay for unused ones. Page not opened."
  free_trial_surveys:
    org: "Dimers / BestMoney / CableTV.com (industry surveys)"
    title: "Free trials are costing Americans $540 a year, on average, survey finds"
    year: 2025
    url: "https://finance.yahoo.com/personal-finance/banking/article/free-trials-are-costing-americans-540-a-year-on-average-survey-finds-210124206.html"
    detail: "Charged after forgetting to cancel a trial: 48% to 79% depending on survey. Page not opened."
  sensor_tower_2026:
    org: "Sensor Tower (industry data)"
    title: "State of Mobile 2026: App Spending Reaches $167 Billion"
    year: 2026
    url: "https://sensortower.com/press/press-release-boosted-by-gen-ai-services-consumers-spent-more-money-in-apps-than-games-for-first-time"
    detail: "Global in-app purchase revenue $167B in 2025. Aggregate only; no per-user distribution."

conditions:
  online:
    any:
      - {attr: socle.has_smartphone, eq: true}
      - {attr: socle.has_internet, eq: true}
  has_phone: {attr: socle.has_smartphone, eq: true}
  student: {attr: socle.activity_status, eq: student}
  self_employed: {attr: socle.class_of_worker, eq: self_employed}
  ad_tier_yes: {attr: ad_tier_acceptance, eq: ad_tier_when_cheaper}
  charged_trials: {attr: free_trial_behavior, in: [sometimes_charged, often_charged]}

tables:
  churn_age:
    label: "Churn coefficient by age"
    bands:
      - {from: 18, to: 29, value: 1.4}
      - {from: 30, to: 44, value: 1.15}
      - {from: 45, to: 59, value: 0.85}
      - {from: 60, to: 79, value: 0.55}
    sources: [deloitte_dmt_2026, deloitte_dmt_2025]
    assumption: true
    justification: "Deloitte: millennials about 52% and Gen Z above 50% cancelled at least one SVOD vs 41% overall; older groups lower. Gradient smoothed; population-weighted mean close to 0.95."
  churn_tech:
    label: "Churn coefficient by tech adoption profile"
    values: {innovator: 1.3, early_adopter: 1.2, early_majority: 1.0, late_majority: 0.8, laggard: 0.55}
    assumption: true
    justification: "No published gradient; heavier digital users hold more subscriptions and so have more occasions to cancel."
  churn_household:
    label: "Churn coefficient by household type (small effect)"
    values: {alone: 1.0, couple_no_child: 0.95, couple_with_children: 0.95, single_parent: 1.0, with_parents: 1.1, other: 1.05}
    assumption: true
    justification: "Plausible but undocumented effect; kept within +/-10%."
  trial_age:
    label: "Coefficient for being charged after a free trial, by age"
    bands:
      - {from: 18, to: 34, value: 1.35}
      - {from: 35, to: 49, value: 1.0}
      - {from: 50, to: 64, value: 0.75}
      - {from: 65, to: 79, value: 0.5}
    sources: [cr_research_2022]
    assumption: true
    justification: "C+R Research: younger respondents more likely to pay for unused subscriptions; magnitude assumed. Gradient steepened so that younger adults clearly use and forget more trials than older ones; population-weighted mean about 0.9."
  trial_avoid_age:
    label: "Coefficient for avoiding free trials, by age"
    bands:
      - {from: 18, to: 34, value: 0.8}
      - {from: 35, to: 49, value: 1.0}
      - {from: 50, to: 64, value: 1.1}
      - {from: 65, to: 79, value: 1.4}
    assumption: true
    justification: "Assumption: older adults start fewer trials online."
  trial_tech:
    label: "Free trial usage coefficient by tech adoption profile"
    values: {innovator: 1.2, early_adopter: 1.15, early_majority: 1.0, late_majority: 0.85, laggard: 0.6}
    assumption: true
    justification: "More digital services tried means more trials started; no published gradient."
  tracker_age:
    label: "Subscription tracker use coefficient by age"
    bands:
      - {from: 18, to: 44, value: 1.3}
      - {from: 45, to: 64, value: 0.9}
      - {from: 65, to: 79, value: 0.5}
    assumption: true
    justification: "No published tracker share; younger adults are assumed to use budgeting apps more."
  exact_total_education:
    label: "Coefficient for knowing the exact subscription total, by education"
    values: {below_hs: 0.8, high_school: 0.9, some_college: 1.0, associate: 1.0, bachelor: 1.15, graduate: 1.25}
    assumption: true
    justification: "Assumed mild gradient with financial record-keeping; undocumented."
  unused_age:
    label: "Coefficient for holding an unused subscription, by age"
    bands:
      - {from: 18, to: 34, value: 1.15}
      - {from: 35, to: 49, value: 1.05}
      - {from: 50, to: 64, value: 0.92}
      - {from: 65, to: 79, value: 0.7}
    sources: [cr_research_2022]
    assumption: true
    justification: "C+R Research: younger respondents more likely to pay for unused subscriptions; magnitude assumed."
  unused_awareness:
    label: "Coefficient for holding an unused subscription, by awareness of spending"
    values: {knows_exact_total: 0.7, rough_idea: 1.0, uses_tracker: 0.8, no_idea: 1.3}
    assumption: true
    justification: "People who monitor their spending are assumed to have fewer forgotten subscriptions; weighted mean about 1."
  app_age:
    label: "Paid apps and in-app purchases coefficient by age"
    bands:
      - {from: 18, to: 34, value: 1.3}
      - {from: 35, to: 49, value: 1.1}
      - {from: 50, to: 64, value: 0.8}
      - {from: 65, to: 79, value: 0.5}
    assumption: true
    justification: "No per-user distribution found (Sensor Tower gives aggregates only); younger adults assumed to spend more in apps."
  app_tech:
    label: "Paid apps coefficient by tech adoption profile"
    values: {innovator: 1.5, early_adopter: 1.3, early_majority: 1.0, late_majority: 0.7, laggard: 0.4}
    assumption: true
    justification: "Assumed gradient; undocumented."
  ad_tier_age:
    label: "Ad-supported plan acceptance coefficient by age"
    bands:
      - {from: 18, to: 29, value: 0.9}
      - {from: 30, to: 49, value: 1.0}
      - {from: 50, to: 79, value: 1.1}
    sources: [deloitte_dmt_2025]
    assumption: true
    justification: "Deloitte 2025: Gen X and Boomers lead ad tier adoption (58% vs 54% overall); younger groups were more willing to pay to avoid ads in earlier editions. Small gradient."
  ad_free_age:
    label: "Ad-free-only coefficient by age"
    bands:
      - {from: 18, to: 29, value: 1.2}
      - {from: 30, to: 79, value: 1.0}
    sources: [deloitte_dmt_2025]
    assumption: true
    justification: "Mirror of the ad tier gradient; small."

attributes:
  - key: cancellations_6m
    label: Paid subscriptions cancelled in last 6 months
    type: enum
    when: online
    values:
      - {code: none, label: none cancelled}
      - {code: one, label: one cancelled}
      - {code: two, label: two cancelled}
      - {code: three_or_more, label: three or more cancelled}
    distribution:
      sampler: quasi
      weights:
        none: 59
        one: {mul: [21, {lookup: churn_age, by: socle.age}, {lookup: churn_tech, by: socle.tech_adoption}, {lookup: churn_household, by: socle.household_type}]}
        two: {mul: [10, {lookup: churn_age, by: socle.age}, {lookup: churn_tech, by: socle.tech_adoption}, {lookup: churn_household, by: socle.household_type}]}
        three_or_more: {mul: [10, {lookup: churn_age, by: socle.age}, {lookup: churn_tech, by: socle.tech_adoption}, {lookup: churn_household, by: socle.household_type}]}
    sources: [deloitte_dmt_2026, antenna_serial_churn]
    assumption: true
    justification: "Anchored on Deloitte (about 41% cancelled at least one paid SVOD in 6 months; figure from search summaries, not confirmed on the page) and Antenna serial churners (23% of subscribers); split into one/two/three or more is inferred. Streaming video figures extended to all app and SaaS subscriptions."

  - key: free_trial_behavior
    label: Free trial habits
    type: enum
    when: online
    values:
      - {code: avoids_trials, label: avoids free trials}
      - {code: cancels_before_charge, label: starts trials and cancels before being charged}
      - {code: sometimes_charged, label: has been charged once or twice after forgetting a trial}
      - {code: often_charged, label: has been charged several times after forgetting a trial}
    distribution:
      sampler: quasi
      weights:
        avoids_trials: {mul: [16, {lookup: trial_avoid_age, by: socle.age}, {div: [1, {lookup: trial_tech, by: socle.tech_adoption}]}]}
        cancels_before_charge: 24
        sometimes_charged: {mul: [31, {lookup: trial_age, by: socle.age}, {lookup: trial_tech, by: socle.tech_adoption}]}
        often_charged: {mul: [17, {lookup: trial_age, by: socle.age}, {lookup: trial_tech, by: socle.tech_adoption}]}
    sources: [self_unused_subs_2026, free_trial_surveys, cr_research_2022]
    assumption: true
    justification: "Surveys give 48% to 79% charged after forgetting a trial (70% in Self Financial, among subscribers only; online non-probability samples, pages not all opened). Because the module covers all online adults, including people with no subscription and people who avoid trials, a deliberately conservative level of about 48% (the bottom of the survey range) is targeted. Age tilt from C+R (younger adults use and forget more trials, older adults avoid them more); magnitude and tech tilt assumed."

  - key: billing_preference
    label: Billing cycle preference for subscriptions
    type: enum
    when: online
    values:
      - {code: monthly, label: prefers monthly billing}
      - {code: annual_if_discounted, label: prefers annual billing when discounted}
      - {code: no_preference, label: no preference}
    distribution:
      sampler: quasi
      weights:
        monthly:
          mul:
            - 52
            - cases:
                - when: {attr: socle.living_standard_ratio, lt: 0.7}
                  value: 1.2
                - when: {attr: socle.living_standard_ratio, gt: 1.5}
                  value: 0.85
                - else: 1
            - cases:
                - when: student
                  value: 1.2
                - when: self_employed
                  value: 1.1
                - else: 1
        annual_if_discounted:
          mul:
            - 22
            - cases:
                - when: {attr: socle.living_standard_ratio, lt: 0.7}
                  value: 0.6
                - when: {attr: socle.living_standard_ratio, gt: 1.5}
                  value: 1.5
                - else: 1
            - cases:
                - when: student
                  value: 0.7
                - when: self_employed
                  value: 0.8
                - else: 1
        no_preference: 26
    assumption: true
    justification: "No published US distribution of individual preference for monthly vs annual billing. Assumption: monthly is the plurality (about half), more so at low living standard, for students and for irregular income; annual more likely with higher living standard."

  - key: subscription_awareness
    label: Awareness of own subscription spending
    type: enum
    when: online
    values:
      - {code: knows_exact_total, label: knows the exact monthly total}
      - {code: rough_idea, label: has a rough idea of the monthly total}
      - {code: uses_tracker, label: uses an app or spreadsheet to track subscriptions}
      - {code: no_idea, label: has no clear idea of the monthly total}
    distribution:
      sampler: quasi
      weights:
        knows_exact_total: {mul: [20, {lookup: exact_total_education, by: socle.education}]}
        rough_idea: 40
        uses_tracker: {mul: [13, {lookup: tracker_age, by: socle.age}, {lookup: trial_tech, by: socle.tech_adoption}]}
        no_idea: 27
    sources: [cr_research_2022, self_unused_subs_2026]
    assumption: true
    justification: "C+R Research (about 1,000 consumers, 2022): typical guess $86 vs actual $219, 74% say recurring charges are easy to forget, so exact knowledge is kept small. No published tracker share; about 13% assumed, higher for under-45s and early adopters."

  - key: unused_subscription_now
    label: Currently paying for an unused subscription
    type: enum
    when: online
    values:
      - {code: has_unused, label: pays for at least one subscription not used in the last 30 days}
      - {code: none_unused, label: no unused subscription}
    distribution:
      sampler: quasi
      weights:
        has_unused:
          min:
            - 0.9
            - mul: [0.54, {lookup: unused_age, by: socle.age}, {lookup: unused_awareness, by: subscription_awareness}]
        none_unused:
          max:
            - 0.1
            - add:
                - 1
                - mul:
                    - -1
                    - min:
                        - 0.9
                        - mul: [0.54, {lookup: unused_age, by: socle.age}, {lookup: unused_awareness, by: subscription_awareness}]
    sources: [self_unused_subs_2026, cr_research_2022]
    assumption: true
    justification: "Self Financial (March 2026): 59.9% of adults with at least one subscription have one unused for 30 days (online non-probability sample); C+R 42% 'forgot' wording gives a lower bound. Base slightly lowered to include people with no paid subscription; age and awareness tilts assumed. Weights sum to 1 (probability of having an unused subscription capped at 0.9)."

  - key: paid_app_spend_band
    label: Monthly spend on paid apps and in-app purchases
    type: enum
    when: has_phone
    values:
      - {code: none, label: nothing}
      - {code: under_5, label: under $5}
      - {code: from_5_to_14, label: $5 to $14}
      - {code: from_15_to_29, label: $15 to $29}
      - {code: from_30_plus, label: $30 or more}
    distribution:
      sampler: quasi
      weights:
        none: 42
        under_5:
          mul:
            - 24
            - {lookup: app_age, by: socle.age}
            - {lookup: app_tech, by: socle.tech_adoption}
        from_5_to_14:
          mul:
            - 19
            - {lookup: app_age, by: socle.age}
            - {lookup: app_tech, by: socle.tech_adoption}
            - cases:
                - when: {attr: socle.living_standard_ratio, lt: 0.6}
                  value: 0.6
                - when: {attr: socle.living_standard_ratio, lt: 1}
                  value: 0.9
                - when: {attr: socle.living_standard_ratio, lt: 1.5}
                  value: 1.1
                - else: 1.3
        from_15_to_29:
          mul:
            - 9
            - {lookup: app_age, by: socle.age}
            - {lookup: app_tech, by: socle.tech_adoption}
            - cases:
                - when: {attr: socle.living_standard_ratio, lt: 0.6}
                  value: 0.5
                - when: {attr: socle.living_standard_ratio, lt: 1}
                  value: 0.85
                - when: {attr: socle.living_standard_ratio, lt: 1.5}
                  value: 1.15
                - else: 1.4
        from_30_plus:
          mul:
            - 5
            - {lookup: app_age, by: socle.age}
            - {lookup: app_age, by: socle.age}
            - {lookup: app_tech, by: socle.tech_adoption}
            - {lookup: app_tech, by: socle.tech_adoption}
            - cases:
                - when: {attr: socle.living_standard_ratio, lt: 0.6}
                  value: 0.4
                - when: {attr: socle.living_standard_ratio, lt: 1}
                  value: 0.8
                - when: {attr: socle.living_standard_ratio, lt: 1.5}
                  value: 1.2
                - else: 1.6
    sources: [sensor_tower_2026]
    assumption: true
    justification: "Sensor Tower gives only aggregate spend (global in-app revenue $167B in 2025), no per-user distribution. Assumed: about 40% pay nothing in a month and a small tail pays $30 or more. The top band applies the age and tech-adoption coefficients twice (squared effect, base lowered to keep the share of people spending something about the same) so that heavy spenders are concentrated among young adults and early adopters. Excludes subscriptions already drawn in the socle. Only for smartphone owners."

  - key: ad_tier_acceptance
    label: Acceptance of ad-supported plans to pay less
    type: enum
    when: online
    values:
      - {code: ad_free_only, label: only takes ad-free plans}
      - {code: depends_on_service, label: accepts ads on some services only}
      - {code: ad_tier_when_cheaper, label: takes the ad-supported plan when it is cheaper}
    distribution:
      sampler: quasi
      weights:
        ad_free_only:
          mul:
            - 18
            - {lookup: ad_free_age, by: socle.age}
            - cases:
                - when: {attr: socle.living_standard_ratio, lt: 0.7}
                  value: 0.8
                - when: {attr: socle.living_standard_ratio, gt: 1.5}
                  value: 1.2
                - else: 1
        depends_on_service: 24
        ad_tier_when_cheaper:
          mul:
            - 58
            - {lookup: ad_tier_age, by: socle.age}
            - cases:
                - when: {attr: socle.living_standard_ratio, lt: 0.7}
                  value: 1.15
                - when: {attr: socle.living_standard_ratio, gt: 1.5}
                  value: 0.85
                - else: 1
            - cases:
                - when: {attr: socle.household_type, in: [couple_with_children, single_parent]}
                  value: 1.1
                - else: 1
    sources: [deloitte_dmt_2025, deloitte_dmt_2026, antenna_adds_ads]
    assumption: true
    justification: "Observed adoption used as a proxy for acceptance: over half of streaming subscribers use an ad-supported tier (Deloitte 2025, 54%; Antenna: about 48% of SVOD subscriptions, 57% of gross adds). Applied to the whole online adult population, so about 55% kept. Age gradient small and non-monotonic; living standard and children tilts assumed."

card:
  - when: online
    template: "Subscription churn: {cancellations_6m} in the last 6 months"
  - when: online
    template: "Free trials: {free_trial_behavior}"
  - when: online
    template: "Billing: {billing_preference}"
  - when: online
    template: "Subscription tracking: {subscription_awareness}; {unused_subscription_now}"
  - when: has_phone
    template: "Paid apps and in-app purchases: {paid_app_spend_band} per month"
  - when: online
    template: "Ad-supported plans: {ad_tier_acceptance}"

segments:
  - {id: usSubsChurn, attribute: cancellations_6m, label: Subscriptions cancelled (6 months)}
  - {id: subsFreeTrial, attribute: free_trial_behavior, label: Free trial habits}
  - {id: usSubsBilling, attribute: billing_preference, label: Billing cycle preference}
  - {id: subsAwareness, attribute: subscription_awareness, label: Awareness of subscription spending}
  - {id: subsUnused, attribute: unused_subscription_now, label: Pays for an unused subscription}
  - {id: subsAppSpend, attribute: paid_app_spend_band, label: Monthly paid app spend}
  - {id: subsAdTier, attribute: ad_tier_acceptance, label: Ad-supported plan acceptance}

eligibility_helpers:
  serial_cancellers: "us-digital-subscriptions.cancellations_6m == three_or_more"
  recent_cancellers: "us-digital-subscriptions.cancellations_6m in [one, two, three_or_more]"
  trial_charged: "us-digital-subscriptions.free_trial_behavior in [sometimes_charged, often_charged]"
  trial_avoiders: "us-digital-subscriptions.free_trial_behavior == avoids_trials"
  annual_billing_fans: "us-digital-subscriptions.billing_preference == annual_if_discounted"
  monthly_billing: "us-digital-subscriptions.billing_preference == monthly"
  tracker_users: "us-digital-subscriptions.subscription_awareness == uses_tracker"
  unaware_of_spend: "us-digital-subscriptions.subscription_awareness == no_idea"
  unused_subscription: "us-digital-subscriptions.unused_subscription_now == has_unused"
  app_spenders: "us-digital-subscriptions.paid_app_spend_band in [from_15_to_29, from_30_plus]"
  ad_tier_accepters: "us-digital-subscriptions.ad_tier_acceptance == ad_tier_when_cheaper"
  young_cancellers: "age < 35 and us-digital-subscriptions.cancellations_6m in [one, two, three_or_more]"

validation:
  margins:
    - {attribute: cancellations_6m, title: "Subscriptions cancelled in last 6 months (expected from age, tech adoption, household)"}
    - {attribute: free_trial_behavior, title: "Free trial habits (expected from age and tech adoption)"}
    - {attribute: billing_preference, title: "Billing cycle preference (expected from living standard, activity)"}
    - {attribute: subscription_awareness, title: "Awareness of subscription spending (expected from age, education, tech adoption)"}
    - {attribute: unused_subscription_now, title: "Unused subscription (expected from age and awareness of spending)"}
    - {attribute: paid_app_spend_band, title: "Monthly paid app spend (expected from age, living standard, tech adoption)"}
    - {attribute: ad_tier_acceptance, title: "Ad-supported plan acceptance (expected from age, living standard, household)"}
  shares:
    - label: "Cancelled at least one paid subscription in 6 months among online adults (Deloitte, SVOD: about 41%; industry survey)"
      among: online
      share_of: {attr: cancellations_6m, in: [one, two, three_or_more]}
      range: [0.33, 0.47]
    - label: "Three or more cancellations among online adults (Antenna serial churners: 23% of SVOD subscribers over 2 years; industry data)"
      among: online
      share_of: {attr: cancellations_6m, eq: three_or_more}
      range: [0.05, 0.13]
    - label: "Charged after forgetting a free trial among online adults (surveys 48% to 79%, Self Financial 70%; industry surveys; conservative target near 48%)"
      among: online
      share_of: charged_trials
      range: [0.44, 0.70]
    - label: "At least one unused subscription in 30 days among online adults (Self Financial: 59.9% of subscribers; industry survey)"
      among: online
      share_of: {attr: unused_subscription_now, eq: has_unused}
      range: [0.42, 0.62]
    - label: "Takes an ad-supported plan when cheaper (Deloitte 2025: 54% of SVOD subscribers; Antenna: 48% of subscriptions)"
      among: online
      share_of: ad_tier_yes
      range: [0.48, 0.65]

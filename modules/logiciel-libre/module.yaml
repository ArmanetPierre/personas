# Module « Logiciel libre » : connaissance, logiciels libres utilisés (consciemment ou non), attitude, usage pro, contribution et dons.
# S'applique à tout adulte du socle. Réutilise numerique (métier) et equipement-ecosysteme (système d'exploitation) sans les redéfinir.
# Format : docs/modules.md. L'ordre de déclaration est l'ordre de tirage.
id: logiciel-libre
version: "2026.2"
changelog:
  - version: "2026.2"
    date: "2026-10-22"
    changes:
      - "Première version : connaissance du libre, logiciels libres utilisés, attitude, usage professionnel (pros du numérique avec ordinateur), contribution, dons (information de fiche seulement, aucun effet sur le budget)."
      - "Révision : fiche sans préfixes redondants (un seul intitulé par ligne) ; libellé de oss_software_used reformulé en « Logiciels libres utilisés sur ordinateur » (usage conscient ou non), taux inchangés."
label: Logiciel libre et open source
short_label: Libre
description: >-
  Logiciel libre et open source en France : connaissance du sujet, logiciels libres utilisés sur ordinateur, consciemment ou non
  (Android exclu), attitude envers le libre et le propriétaire, usage professionnel et contribution pour les pros du numérique,
  dons à des projets libres. Conditionné au métier du numérique, au système d'exploitation, à l'âge, au sexe, à la PCS et au profil d'adoption technologique.
applies_to: [fr]
requires: [numerique, equipement-ecosysteme]

sources:
  statcounter_browser_fr:
    org: "StatCounter Global Stats"
    title: "Desktop Browser Market Share France"
    year: 2026
    url: "https://gs.statcounter.com/browser-market-share/desktop/france"
    detail: "Navigateurs de bureau, avril 2026 (trafic, pas individus) : Chrome 62,03 %, Edge 13,02 %, Firefox 11,67 % (page non ouverte)"
  statcounter_os_fr:
    org: "StatCounter Global Stats"
    title: "Desktop Operating System Market Share France"
    year: 2026
    url: "https://gs.statcounter.com/os-market-share/desktop/france"
    detail: "OS de bureau, septembre 2026 (trafic web) : Windows 77,26 %, OS X 11,37 %, macOS 6 %, Linux 4,46 %, Chrome OS 0,9 %"
  osm_france_2023:
    org: "CNLL / Numeum / Systematic Paris-Region (Markess by Exaegis)"
    title: "Open Source Monitor France 2023"
    year: 2023
    url: "https://www.it-connect.fr/etude-utilisation-open-source-en-france-2023/"
    detail: "Organisations de plus de 20 salariés : 80 % des entreprises et 90 % des organisations publiques utilisent de l'open source ; environ deux tiers s'y disent ouvertes ; un tiers des entreprises adaptent le code (organisations, pas individus)"
  cnll_osm_2023:
    org: "CNLL"
    title: "Open Source Monitor France 2023"
    year: 2023
    url: "https://cnll.fr/news/open-source-monitor-france-2023/"
    detail: "7 organisations sur 10 ont une politique d'utilisation, de participation ou de développement de l'open source (page non ouverte)"
  github_survey_2017:
    org: "GitHub (via CIO Dive)"
    title: "Just 3% of open source contributors are women, report finds"
    year: 2017
    url: "https://www.ciodive.com/news/just-3-of-open-source-contributors-are-women-report-finds/444174/"
    detail: "Monde : 3 % de femmes parmi les contributeurs (enquête GitHub 2017) ; revue de littérature 2021 : environ 9,8 % ; infrastructure open source : 4,87 % en 2021 (page non ouverte)"
  octoverse_2024:
    org: "GitHub"
    title: "Octoverse 2024"
    year: 2024
    url: "https://github.blog/news-insights/octoverse/octoverse-2024/"
    detail: "France : plus de 2,8 M de comptes développeurs sur GitHub en 2024 (comptes, pas salariés du numérique ; page non ouverte)"

conditions:
  digital: {attr: numerique.is_digital_worker, eq: true}
  dev_like: {attr: numerique.occupation, in: [dev, devops, data]}
  design_job: {attr: numerique.occupation, eq: design}
  linux_os: {attr: equipement-ecosysteme.computer_os, eq: linux}
  has_computer: {attr: socle.has_computer, eq: true}
  digital_with_computer:
    all:
      - {attr: numerique.is_digital_worker, eq: true}
      - {attr: socle.has_computer, eq: true}
  knows: {attr: oss_awareness, eq: sait_ce_que_c_est}
  unaware: {attr: oss_awareness, eq: ne_sait_pas}
  heard: {attr: oss_awareness, eq: en_a_entendu_parler}
  young: {attr: socle.age, lt: 30}
  tech_early: {attr: socle.tech_adoption, in: [innovator, early_adopter]}
  tech_late: {attr: socle.tech_adoption, in: [late_majority, laggard]}
  woman: {attr: socle.sex, eq: F}

tables:
  knows_age:
    label: "Coefficient d'âge de la connaissance du libre"
    bands:
      - {from: 18, to: 29, value: 1.15}
      - {from: 30, to: 49, value: 1.1}
      - {from: 50, to: 64, value: 0.9}
      - {from: 65, to: 79, value: 0.6}
    assumption: true
    justification: "Aucune enquête française auprès des individus trouvée ; connaissance supposée plus élevée chez les jeunes adultes et nettement plus faible après 65 ans."
  knows_pcs:
    label: "Coefficient de PCS de la connaissance du libre"
    values: {"1": 0.7, "2": 1.0, "3": 1.5, "4": 1.1, "5": 0.8, "6": 0.7, "none": 0.8}
    assumption: true
    justification: "Hypothèse : les cadres et professions intermédiaires connaissent davantage le libre ; ordre de grandeur de 35-45 % de la population qui sait ce que c'est."
  knows_tech:
    label: "Coefficient d'adoption technologique de la connaissance du libre"
    values: {innovator: 1.6, early_adopter: 1.4, early_majority: 1.0, late_majority: 0.75, laggard: 0.5}
    assumption: true
    justification: "Hypothèse : la connaissance du libre croît avec le profil d'adoption technologique."
  contrib_age:
    label: "Coefficient d'âge de la contribution à l'open source"
    bands:
      - {from: 18, to: 24, value: 0.8}
      - {from: 25, to: 44, value: 1.2}
      - {from: 45, to: 54, value: 0.9}
      - {from: 55, to: 79, value: 0.6}
    assumption: true
    justification: "Hypothèse : les contributeurs se concentrent entre 25 et 44 ans ; aucune source française par âge."

attributes:
  - key: oss_awareness
    label: Connaissance du logiciel libre / open source
    type: enum
    values:
      - {code: ne_sait_pas, label: "ne sait pas ce qu'est le logiciel libre"}
      - {code: en_a_entendu_parler, label: "a entendu parler du logiciel libre sans bien savoir ce que c'est"}
      - {code: sait_ce_que_c_est, label: "sait ce qu'est le logiciel libre"}
    distribution:
      sampler: quasi
      weights:
        ne_sait_pas:
          cases:
            - {when: digital, value: 0.02}
            - {when: linux_os, value: 0.01}
            - else: {div: [0.38, {mul: [{lookup: knows_age, by: socle.age}, {lookup: knows_pcs, by: socle.pcs}, {lookup: knows_tech, by: socle.tech_adoption}]}]}
        en_a_entendu_parler:
          cases:
            - {when: digital, value: 0.03}
            - {when: linux_os, value: 0.02}
            - else: 0.27
        sait_ce_que_c_est:
          cases:
            - {when: digital, value: 0.95}
            - {when: linux_os, value: 0.97}
            - else: {mul: [0.35, {lookup: knows_age, by: socle.age}, {lookup: knows_pcs, by: socle.pcs}, {lookup: knows_tech, by: socle.tech_adoption}]}
    sources: [osm_france_2023]
    assumption: true
    justification: "Aucune enquête française sur la notoriété du libre chez les individus (l'Open Source Monitor porte sur des organisations de plus de 20 salariés). Hypothèse : environ 35-45 % de la population sait ce que c'est, presque tous les pros du numérique et les utilisateurs de Linux, plus de cadres et d'early adopters, moins de plus de 65 ans et de laggards."

  - key: oss_software_used
    label: Logiciels libres utilisés sur ordinateur
    type: set
    when: has_computer
    items:
      - {code: firefox, label: Firefox, card_label: Firefox, rate: {base: 0.11, factors: {knows: 1.6, unaware: 0.5, linux_os: 2.5, digital: 1.5, tech_early: 1.4, tech_late: 0.6}}}
      - {code: libreoffice, label: LibreOffice, card_label: LibreOffice, rate: {base: 0.15, factors: {knows: 1.6, unaware: 0.4, linux_os: 3, digital: 1.3, tech_late: 0.7}}}
      - {code: vlc, label: VLC, card_label: VLC, rate: {base: 0.26, factors: {knows: 1.4, unaware: 0.6, linux_os: 1.6, young: 1.3, tech_late: 0.7}}}
      - {code: thunderbird, label: Thunderbird, card_label: Thunderbird, rate: {base: 0.05, factors: {knows: 1.8, unaware: 0.3, linux_os: 3, digital: 1.5, tech_late: 0.6}}}
      - {code: gimp_inkscape, label: GIMP / Inkscape, card_label: "GIMP ou Inkscape", rate: {base: 0.05, factors: {knows: 1.8, unaware: 0.3, linux_os: 2.5, design_job: 2, young: 1.3}}}
      - code: linux
        label: Linux
        card_label: Linux
        rate:
          cases:
            - {when: linux_os, value: 1}
            - {when: dev_like, value: 0.04}
            - {when: digital, value: 0.015}
            - else: 0.002
      - code: outils_dev_libres
        label: Outils de développement libres
        card_label: "outils de développement libres (Git, éditeurs, langages)"
        rate:
          cases:
            - {when: dev_like, value: 0.85}
            - {when: digital, value: 0.2}
            - else: 0.01
    rate_cap: 0.95
    display: {empty: "aucun logiciel libre identifié sur ordinateur"}
    sources: [statcounter_browser_fr, statcounter_os_fr]
    assumption: true
    justification: "Firefox (11,67 % des navigateurs de bureau, trafic) et Linux (4,46 % des OS de bureau) calés sur StatCounter, Linux dérivé de equipement-ecosysteme.computer_os plus un petit complément de double amorçage. VLC, LibreOffice, Thunderbird, GIMP/Inkscape : aucune source trouvée, hypothèses. Android ne compte pas ; attribut absent sans ordinateur. Le set mesure l'usage, conscient ou non : il est aussi tiré chez les personas qui ne savent pas ce qu'est le logiciel libre (taux réduits par un facteur 0,3 à 0,6). L'usage conscient se lit en croisant avec oss_awareness et oss_attitude (helper utilisateur_conscient_libre)."

  - key: oss_attitude
    label: Attitude envers le libre et le propriétaire
    type: enum
    values:
      - {code: indifferent, label: "indifférent au caractère libre ou propriétaire d'un logiciel"}
      - {code: prefere_le_libre, label: "préfère un logiciel libre quand il en existe un"}
      - {code: militant, label: "convaincu de l'intérêt du libre, y compris par principe"}
      - {code: mefiant, label: "méfiant envers les logiciels libres"}
    distribution:
      sampler: quasi
      weights:
        indifferent:
          cases:
            - {when: linux_os, value: 0.12}
            - {when: {all: [digital, dev_like]}, value: 0.35}
            - {when: digital, value: 0.5}
            - {when: unaware, value: 0.85}
            - {when: heard, value: 0.72}
            - else: 0.52
        prefere_le_libre:
          cases:
            - {when: linux_os, value: 0.45}
            - {when: {all: [digital, dev_like]}, value: 0.45}
            - {when: digital, value: 0.33}
            - {when: unaware, value: 0.05}
            - {when: heard, value: 0.12}
            - else: 0.3
        militant:
          cases:
            - {when: linux_os, value: 0.38}
            - {when: {all: [digital, dev_like]}, value: 0.12}
            - {when: digital, value: 0.08}
            - {when: unaware, value: 0.002}
            - {when: heard, value: 0.01}
            - else: 0.08
        mefiant:
          cases:
            - {when: linux_os, value: 0.05}
            - {when: digital, value: 0.08}
            - else: {mul: [{if: unaware, then: 0.1, else: {if: heard, then: 0.15, else: 0.1}}, {if: tech_late, then: 1.6, else: 1}]}
    sources: [osm_france_2023]
    assumption: true
    justification: "Hypothèse : environ 70 % d'indifférents, 18 % qui préfèrent le libre, 4 % de convaincus et 8 % de méfiants dans la population générale ; convaincus et préférence pour le libre dominent chez les utilisateurs de Linux et les développeurs ; méfiance plus fréquente chez les late_majority et laggards. Les deux tiers d'organisations ouvertes à l'open source (CNLL 2023) ne se transposent pas aux individus."

  - key: oss_work_usage
    label: Usage professionnel principal de l'open source
    type: enum
    when: digital_with_computer
    values:
      - {code: aucun, label: "n'utilise pas l'open source dans son travail"}
      - {code: bibliotheques_dependances, label: "bibliothèques et dépendances open source dans son travail"}
      - {code: outils_dev, label: "outils de développement open source dans son travail"}
      - {code: systemes_serveurs_linux, label: "systèmes et serveurs Linux dans son travail"}
    distribution:
      given: numerique.occupation
      table:
        dev: {aucun: 0.03, bibliotheques_dependances: 0.62, outils_dev: 0.25, systemes_serveurs_linux: 0.1}
        devops: {aucun: 0.05, bibliotheques_dependances: 0.15, outils_dev: 0.2, systemes_serveurs_linux: 0.6}
        data: {aucun: 0.08, bibliotheques_dependances: 0.75, outils_dev: 0.12, systemes_serveurs_linux: 0.05}
        product: {aucun: 0.55, bibliotheques_dependances: 0.25, outils_dev: 0.1, systemes_serveurs_linux: 0.1}
        design: {aucun: 0.8, bibliotheques_dependances: 0.05, outils_dev: 0.1, systemes_serveurs_linux: 0.05}
        marketing: {aucun: 0.85, bibliotheques_dependances: 0.07, outils_dev: 0.03, systemes_serveurs_linux: 0.05}
        consulting: {aucun: 0.35, bibliotheques_dependances: 0.2, outils_dev: 0.15, systemes_serveurs_linux: 0.3}
        sales: {aucun: 0.85, bibliotheques_dependances: 0.04, outils_dev: 0.04, systemes_serveurs_linux: 0.07}
        support: {aucun: 0.4, bibliotheques_dependances: 0.1, outils_dev: 0.15, systemes_serveurs_linux: 0.35}
        leadership: {aucun: 0.45, bibliotheques_dependances: 0.2, outils_dev: 0.1, systemes_serveurs_linux: 0.25}
        default: {aucun: 0.5, bibliotheques_dependances: 0.2, outils_dev: 0.15, systemes_serveurs_linux: 0.15}
    sources: [osm_france_2023, cnll_osm_2023]
    assumption: true
    justification: "80 % des entreprises et 90 % des organisations publiques de plus de 20 salariés utilisent de l'open source (CNLL 2023, organisations). Ventilation par métier : hypothèse (développeurs et data presque tous utilisateurs, devops surtout sur serveurs Linux, design, vente et marketing majoritairement sans usage identifié). Un seul usage principal est retenu. Attribut absent chez les personas sans ordinateur (usage lié à un poste informatique)."

  - key: contribution_propensity
    label: Propension à contribuer (coefficient interne)
    type: number
    when: digital
    value:
      mul:
        - {if: woman, then: 0.3, else: 1}
        - {lookup: contrib_age, by: socle.age}
        - {if: linux_os, then: 1.6, else: 1}
    sources: [github_survey_2017]
    assumption: true
    justification: "Coefficient de calcul, non affiché. Les femmes pèsent 3 à 10 % des contributeurs OSS (GitHub 2017 : 3 % ; revue 2021 : environ 9,8 % ; mondial), alors qu'elles font 24 % des pros du numérique : coefficient 0,3 calé pour retrouver environ 8 %. Âge et Linux : hypothèses."

  - key: oss_contribution
    label: Contribution à des projets open source (niveau le plus engagé)
    type: enum
    when: digital
    values:
      - {code: aucune, label: "n'a jamais contribué à un projet open source"}
      - {code: signalements_bugs, label: "a signalé des bugs à des projets open source"}
      - {code: documentation_traduction, label: "a contribué à de la documentation ou des traductions de projets open source"}
      - {code: code, label: "contribue du code à des projets open source"}
      - {code: maintenance, label: "maintient un projet open source"}
    distribution:
      sampler: quasi
      weights:
        aucune: 1
        signalements_bugs: {mul: [{pick: numerique.occupation, values: {dev: 0.23, devops: 0.18, data: 0.12}, default: 0.06}, {attr: contribution_propensity}]}
        documentation_traduction: {mul: [{pick: numerique.occupation, values: {dev: 0.08, devops: 0.06, data: 0.05}, default: 0.05}, {attr: contribution_propensity}]}
        code: {mul: [{pick: numerique.occupation, values: {dev: 0.28, devops: 0.2, data: 0.12}, default: 0.03}, {attr: contribution_propensity}]}
        maintenance: {mul: [{pick: numerique.occupation, values: {dev: 0.07, devops: 0.05, data: 0.02}, default: 0.005}, {attr: contribution_propensity}]}
    sources: [github_survey_2017, octoverse_2024]
    assumption: true
    justification: "Aucune part de contributeurs sourcée pour la France (plus de 2,8 M de comptes développeurs GitHub, Octoverse 2024, ne donne pas de taux). Hypothèse : 35-45 % des développeurs ont contribué au moins une fois, 8-12 % au code de façon régulière, 2-4 % maintiennent un projet ; 10-15 % des autres métiers. Part de femmes calée sur 3-10 % (sources mondiales)."

  - key: oss_donations
    label: Dons ou soutien financier à des projets libres
    type: enum
    values:
      - {code: jamais, label: "n'a jamais soutenu financièrement de projet libre"}
      - {code: ponctuellement, label: "a déjà fait un don ponctuel à un projet libre (Wikipédia, Framasoft, Mozilla, Debian…)"}
      - {code: regulierement, label: "soutient régulièrement des projets libres (Wikipédia, Framasoft, Mozilla, Debian…)"}
    distribution:
      sampler: quasi
      weights:
        jamais:
          cases:
            - {when: {attr: oss_attitude, eq: militant}, value: 0.45}
            - {when: {attr: oss_attitude, eq: prefere_le_libre}, value: 0.75}
            - else: 0.9
        ponctuellement:
          mul:
            - cases:
                - {when: {attr: oss_attitude, eq: militant}, value: 0.38}
                - {when: {attr: oss_attitude, eq: prefere_le_libre}, value: 0.21}
                - else: 0.09
            - cases:
                - {when: {attr: socle.living_standard_ratio, gt: 1.3}, value: 1.4}
                - {when: {attr: socle.living_standard_ratio, lt: 0.7}, value: 0.6}
                - else: 1
            - {if: linux_os, then: 1.5, else: 1}
        regulierement:
          mul:
            - cases:
                - {when: {attr: oss_attitude, eq: militant}, value: 0.17}
                - {when: {attr: oss_attitude, eq: prefere_le_libre}, value: 0.04}
                - else: 0.01
            - cases:
                - {when: {attr: socle.living_standard_ratio, gt: 1.3}, value: 1.4}
                - {when: {attr: socle.living_standard_ratio, lt: 0.7}, value: 0.6}
                - else: 1
            - {if: linux_os, then: 1.6, else: 1}
    assumption: true
    justification: "Aucun chiffre français trouvé sur les dons à Wikipédia, Framasoft, Mozilla ou Debian. Hypothèse : environ 85-90 % de « jamais », 8-12 % de dons ponctuels, 2-3 % de soutien régulier, en hausse chez les convaincus, les utilisateurs de Linux et les niveaux de vie élevés. Aucune dépense n'est modélisée dans le budget."

card:
  - when: {attr: oss_awareness, present: true}
    template: "Logiciel libre : {oss_awareness} ; {oss_attitude}"
  - when: has_computer
    template: "Logiciels libres : {oss_software_used}"
  - when: digital_with_computer
    template: "Open source au travail : {oss_work_usage}"
  - when: digital
    template: "Contribution à l'open source : {oss_contribution}"
  - when: {attr: oss_donations, present: true}
    template: "Dons : {oss_donations}"

segments:
  - {id: libreAwareness, attribute: oss_awareness, label: Connaissance du logiciel libre, compare: 4}
  - {id: libreAttitude, attribute: oss_attitude, label: Attitude envers le libre}
  - {id: libreContribution, attribute: oss_contribution, label: Contribution à l'open source}
  - {id: libreWorkUsage, attribute: oss_work_usage, label: Usage pro de l'open source}
  - {id: libreDonations, attribute: oss_donations, label: Soutien financier au libre}

eligibility_helpers:
  utilisateur_conscient_libre: "logiciel-libre.oss_awareness == sait_ce_que_c_est and logiciel-libre.oss_attitude in [prefere_le_libre, militant]"
  militant_libre: "logiciel-libre.oss_attitude == militant"
  linux_user: "equipement-ecosysteme.computer_os == linux"
  contributeur_open_source: "logiciel-libre.oss_contribution in [signalements_bugs, documentation_traduction, code, maintenance]"
  contributeur_code: "logiciel-libre.oss_contribution in [code, maintenance]"
  dev_open_source_travail: "numerique.is_digital_worker and has_computer and numerique.occupation in [dev, devops, data] and logiciel-libre.oss_work_usage != aucun"
  donateur_libre: "logiciel-libre.oss_donations in [ponctuellement, regulierement]"
  mefiant_libre: "logiciel-libre.oss_attitude == mefiant"
  ignore_le_libre: "logiciel-libre.oss_awareness == ne_sait_pas"

validation:
  margins:
    - {attribute: oss_awareness, title: "Connaissance du logiciel libre (attendu selon le profil)"}
    - {attribute: oss_attitude, title: "Attitude envers le libre (attendu selon le profil)"}
    - {attribute: oss_work_usage, title: "Usage pro de l'open source (attendu selon le métier)"}
    - {attribute: oss_contribution, title: "Contribution à l'open source (attendu selon le métier, le sexe et l'âge)"}
    - {attribute: oss_donations, title: "Dons à des projets libres (attendu selon l'attitude)"}
  shares:
    - label: "Firefox parmi les personnes avec ordinateur (StatCounter : 11,7 % du trafic bureau ; utilisateurs ponctuels plus nombreux)"
      among: has_computer
      share_of: {attr: oss_software_used, in: [firefox]}
      range: [0.10, 0.20]
    - label: "Linux parmi les personnes avec ordinateur (StatCounter : 4,5 % des OS de bureau)"
      among: has_computer
      share_of: {attr: oss_software_used, in: [linux]}
      range: [0.03, 0.08]
    - label: "Pros du numérique qui savent ce qu'est le libre (hypothèse : presque tous)"
      among: digital
      share_of: knows
      range: [0.90, 1.0]
    - label: "Développeurs ayant déjà contribué à l'open source (hypothèse : 35-45 %)"
      among: {all: [digital, {attr: numerique.occupation, eq: dev}]}
      share_of: {attr: oss_contribution, in: [signalements_bugs, documentation_traduction, code, maintenance]}
      range: [0.30, 0.50]
    - label: "Développeurs qui maintiennent un projet (hypothèse : 2-4 %)"
      among: {all: [digital, {attr: numerique.occupation, eq: dev}]}
      share_of: {attr: oss_contribution, eq: maintenance}
      range: [0.015, 0.06]
    - label: "Femmes parmi les contributeurs open source (sources mondiales : 3 à 10 %)"
      among: {all: [digital, {attr: oss_contribution, in: [signalements_bugs, documentation_traduction, code, maintenance]}]}
      share_of: woman
      range: [0.04, 0.13]
    - label: "Donateurs (ponctuels ou réguliers) parmi les adultes (hypothèse : 10-15 %)"
      among: {attr: socle.age, gt: 17}
      share_of: {attr: oss_donations, in: [ponctuellement, regulierement]}
      range: [0.08, 0.18]

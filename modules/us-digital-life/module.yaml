# Module "US digital life": everyday smartphone, social, AI chatbot and online shopping habits of US adults.
# Generic (not tied to a product): meant to be reused as a target filter by any app or SaaS project.
# Format: docs/modules.md. Declaration order is draw order. No socle_overrides, no affects_budget.
id: us-digital-life
version: "2026.2"
changelog:
  - version: "2026.2"
    date: "2026-10-22"
    changes:
      - "First version: phone screen time, social and messaging platforms, consumer AI chatbots (frequency, which ones, main use), online shopping (frequency, sites), need for help with new apps and devices."
      - "Draft revision (version unchanged, never accepted): platform rates recalibrated on the Pew 2026 social media fact sheet by age (shares of all adults converted to rates among social media users); chatbot rates recalibrated on Pew Americans and AI 2026 (ever-use shares); main use of chatbots anchored on Pew June 2025 (28% of employed adults used ChatGPT for work)."
label: Everyday digital life
short_label: Digital life
description: >-
  Everyday digital habits of US adults: daily smartphone screen time, social and messaging platforms used,
  consumer AI chatbot use (frequency, which chatbots, main use: work, school or personal), non-grocery online
  shopping (frequency and main sites) and need for help with new apps and devices. Conditioned on age,
  education, income, activity, occupation group, urbanicity, region, device and internet access, tech adoption
  profile and social media level from the socle. Generic: it never changes income or budget.
applies_to: [us]
requires: []

sources:
  pew_social_2026:
    org: "Pew Research Center"
    title: "Americans' Social Media Use in 2026 (fact sheet)"
    year: 2026
    url: "https://www.pewresearch.org/internet/fact-sheet/social-media/"
    detail: "Verified. Survey Jan 30-Jun 18 2026, n=5,511, US adults. Share using each platform, ages 18-29 / 30-49 / 50-64 / 65+: YouTube 95/91/85/65, Facebook 69/78/71/59, Instagram 79/64/41/21, TikTok 65/45/31/11, WhatsApp 37/39/36/20, Reddit 40/35/18/6, Snapchat 56/33/13/4, X 31/20/17/7, LinkedIn 41/37/32/13. LinkedIn: 51% of college graduates vs 13% with a high school education, 45% of households $100K+ vs 18% under $30K. Pinterest not retained."
  pew_internet_2026:
    org: "Pew Research Center"
    title: "Internet use, smartphone ownership, digital divides in the US: What we know"
    year: 2026
    url: "https://www.pewresearch.org/short-reads/2026/01/08/internet-use-smartphone-ownership-digital-divides-in-u-s/"
    detail: "2025 survey. Online almost constantly: 41% overall; 63% (18-29), 54% (30-49), 33% (50-64), 14% (65+); 34% (<$30K) to 50% ($100K+). Smartphone-only internet 16% overall, 34% under $30K; home broadband 54% (<$30K) vs 94% ($100K+)."
  pew_phone_2026:
    org: "Pew Research Center"
    title: "About half of Americans say they spend too much time on their smartphone"
    year: 2026
    url: "https://www.pewresearch.org/short-reads/2026/09/01/about-half-of-americans-say-they-spend-too-much-time-on-their-smartphone/"
    detail: "May-June 2026, n=9,750. About 1 in 4 adults use their smartphone almost constantly: 42% of under-30s vs 9% of 65+. 53% say they spend too much time on it (70% of under-30s, 25% of 65+)."
  pew_chatgpt_2025:
    org: "Pew Research Center"
    title: "34% of US adults have used ChatGPT, about double the share in 2023"
    year: 2025
    url: "https://www.pewresearch.org/short-reads/2025/06/25/34-of-us-adults-have-used-chatgpt-about-double-the-share-in-2023/"
    detail: "Verified. Feb-Mar 2025. Ever used ChatGPT: 34% overall; 58% under 30, 10% ages 65+; 18% high school or less, 52% postgraduate. 28% of employed adults have used ChatGPT for work."
  pew_ai_2026:
    org: "Pew Research Center"
    title: "Americans and AI 2026 (appendix: detailed charts and tables)"
    year: 2026
    url: "https://www.pewresearch.org/internet/2026/06/17/americans-and-ai-appendix-detailed-chart-and-tables/markdown"
    detail: "Verified. Feb 17-23 2026. 49% use AI chatbots, about 25% daily. Ever use, % of all adults: ChatGPT 44% (18-29: 61, 30-49: 55, 50-64: 37, 65+: 19), Gemini 24%, Copilot 17%, Meta AI 14%, Grok 8%, Claude 6%."
  pew_shopping_2022:
    org: "Pew Research Center"
    title: "For shopping, Americans turn to mobile phones while influencers become a factor"
    year: 2022
    url: "https://www.pewresearch.org/short-reads/2022/11/21/for-shopping-phones-are-common-and-influencers-have-become-a-factor-especially-for-young-adults/"
    detail: "2022 (search snippet, not opened). 32% buy things with a smartphone at least weekly; 21% on a desktop or laptop; 7% on a tablet."
  omnisend_2024:
    org: "Omnisend (commercial survey, reported by Fashion Dive)"
    title: "US consumers don't trust Temu, but still shop there"
    year: 2024
    url: "https://www.fashiondive.com/news/consumer-trust-amazon-temu/718849/"
    detail: "April 2024, commercial survey, not verified: 68% have shopped on Temu; 20% shop weekly on a Chinese marketplace."

conditions:
  age_u30: {attr: socle.age, lt: 30}
  age_30_49: {all: [{attr: socle.age, gt: 29}, {attr: socle.age, lt: 50}]}
  age_50_64: {all: [{attr: socle.age, gt: 49}, {attr: socle.age, lt: 65}]}
  age_65p: {attr: socle.age, gt: 64}
  female: {attr: socle.sex, eq: F}
  college_grad: {attr: socle.education, in: [bachelor, graduate]}
  hs_or_less: {attr: socle.education, in: [below_hs, high_school]}
  income_low: {attr: socle.living_standard_ratio, lt: 0.6}
  income_high: {attr: socle.living_standard_ratio, gt: 1.5}
  not_working: {attr: socle.activity_status, in: [retired, inactive]}
  employed: {attr: socle.activity_status, eq: employed}
  student: {attr: socle.activity_status, eq: student}
  rural: {attr: socle.urbanicity, eq: rural}
  south: {attr: socle.region, eq: S}
  has_kids: {attr: socle.children_under_12, gt: 0}
  social_user: {attr: socle.social_media, in: [occasional, daily, heavy]}
  social_occasional: {attr: socle.social_media, eq: occasional}
  social_heavy: {attr: socle.social_media, eq: heavy}
  early_tech: {attr: socle.tech_adoption, in: [innovator, early_adopter]}
  cs_occupation: {attr: socle.pcs, eq: computer_engineering_science}
  student_or_cs: {any: [{attr: socle.activity_status, eq: student}, {attr: socle.pcs, eq: computer_engineering_science}]}
  has_phone: {attr: socle.has_smartphone, eq: true}
  ai_user: {attr: chatbot_use, in: [rarely, monthly, weekly, daily]}
  daily_ai: {attr: chatbot_use, eq: daily}
  shopper: {attr: online_shopping_frequency, in: [monthly, few_per_month, weekly, several_per_week]}
  frequent_shopper: {attr: online_shopping_frequency, in: [weekly, several_per_week]}

tables:
  screen_age_high:
    label: "Age coefficient for 4+ hours of daily phone screen time"
    bands:
      - {from: 18, to: 29, value: 1.3}
      - {from: 30, to: 49, value: 1.05}
      - {from: 50, to: 64, value: 0.8}
      - {from: 65, to: 79, value: 0.55}
    sources: [pew_phone_2026, pew_internet_2026]
    assumption: true
    justification: "Pew documents the age gradient of almost-constant use (42% of under-30s vs 9% of 65+ on a smartphone; 63% to 14% online) but publishes no hours distribution. Coefficients are a damped version of that gradient."
  screen_age_low:
    label: "Age coefficient for under 2 hours of daily phone screen time"
    bands:
      - {from: 18, to: 29, value: 0.7}
      - {from: 30, to: 49, value: 0.95}
      - {from: 50, to: 64, value: 1.1}
      - {from: 65, to: 79, value: 1.5}
    sources: [pew_phone_2026]
    assumption: true
    justification: "Mirror of the heavy-use gradient: older adults are more often light users."
  ai_use_age:
    label: "Probability of using an AI chatbot at least rarely, by age"
    bands:
      - {from: 18, to: 29, value: 0.66}
      - {from: 30, to: 49, value: 0.60}
      - {from: 50, to: 64, value: 0.42}
      - {from: 65, to: 79, value: 0.23}
    sources: [pew_ai_2026]
    assumption: true
    justification: "Pew (2026) gives 49% of adults using chatbots (so about 51% never) and ChatGPT ever-use of 61/55/37/19% by age; the age-band values scale that gradient so the population-weighted mean is about 49%. Exact by-age shares of any-chatbot users were not published in what was read."
  ai_edu_factor:
    label: "Education coefficient for AI chatbot use"
    values: {below_hs: 0.55, high_school: 0.65, some_college: 0.95, associate: 0.95, bachelor: 1.35, graduate: 1.45}
    sources: [pew_chatgpt_2025]
    assumption: true
    justification: "2025 ChatGPT ever-use: 18% high school or less, 33% some college, 51% bachelor's, 52% postgraduate (34% overall), damped because part of the gap comes from age and the 2026 level is higher."
  ai_tech_factor:
    label: "Tech adoption coefficient for AI chatbot use"
    values: {innovator: 1.6, early_adopter: 1.4, early_majority: 1.1, late_majority: 0.85, laggard: 0.5}
    assumption: true
    justification: "No published split by Rogers profile; ordered coefficients with a population-weighted mean close to 1."
  shop_age_factor:
    label: "Age coefficient for frequent online shopping (non-grocery)"
    bands:
      - {from: 18, to: 29, value: 1.2}
      - {from: 30, to: 49, value: 1.2}
      - {from: 50, to: 64, value: 0.95}
      - {from: 65, to: 79, value: 0.6}
    sources: [pew_shopping_2022]
    assumption: true
    justification: "Pew reports overall weekly mobile buying (32%) but the fetched text has no age split; the gradient follows the general age gradient of smartphone and internet use."
  help_f_age:
    label: "Probability of needing frequent help with new apps and devices, by age"
    bands:
      - {from: 18, to: 29, value: 0.02}
      - {from: 30, to: 49, value: 0.04}
      - {from: 50, to: 64, value: 0.12}
      - {from: 65, to: 79, value: 0.30}
    sources: [pew_internet_2026]
    assumption: true
    justification: "No published figure on help needed. Built from the documented age gaps (smartphone ownership 78% at 65+ vs 97% under 50, 14% of 65+ online almost constantly)."
  help_o_age:
    label: "Probability of needing occasional help with new apps and devices, by age"
    bands:
      - {from: 18, to: 29, value: 0.10}
      - {from: 30, to: 49, value: 0.18}
      - {from: 50, to: 64, value: 0.32}
      - {from: 65, to: 79, value: 0.40}
    sources: [pew_internet_2026]
    assumption: true
    justification: "Same logic as frequent help; deliberately pessimistic for adults 50+."
  help_edu_f:
    label: "Education coefficient for frequent need of help"
    values: {below_hs: 1.7, high_school: 1.35, some_college: 1.0, associate: 0.9, bachelor: 0.6, graduate: 0.5}
    sources: [pew_internet_2026]
    assumption: true
    justification: "Digital divide by education and income documented by Pew; magnitude assumed."
  help_edu_o:
    label: "Education coefficient for occasional need of help"
    values: {below_hs: 1.3, high_school: 1.15, some_college: 1.0, associate: 0.95, bachelor: 0.8, graduate: 0.75}
    assumption: true
    justification: "Milder version of the frequent-help gradient."
  help_tech_f:
    label: "Tech adoption coefficient for frequent need of help"
    values: {innovator: 0.15, early_adopter: 0.3, early_majority: 0.65, late_majority: 1.2, laggard: 1.9}
    assumption: true
    justification: "Ordered by Rogers profile; population-weighted mean close to 1."
  help_tech_o:
    label: "Tech adoption coefficient for occasional need of help"
    values: {innovator: 0.4, early_adopter: 0.6, early_majority: 0.9, late_majority: 1.25, laggard: 1.5}
    assumption: true
    justification: "Milder version of the frequent-help gradient."

attributes:
  - key: phone_screen_time
    label: Daily smartphone screen time
    type: enum
    when: has_phone
    values:
      - {code: under_1h, label: "Under 1 hour"}
      - {code: one_to_two_h, label: "1 to 2 hours"}
      - {code: two_to_four_h, label: "2 to 4 hours"}
      - {code: four_to_six_h, label: "4 to 6 hours"}
      - {code: over_six_h, label: "Over 6 hours"}
    distribution:
      weights:
        under_1h: {mul: [{pick: socle.social_media, values: {none: 40, occasional: 20, daily: 6, heavy: 2}, default: 6}, {lookup: screen_age_low, by: socle.age}]}
        one_to_two_h: {mul: [{pick: socle.social_media, values: {none: 35, occasional: 35, daily: 20, heavy: 8}, default: 20}, {lookup: screen_age_low, by: socle.age}]}
        two_to_four_h: {pick: socle.social_media, values: {none: 20, occasional: 32, daily: 40, heavy: 30}, default: 30}
        four_to_six_h: {mul: [{pick: socle.social_media, values: {none: 4, occasional: 10, daily: 25, heavy: 38}, default: 20}, {lookup: screen_age_high, by: socle.age}]}
        over_six_h: {mul: [{pick: socle.social_media, values: {none: 1, occasional: 3, daily: 9, heavy: 22}, default: 8}, {lookup: screen_age_high, by: socle.age}]}
    display: {empty: "No smartphone"}
    sources: [pew_phone_2026, pew_internet_2026]
    assumption: true
    justification: "Pew gives age gradients of almost-constant use and the share saying they spend too much time on the phone, but no hours distribution. Bands follow the socle social media level (heavy users skew to 4+ hours) and the age gradient."

  - key: platforms_used
    label: Social and messaging platforms used
    type: set
    when: social_user
    items:
      # Rates are conditional on being a social media user (socle.social_media != none): Pew share of all adults by age
      # divided by an assumed share of social media users (about 95% / 90% / 82% / 65% at 18-29 / 30-49 / 50-64 / 65+).
      # The base rate is the 30-49 conditional rate; age factors give the other bands.
      - {code: youtube, label: YouTube, rate: {base: 0.97, factors: {age_65p: 0.92, social_occasional: 0.9}}}
      - {code: facebook, label: Facebook, rate: {base: 0.83, factors: {age_u30: 0.88, age_65p: 1.1, female: 1.1, social_occasional: 0.9, social_heavy: 1.05}}}
      - {code: instagram, label: Instagram, rate: {base: 0.66, factors: {age_u30: 1.17, age_50_64: 0.7, age_65p: 0.45, female: 1.15, social_occasional: 0.6, social_heavy: 1.3}}}
      - {code: tiktok, label: TikTok, rate: {base: 0.47, factors: {age_u30: 1.36, age_50_64: 0.76, age_65p: 0.34, female: 1.15, social_occasional: 0.5, social_heavy: 1.4}}}
      - {code: snapchat, label: Snapchat, rate: {base: 0.34, factors: {age_u30: 1.6, age_50_64: 0.43, age_65p: 0.16, female: 1.2, social_occasional: 0.5, social_heavy: 1.5}}}
      - {code: x, label: X, rate: {base: 0.24, factors: {age_u30: 1.5, age_50_64: 0.95, age_65p: 0.5, female: 0.75, college_grad: 1.2, social_occasional: 0.6, social_heavy: 1.5}}}
      - {code: reddit, label: Reddit, rate: {base: 0.49, factors: {age_u30: 1.08, age_50_64: 0.56, age_65p: 0.23, female: 0.6, college_grad: 1.25, hs_or_less: 0.75, social_occasional: 0.6, social_heavy: 1.5}}}
      - {code: whatsapp, label: WhatsApp, rate: {base: 0.43, factors: {age_u30: 0.9, age_50_64: 1.02, age_65p: 0.72, social_occasional: 0.8, social_heavy: 1.2}}}
      - {code: linkedin, label: LinkedIn, rate: {base: 0.33, factors: {age_u30: 1.1, age_50_64: 0.95, age_65p: 0.55, college_grad: 1.8, hs_or_less: 0.55, income_high: 1.35, income_low: 0.8, not_working: 0.7, social_occasional: 0.6}}}
      - {code: pinterest, label: Pinterest, rate: {base: 0.22, factors: {age_u30: 1.1, age_30_49: 1.1, age_65p: 0.8, female: 1.9, social_occasional: 0.7}}}
    rate_cap: 0.97
    min_items: 1
    display: {template: "{value}", empty: "None"}
    sources: [pew_social_2026]
    assumption: true
    justification: "Base rates and age gradients come from the verified Pew 2026 fact sheet (share of all adults by age 18-29 / 30-49 / 50-64 / 65+), converted to rates among social media users because the set is only drawn when the socle social media level is not none; that conversion rests on an assumed share of social media users by age (95% / 90% / 82% / 65%), so the attribute stays an assumption. Sex, education, income and social media level gradients (and the LinkedIn education/income gaps, 51% vs 13% and 45% vs 18%) are damped assumptions, with factors chosen so their mean stays close to 1. Pinterest is not in the Pew figures retained here: pure assumption. Set empty when the socle social media level is none."

  - key: chatbot_use
    label: Use of consumer AI chatbots
    type: enum
    values:
      - {code: never, label: "Never"}
      - {code: rarely, label: "Rarely"}
      - {code: monthly, label: "A few times a month"}
      - {code: weekly, label: "Weekly"}
      - {code: daily, label: "Daily"}
    distribution:
      weights:
        never:
          add:
            - 1
            - mul:
                - -1
                - &ai_p
                  min:
                    - 0.95
                    - mul:
                        - {lookup: ai_use_age, by: socle.age}
                        - {lookup: ai_edu_factor, by: socle.education}
                        - {lookup: ai_tech_factor, by: socle.tech_adoption}
                        - {if: student, then: 1.2, else: 1}
                        - {if: {all: [{attr: socle.has_smartphone, eq: false}, {attr: socle.has_computer, eq: false}]}, then: 0.35, else: 1}
        rarely: {mul: [*ai_p, 0.16]}
        monthly: {mul: [*ai_p, 0.17]}
        weekly: {mul: [*ai_p, 0.27]}
        daily: {mul: [*ai_p, 0.40, {if: student_or_cs, then: 1.25, else: 1}]}
    sources: [pew_ai_2026, pew_chatgpt_2025]
    assumption: true
    justification: "Pew Americans and AI 2026 (verified): 49% of adults use AI chatbots (so about 51% never), about 25% daily; ChatGPT ever-use 44% overall and 61/55/37/19% by age. Age gradient scaled from Pew; education gradient from the 2025 ChatGPT question, damped. The split among rarely, monthly, weekly and daily is an assumption and kept below the 25% daily figure to stay conservative. Students and computer occupations skew daily."

  - key: chatbots_used
    label: AI chatbots used
    type: set
    when: ai_user
    items:
      - {code: chatgpt, label: ChatGPT, rate: {base: 0.89, factors: {age_50_64: 0.97, age_65p: 0.88, daily_ai: 1.08}}}
      - {code: gemini, label: Gemini, rate: {base: 0.47, factors: {age_30_49: 1.15, age_50_64: 0.85, age_65p: 0.7, early_tech: 1.2}}}
      - {code: copilot, label: Microsoft Copilot, rate: {base: 0.31, factors: {age_u30: 0.85, age_30_49: 1.15, age_50_64: 1.1, age_65p: 0.7, cs_occupation: 1.3, employed: 1.2}}}
      - {code: meta_ai, label: Meta AI, rate: {base: 0.28, factors: {age_u30: 1.15, age_65p: 0.9, social_occasional: 0.7, social_heavy: 1.3}}}
      - {code: grok, label: Grok, rate: {base: 0.19, factors: {age_u30: 1.3, age_65p: 0.5, female: 0.6, early_tech: 1.4}}}
      - {code: claude, label: Claude, rate: {base: 0.11, factors: {college_grad: 1.6, hs_or_less: 0.5, cs_occupation: 1.8, early_tech: 1.4, age_65p: 0.6}}}
    rate_cap: 0.97
    min_items: 1
    display: {template: "{value}", empty: "None"}
    sources: [pew_ai_2026]
    assumption: true
    justification: "Pew Americans and AI 2026 (verified), ever-use among all adults: ChatGPT 44%, Gemini 24%, Copilot 17%, Meta AI 14%, Grok 8%, Claude 6%. Base rates divide these by the 49% share of chatbot users, then by the mean of the age, sex and occupation factors so that the overall share stays on the Pew figure (ChatGPT also follows its 61/55/37/19% age gradient). Gradients for the other chatbots (age, education, occupation, tech profile) are damped assumptions."

  - key: chatbot_main_use
    label: Main use of AI chatbots
    type: enum
    when: ai_user
    values:
      - {code: work, label: "Work"}
      - {code: school, label: "School"}
      - {code: personal, label: "Personal use"}
    distribution:
      given: [socle.activity_status, socle.pcs]
      table:
        employed:
          management: {work: 62, school: 3, personal: 35}
          business_finance: {work: 62, school: 3, personal: 35}
          computer_engineering_science: {work: 72, school: 3, personal: 25}
          education_legal_community_arts: {work: 55, school: 5, personal: 40}
          default: {work: 32, school: 2, personal: 66}
        student:
          default: {work: 5, school: 70, personal: 25}
        default:
          default: {work: 5, school: 3, personal: 92}
    display: {empty: "Not applicable"}
    sources: [pew_chatgpt_2025]
    assumption: true
    justification: "Pew (June 2025, verified): 28% of employed adults have used ChatGPT for work. With about half of employed adults using chatbots, this puts work as the main use for roughly 40-45% of employed chatbot users; this rule gives about 43%, higher for desk occupation groups (management, business, computer, education and legal) and lower elsewhere. No published split of the main use itself (work, school, personal): students lean school and everyone else leans personal use by assumption."

  - key: online_shopping_frequency
    label: Online shopping frequency (non-grocery)
    type: enum
    values:
      - {code: rarely, label: "Rarely"}
      - {code: monthly, label: "About once a month"}
      - {code: few_per_month, label: "A few times a month"}
      - {code: weekly, label: "About once a week"}
      - {code: several_per_week, label: "Several times a week"}
    distribution:
      weights:
        rarely:
          div:
            - 22
            - &shop_m
              mul:
                - {lookup: shop_age_factor, by: socle.age}
                - {if: {attr: socle.has_internet, eq: true}, then: 1, else: 0.6}
                - {if: has_phone, then: 1, else: 0.7}
                - {if: rural, then: 0.88, else: 1}
                - {if: income_low, then: 0.85, else: {if: income_high, then: 1.15, else: 1}}
                - {if: has_kids, then: 1.15, else: 1}
        monthly: {div: [20, *shop_m]}
        few_per_month: 22
        weekly: {mul: [24, *shop_m]}
        several_per_week: {mul: [12, *shop_m]}
    sources: [pew_shopping_2022, omnisend_2024]
    assumption: true
    justification: "Pew (2022, snippet): 32% buy with a smartphone at least weekly, 21% on a computer, so roughly a third or more shop weekly across devices. Commercial surveys give higher figures and are not relied on. Younger adults, parents of young children and urban, higher-income adults skew more frequent; no home internet, no smartphone, rural and low-income skew less frequent. Groceries excluded (covered by another module)."

  - key: shopping_sites_used
    label: Online shopping sites used regularly
    type: set
    when: shopper
    items:
      - {code: amazon, label: Amazon, rate: {base: 0.85, factors: {frequent_shopper: 1.1, age_65p: 0.9, rural: 0.95}}}
      - {code: walmart, label: Walmart, rate: {base: 0.5, factors: {rural: 1.3, south: 1.15, income_low: 1.2, income_high: 0.85, age_u30: 0.9}}}
      - {code: target, label: Target, rate: {base: 0.3, factors: {rural: 0.6, income_high: 1.35, income_low: 0.8, age_30_49: 1.25, age_65p: 0.6, has_kids: 1.15}}}
      - {code: temu_shein, label: "Temu or Shein", rate: {base: 0.28, factors: {age_u30: 1.7, age_30_49: 1.1, age_50_64: 0.7, age_65p: 0.35, income_low: 1.1, frequent_shopper: 1.3}}}
      - {code: ebay_etsy, label: "eBay or Etsy", rate: {base: 0.3, factors: {age_50_64: 1.1, frequent_shopper: 1.2, rural: 0.9, income_high: 1.1}}}
    rate_cap: 0.97
    min_items: 1
    display: {template: "{value}", empty: "None"}
    sources: [omnisend_2024]
    assumption: true
    justification: "No official source for retailer shares (only a commercial survey: 68% have shopped on Temu, not verified). Amazon is near-universal among online shoppers; Walmart skews rural, Southern and lower-income; Target skews higher-income and families; Temu and Shein skew younger. Patterns are assumptions to calibrate on a commercial source (eMarketer, Statista)."

  - key: digital_help_need
    label: Need for help with new apps and devices
    type: enum
    values:
      - {code: none, label: "Rarely needs help"}
      - {code: occasional, label: "Needs help occasionally"}
      - {code: frequent, label: "Often needs help"}
    distribution:
      weights:
        frequent:
          min:
            - 0.7
            - &help_f
              mul:
                - {lookup: help_f_age, by: socle.age}
                - {lookup: help_edu_f, by: socle.education}
                - {lookup: help_tech_f, by: socle.tech_adoption}
                - {if: {attr: socle.has_internet, eq: true}, then: 1, else: 1.5}
                - {if: has_phone, then: 1, else: 1.4}
                - {if: rural, then: 1.15, else: 1}
                - {if: income_low, then: 1.3, else: {if: income_high, then: 0.8, else: 1}}
        occasional:
          min:
            - 0.8
            - &help_o
              mul:
                - {lookup: help_o_age, by: socle.age}
                - {lookup: help_edu_o, by: socle.education}
                - {lookup: help_tech_o, by: socle.tech_adoption}
                - {if: {attr: socle.has_internet, eq: true}, then: 1, else: 1.2}
                - {if: has_phone, then: 1, else: 1.15}
                - {if: rural, then: 1.08, else: 1}
                - {if: income_low, then: 1.15, else: {if: income_high, then: 0.9, else: 1}}
        none: {max: [0.05, {add: [1, {mul: [-1, *help_f]}, {mul: [-1, *help_o]}]}]}
    sources: [pew_internet_2026]
    assumption: true
    justification: "Pew publishes no figure on help needed with new apps. Built from the documented age, income and access gaps (smartphone ownership 78% at 65+ vs 97% under 50; home broadband 54% under $30K vs 94% at $100K+). Seniors, late adopters, rural, low-education and low-income adults skew toward needing help."

card:
  - when: has_phone
    template: "Daily smartphone screen time: {phone_screen_time}"
  - when: social_user
    template: "Social and messaging platforms: {platforms_used}"
  - "AI chatbot use: {chatbot_use}"
  - when: ai_user
    template: "AI chatbots used: {chatbots_used}; main use: {chatbot_main_use}"
  - "Online shopping (non-grocery): {online_shopping_frequency}"
  - when: shopper
    template: "Shopping sites used: {shopping_sites_used}"
  - "Help with new apps and devices: {digital_help_need}"

segments:
  - {id: digitalLifePhoneTime, attribute: phone_screen_time, label: Daily smartphone screen time}
  - {id: digitalLifeAiUse, attribute: chatbot_use, label: AI chatbot use}
  - {id: digitalLifeAiMainUse, attribute: chatbot_main_use, label: Main use of AI chatbots}
  - {id: usDigitalLifeShopping, attribute: online_shopping_frequency, label: Online shopping frequency}
  - {id: usDigitalLifeHelpNeed, attribute: digital_help_need, label: Need for help with new apps}

eligibility_helpers:
  heavy_phone_user: "us-digital-life.phone_screen_time in [four_to_six_h, over_six_h]"
  light_phone_user: "us-digital-life.phone_screen_time in [under_1h, one_to_two_h]"
  ai_weekly_user: "us-digital-life.chatbot_use in [weekly, daily]"
  ai_non_user: "us-digital-life.chatbot_use == never"
  ai_for_work: "us-digital-life.chatbot_main_use == work"
  ai_for_school: "us-digital-life.chatbot_main_use == school"
  weekly_online_shopper: "us-digital-life.online_shopping_frequency in [weekly, several_per_week]"
  rare_online_shopper: "us-digital-life.online_shopping_frequency == rarely"
  senior_needs_help: "age >= 65 and us-digital-life.digital_help_need in [occasional, frequent]"
  needs_frequent_help: "us-digital-life.digital_help_need == frequent"
  smartphone_without_home_internet: "has_smartphone and not has_internet"
  young_heavy_social: "age < 30 and social_media == heavy"

validation:
  margins:
    - {attribute: phone_screen_time, title: "Daily smartphone screen time (expected from social media level and age)"}
    - {attribute: chatbot_use, title: "AI chatbot use (expected from age, education and tech adoption)"}
    - {attribute: chatbot_main_use, title: "Main use of AI chatbots (expected from activity and occupation group)"}
    - {attribute: online_shopping_frequency, title: "Online shopping frequency (expected from age, access and household)"}
    - {attribute: digital_help_need, title: "Need for help with new apps (expected from age, education and tech adoption)"}
  shares:
    - label: "Adults using AI chatbots (Pew 2026: 49%, so about 51% never)"
      among: {attr: socle.age, gt: 17}
      share_of: ai_user
      range: [0.43, 0.55]
    - label: "Adults using AI chatbots daily (Pew 2026: about 25%, kept lower here)"
      among: {attr: socle.age, gt: 17}
      share_of: daily_ai
      range: [0.15, 0.28]
    - label: "Adults under 30 using AI chatbots (Pew 2026: ChatGPT alone 61%)"
      among: age_u30
      share_of: ai_user
      range: [0.55, 0.80]
    - label: "Adults 65+ using AI chatbots (Pew 2026: ChatGPT alone 19%)"
      among: age_65p
      share_of: ai_user
      range: [0.15, 0.32]
    - label: "Graduate degree holders using AI chatbots (Pew 2025: 52% ChatGPT alone)"
      among: {attr: socle.education, eq: graduate}
      share_of: ai_user
      range: [0.52, 0.80]
    - label: "High school or less using AI chatbots (Pew 2025: 18% ChatGPT alone)"
      among: hs_or_less
      share_of: ai_user
      range: [0.18, 0.40]
    - label: "Employed adults using a chatbot mainly for work (Pew 2025: 28% used ChatGPT for work at all, so main use is lower)"
      among: employed
      share_of: {all: [ai_user, {attr: chatbot_main_use, eq: work}]}
      range: [0.15, 0.30]
    - label: "Students using chatbots mainly for school (assumption, students lean school)"
      among: {all: [student, ai_user]}
      share_of: {attr: chatbot_main_use, eq: school}
      range: [0.55, 0.80]
    - label: "Adults shopping online at least weekly (Pew 2022: 32% on a phone, 21% on a computer)"
      among: {attr: socle.age, gt: 17}
      share_of: frequent_shopper
      range: [0.28, 0.46]

# Module "Video games" : who plays, how much, on what, which genres, how much they spend, where they buy and watch.
# S'applique à tout adulte du socle sg (18-79). Pas d'effet budgétaire (l'abonnement "gaming pass" est dans sg-digital-subscriptions).
# Aucun conditionnement sur l'ethnie ou la religion. Format : docs/modules.md.
id: sg-video-games
version: "2026.2"
changelog:
  - version: "2026.2"
    date: "2026-10-22"
    changes: ["First version (sg socle): gamer status, weekly play time, platforms, genres, play mode, monthly spending in S$, purchase channels, communities and streaming. Information for the persona card only, no budget effect."]
label: Video games in Singapore
short_label: Gaming
description: >-
  Video game practice among Singapore residents aged 18-79: gamer status (non-gamer, occasional, regular, heavy),
  weekly play time, platforms (mobile first), preferred genres, play mode, monthly spending in S$, purchase channels
  and gaming communities or streaming. Conditioned on age, sex, activity status (students), tech adoption, phone and
  computer ownership, living standard and dwelling type. Not conditioned on ethnicity or religion.
applies_to: [sg]
requires: []

sources:
  yougov_apac_2022:
    org: "YouGov"
    title: "APAC gamers lead the globe on most time spent gaming per week"
    year: 2022
    url: "https://yougov.com/reports/45510-apac-gamers-lead-globe-most-time-spent-gaming-week"
    detail: "Singapore gamers average 9.8 h/week (8.9 globally); 79% of weekly gamers use a smartphone; 18% of adults are heavy weekly gamers (engagement measure)"
  tradegov_sg_esports:
    org: "US International Trade Administration (citing Newzoo / Rakuten Insight)"
    title: "E-sports and E-gaming in Singapore"
    year: 2021
    url: "https://www.trade.gov/market-intelligence/e-sports-and-e-gaming-singapore"
    detail: "Mobile gaming 74% of men, 68% of women; 72% (16-24), 68% (25-34), 57% (35-44). 3.8M gamers = 46% of the online population. Mobile genres: puzzle 34%, strategy 32%, action/adventure 24%; PC: shooter 30%, RPG 30%, strategy 27%. 46% of online gamers watch game content, 21% esports content."
  milieu_sg_gaming:
    org: "Milieu Insight"
    title: "Video Gaming in Singapore: Favourite Platforms and Spending"
    year: 2020
    url: "https://mili.eu/video-gaming-in-singapore-favourite-platforms-and-spending/"
    detail: "64% prefer mobile over PC and console; mobile players typically spend S$1-10/month on in-app purchases; 8% of PC players pay for in-app purchases; console players: 22% spend nothing, 36% spend more than S$25/month"
  commissionfactory_sg:
    org: "Commission Factory (secondary source)"
    title: "Singapore Gaming Industry - Stats, Trends & Demographics"
    year: 2023
    url: "https://www.commissionfactory.com/market-insights/ecommerce-marketing/singapore-gaming-industry"
    detail: "Men: RPG most popular (41%); women: casual games (just over a third). Secondary figures, not traced to a primary source."
  statista_sg_genres_2025:
    org: "Statista (Rakuten Insight, January 2025, n=1,945 aged 16+)"
    title: "Singapore: leading online gaming genres by gender 2025"
    year: 2025
    url: "https://www.statista.com/statistics/1118104/singapore-leading-online-gaming-genres-by-gender/"
    detail: "Casual games stand out among women, RPG among men, shooters among 16-24. Percentages paywalled; page not verified."

conditions:
  gamer: {attr: gamer_status, in: [occasional, regular, heavy]}
  student: {attr: socle.activity_status, eq: student}
  gamer_with_device:
    all:
      - gamer
      - any:
          - {attr: socle.has_smartphone, eq: true}
          - {attr: socle.has_computer, eq: true}
  gamer_without_device:
    all:
      - gamer
      - {attr: socle.has_smartphone, eq: false}
      - {attr: socle.has_computer, eq: false}
  plays_on_phone: {attr: mobile_pc_platforms, in: [smartphone]}
  plays_on_pc: {attr: mobile_pc_platforms, in: [gaming_pc]}
  plays_on_console:
    any:
      - {attr: console_cloud_platforms, in: [playstation_5, xbox, nintendo_switch]}
      - {attr: fallback_platforms, in: [playstation_5, xbox, nintendo_switch]}

tables:
  play_rate_age:
    label: "Share of adults who play video games, by age (before sex, tech, device and student adjustments)"
    bands:
      - {from: 18, to: 24, value: 0.74}
      - {from: 25, to: 34, value: 0.70}
      - {from: 35, to: 44, value: 0.60}
      - {from: 45, to: 54, value: 0.48}
      - {from: 55, to: 64, value: 0.36}
      - {from: 65, to: 79, value: 0.22}
    sources: [tradegov_sg_esports]
    assumption: true
    justification: "72% (16-24), 68% (25-34), 57% (35-44) of the online population play on mobile (Newzoo/Rakuten via Trade.gov). Rates from 45 onwards are assumed, lower because the 18-79 population includes many people offline or uninterested."
  heavy_share_age:
    label: "Share of heavy gamers among players, by age"
    bands:
      - {from: 18, to: 24, value: 0.28}
      - {from: 25, to: 34, value: 0.22}
      - {from: 35, to: 44, value: 0.15}
      - {from: 45, to: 54, value: 0.10}
      - {from: 55, to: 79, value: 0.06}
    sources: [yougov_apac_2022]
    assumption: true
    justification: "YouGov reports 18% of adults as heavy weekly gamers (engagement measure, younger online sample); the share is lowered for the 18-79 population and tilted towards young adults. Assumed."
  regular_share_age:
    label: "Share of regular gamers among players, by age"
    bands:
      - {from: 18, to: 24, value: 0.40}
      - {from: 25, to: 44, value: 0.42}
      - {from: 45, to: 54, value: 0.35}
      - {from: 55, to: 79, value: 0.30}
    assumption: true
    justification: "No published split of occasional, regular and heavy players; assumed, with older players more occasional."
  tech_factor:
    label: "Play propensity by tech adoption profile"
    values: {innovator: 1.2, early_adopter: 1.12, early_majority: 1.0, late_majority: 0.85, laggard: 0.6}
    assumption: true
    justification: "Assumed gradient: early adopters play more, laggards much less."
  sex_play_factor:
    label: "Play propensity by sex"
    values: {M: 1.05, F: 0.95}
    sources: [tradegov_sg_esports]
    assumption: true
    justification: "Mobile gaming 74% of men vs 68% of women (ratio about 1.09 between the two); coefficients centred on 1."
  sex_heavy_factor:
    label: "Heavy play by sex"
    values: {M: 1.3, F: 0.7}
    assumption: true
    justification: "Men are more represented among heavy and core gamers; the size of the gap is assumed."
  dwelling_factor:
    label: "Console and PC ownership by dwelling type (proxy for space and income)"
    values: {hdb_1_2: 0.6, hdb_3: 0.8, hdb_4: 1.0, hdb_5_exec: 1.1, condo: 1.3, landed: 1.4, dormitory: 0.5, other: 0.8}
    assumption: true
    justification: "Dwelling type used as a proxy for space and income, not for ethnicity. No published figure; assumed gradient."
  hours_median:
    label: "Median weekly play time (hours), by intensity"
    values: {occasional: 2, regular: 8, heavy: 20}
    sources: [yougov_apac_2022]
    assumption: true
    justification: "Calibrated so that the mean among gamers is about 8-10 h per week (YouGov: 9.8 h); the split by intensity is assumed."
  hours_sigma:
    label: "Dispersion of weekly play time, by intensity"
    values: {occasional: 0.5, regular: 0.45, heavy: 0.4}
    assumption: true
    justification: "Moderate individual dispersion around the median."
  hours_age:
    label: "Age coefficient of weekly play time"
    bands:
      - {from: 18, to: 29, value: 1.1}
      - {from: 30, to: 54, value: 1.0}
      - {from: 55, to: 79, value: 0.85}
    assumption: true
    justification: "Younger players play slightly longer; assumed."
  console_age:
    label: "Age coefficient for PlayStation, Xbox and cloud gaming"
    bands:
      - {from: 18, to: 29, value: 1.2}
      - {from: 30, to: 44, value: 1.2}
      - {from: 45, to: 59, value: 0.6}
      - {from: 60, to: 79, value: 0.3}
    assumption: true
    justification: "Console play concentrated among 18-44 year olds; assumed."
  switch_age:
    label: "Age coefficient for Nintendo Switch"
    bands:
      - {from: 18, to: 29, value: 1.1}
      - {from: 30, to: 44, value: 1.2}
      - {from: 45, to: 59, value: 0.8}
      - {from: 60, to: 79, value: 0.5}
    assumption: true
    justification: "Switch is more family-oriented and ages better than other consoles; assumed."
  pc_age:
    label: "Age coefficient for gaming PC"
    bands:
      - {from: 18, to: 29, value: 1.2}
      - {from: 30, to: 44, value: 1.0}
      - {from: 45, to: 59, value: 0.7}
      - {from: 60, to: 79, value: 0.4}
    assumption: true
    justification: "PC gaming decreases with age; assumed. Newzoo/Rakuten report PC play of 65% of men and 47% of women (not confirmed on an opened page), hence the sex coefficient used in the attribute."
  g_age_shooter:
    label: "Age coefficient for action / shooter"
    bands: [{from: 18, to: 29, value: 1.4}, {from: 30, to: 44, value: 1.0}, {from: 45, to: 59, value: 0.5}, {from: 60, to: 79, value: 0.25}]
    sources: [statista_sg_genres_2025]
    assumption: true
    justification: "Shooters stand out among 16-24 (Statista, percentages not seen); the gradient is assumed."
  g_age_rpg:
    label: "Age coefficient for RPG"
    bands: [{from: 18, to: 29, value: 1.2}, {from: 30, to: 44, value: 1.0}, {from: 45, to: 59, value: 0.6}, {from: 60, to: 79, value: 0.3}]
    assumption: true
    justification: "Assumed gradient."
  g_age_sports:
    label: "Age coefficient for sports / racing"
    bands: [{from: 18, to: 29, value: 1.1}, {from: 30, to: 44, value: 1.0}, {from: 45, to: 59, value: 0.8}, {from: 60, to: 79, value: 0.5}]
    assumption: true
    justification: "Assumed gradient."
  g_age_strategy:
    label: "Age coefficient for strategy"
    bands: [{from: 18, to: 29, value: 1.0}, {from: 30, to: 44, value: 1.0}, {from: 45, to: 59, value: 0.9}, {from: 60, to: 79, value: 0.7}]
    assumption: true
    justification: "Strategy is popular on both mobile and PC (Trade.gov); mild age gradient assumed."
  g_age_casual:
    label: "Age coefficient for casual / puzzle"
    bands: [{from: 18, to: 29, value: 0.9}, {from: 30, to: 44, value: 1.0}, {from: 45, to: 59, value: 1.3}, {from: 60, to: 79, value: 1.5}]
    assumption: true
    justification: "Older players favour casual games; assumed."
  g_age_moba:
    label: "Age coefficient for MOBA / MMO"
    bands: [{from: 18, to: 29, value: 1.4}, {from: 30, to: 44, value: 1.0}, {from: 45, to: 59, value: 0.4}, {from: 60, to: 79, value: 0.15}]
    assumption: true
    justification: "Assumed gradient."
  g_age_gacha:
    label: "Age coefficient for gacha games"
    bands: [{from: 18, to: 29, value: 1.6}, {from: 30, to: 44, value: 1.0}, {from: 45, to: 59, value: 0.4}, {from: 60, to: 79, value: 0.2}]
    assumption: true
    justification: "Gacha shares are not published; assumed higher among under-35s."
  g_age_sim:
    label: "Age coefficient for simulation"
    bands: [{from: 18, to: 29, value: 0.9}, {from: 30, to: 44, value: 1.0}, {from: 45, to: 79, value: 1.0}]
    assumption: true
    justification: "Assumed flat profile."
  mode_solo_age:
    label: "Age coefficient for mostly solo play"
    bands: [{from: 18, to: 29, value: 0.85}, {from: 30, to: 44, value: 1.0}, {from: 45, to: 59, value: 1.3}, {from: 60, to: 79, value: 1.5}]
    assumption: true
    justification: "Assumed: older players play more alone."
  mode_comp_age:
    label: "Age coefficient for competitive play"
    bands: [{from: 18, to: 29, value: 1.5}, {from: 30, to: 44, value: 0.9}, {from: 45, to: 59, value: 0.3}, {from: 60, to: 79, value: 0.1}]
    sources: [tradegov_sg_esports]
    assumption: true
    justification: "21% of online gamers watch esports content (ceiling for competitive play); the age profile is assumed."
  pay_rate:
    label: "Probability of spending anything on games in a month, by intensity"
    values: {occasional: 0.6, regular: 0.85, heavy: 0.95}
    sources: [milieu_sg_gaming]
    assumption: true
    justification: "Milieu (2020): 22% of console players spend nothing on in-app purchases; most mobile players spend S$1-10. Zero-spend shares are assumed."
  spend_median:
    label: "Median monthly gaming spend among payers (S$), by intensity"
    values: {occasional: 8, regular: 20, heavy: 50}
    sources: [milieu_sg_gaming]
    assumption: true
    justification: "Anchored on Milieu (S$1-10 on mobile, 36% of console players above S$25); medians assumed."
  spend_sigma:
    label: "Dispersion of monthly spend, by intensity"
    values: {occasional: 0.8, regular: 0.8, heavy: 0.9}
    assumption: true
    justification: "Heavy right tail of spending (whales, gacha); assumed."
  spend_age:
    label: "Age coefficient of monthly spend"
    bands: [{from: 18, to: 24, value: 0.8}, {from: 25, to: 44, value: 1.1}, {from: 45, to: 59, value: 0.9}, {from: 60, to: 79, value: 0.7}]
    assumption: true
    justification: "Students have little disposable income; working-age adults spend most; assumed."
  phys_age:
    label: "Age coefficient for physical retail purchases"
    bands: [{from: 18, to: 29, value: 0.7}, {from: 30, to: 44, value: 1.1}, {from: 45, to: 59, value: 1.4}, {from: 60, to: 79, value: 1.2}]
    assumption: true
    justification: "Physical retail is more common among older console players; assumed."
  social_age:
    label: "Age coefficient for gaming communities and streaming"
    bands: [{from: 18, to: 29, value: 1.6}, {from: 30, to: 44, value: 1.0}, {from: 45, to: 59, value: 0.4}, {from: 60, to: 79, value: 0.15}]
    sources: [tradegov_sg_esports]
    assumption: true
    justification: "46% of online gamers watch game content (Trade.gov); the age gradient is assumed."
  social_media_factor:
    label: "Streaming and community use by social media use"
    values: {none: 0.1, occasional: 0.5, daily: 1.0, heavy: 1.4}
    assumption: true
    justification: "Assumed gradient."
  status_social_factor:
    label: "Streaming and community use by gamer intensity"
    values: {occasional: 0.6, regular: 1.0, heavy: 1.6}
    assumption: true
    justification: "Heavy gamers watch and chat more; assumed."

attributes:
  - key: play_propensity
    label: Propensity to play video games (0 to 1)
    type: number
    value:
      min:
        - 0.97
        - mul:
            - {lookup: play_rate_age, by: socle.age}
            - {lookup: sex_play_factor, by: socle.sex}
            - {lookup: tech_factor, by: socle.tech_adoption}
            - cases:
                - when: {all: [{attr: socle.has_smartphone, eq: false}, {attr: socle.has_computer, eq: false}]}
                  value: 0.25
                - when: {attr: socle.has_smartphone, eq: false}
                  value: 0.7
                - else: 1
            - {if: student, then: 1.15, else: 1}
    sources: [tradegov_sg_esports]
    assumption: true
    justification: "Participation by age and sex from Newzoo/Rakuten via Trade.gov; the tech adoption, device ownership and student effects are assumed. Deterministic helper, no random draw."

  - key: space_index
    label: Space and means index (dwelling × living standard)
    type: number
    value:
      mul:
        - {lookup: dwelling_factor, by: socle.dwelling}
        - {min: [1.4, {max: [0.7, {add: [0.6, {mul: [0.4, {attr: socle.living_standard_ratio}]}]}]}]}
    assumption: true
    justification: "Used to weight console and PC ownership: dwelling type as a proxy for space and income, combined with the living standard ratio. Deterministic helper."

  - key: gamer_status
    label: Gamer status
    type: enum
    values:
      - {code: non_gamer, label: non-gamer}
      - {code: occasional, label: occasional gamer}
      - {code: regular, label: regular gamer}
      - {code: heavy, label: heavy gamer}
    distribution:
      sampler: quasi
      weights:
        non_gamer: {add: [1, {mul: [-1, {attr: play_propensity}]}]}
        occasional:
          mul:
            - {attr: play_propensity}
            - {max: [0.05, {add: [1, {mul: [-1, {lookup: heavy_share_age, by: socle.age}]}, {mul: [-1, {lookup: regular_share_age, by: socle.age}]}]}]}
        regular: {mul: [{attr: play_propensity}, {lookup: regular_share_age, by: socle.age}]}
        heavy: {mul: [{attr: play_propensity}, {lookup: heavy_share_age, by: socle.age}, {lookup: sex_heavy_factor, by: socle.sex}, {if: student, then: 1.3, else: 1}]}
    sources: [tradegov_sg_esports, yougov_apac_2022]
    assumption: true
    justification: "Participation by age and sex is documented (Newzoo/Rakuten via Trade.gov, surveys of online populations aged 16+); the split into occasional, regular and heavy and the student and tech effects are assumed. Deliberately cautious: about 45% of adults aged 18-79 are non-gamers, and heavy gamers are well below YouGov's 18% engagement measure."

  - key: weekly_play_hours
    label: Weekly play time (gamers only)
    type: number
    unit: h/week
    when: gamer
    value:
      min:
        - 80
        - max:
            - 0.5
            - div:
                - round:
                    mul:
                      - 2
                      - {lookup: hours_median, by: gamer_status}
                      - {lookup: hours_age, by: socle.age}
                      - {exp: {mul: [{lookup: hours_sigma, by: gamer_status}, {normal: {}}]}}
                - 2
    display: {template: "about {value} h per week"}
    sources: [yougov_apac_2022]
    assumption: true
    justification: "Singapore gamers average 9.8 h per week (YouGov 2022); lognormal by intensity calibrated on this mean. The unverified claim '41% above 15 h/week' (Commission Factory) is not used."

  - key: mobile_pc_platforms
    label: Mobile and PC gaming platforms used
    type: set
    when: gamer_with_device
    items:
      - code: smartphone
        label: Smartphone / mobile
        card_label: smartphone
        rate:
          if: {attr: socle.has_smartphone, eq: true}
          then: {pick: gamer_status, values: {occasional: 0.92, regular: 0.9, heavy: 0.82}, default: 0}
          else: 0
      - code: gaming_pc
        label: Gaming PC
        card_label: gaming PC
        rate:
          if: {attr: socle.has_computer, eq: true}
          then: {mul: [{pick: gamer_status, values: {occasional: 0.08, regular: 0.25, heavy: 0.55}, default: 0}, {lookup: pc_age, by: socle.age}, {pick: socle.sex, values: {M: 1.25, F: 0.7}, default: 1}, {attr: space_index}]}
          else: 0
    rate_cap: 0.95
    min_items: 1
    display: {template: "{value}", empty: no mobile or PC gaming}
    sources: [yougov_apac_2022, milieu_sg_gaming]
    assumption: true
    justification: "Smartphone dominance is documented (79% of weekly gamers on smartphone, 64% prefer mobile: YouGov, Milieu). PC rates and their weighting by age, sex, living standard and dwelling are assumed. Smartphone and PC items are only possible for gamers who own the device (rate 0 otherwise); gamers with neither device are covered by fallback_platforms. Same per-item rates as the former platforms_used."

  - key: console_cloud_platforms
    label: Console and cloud gaming platforms used
    type: set
    when: gamer_with_device
    items:
      - code: playstation_5
        label: PlayStation 5
        card_label: PlayStation 5
        rate: {mul: [{pick: gamer_status, values: {occasional: 0.06, regular: 0.18, heavy: 0.3}, default: 0}, {lookup: console_age, by: socle.age}, {attr: space_index}]}
      - code: xbox
        label: Xbox
        card_label: Xbox
        rate: {mul: [{pick: gamer_status, values: {occasional: 0.02, regular: 0.06, heavy: 0.1}, default: 0}, {lookup: console_age, by: socle.age}, {attr: space_index}]}
      - code: nintendo_switch
        label: Nintendo Switch
        card_label: Nintendo Switch
        rate: {mul: [{pick: gamer_status, values: {occasional: 0.12, regular: 0.22, heavy: 0.28}, default: 0}, {lookup: switch_age, by: socle.age}, {attr: space_index}]}
      - code: cloud_gaming
        label: Cloud gaming
        card_label: cloud gaming
        rate: {mul: [{pick: gamer_status, values: {occasional: 0.01, regular: 0.04, heavy: 0.08}, default: 0}, {lookup: pc_age, by: socle.age}, {attr: space_index}]}
    rate_cap: 0.95
    display: {template: "{value}", empty: no console or cloud gaming}
    sources: [milieu_sg_gaming]
    assumption: true
    justification: "Console and cloud rates, and their weighting by age, living standard and dwelling, are assumed (same rates as the former platforms_used). Needs no equipment variable, so every gamer with a phone or a computer is covered together with mobile_pc_platforms."

  - key: fallback_platforms
    label: Platforms of gamers owning neither smartphone nor computer
    type: set
    when: gamer_without_device
    items:
      - code: playstation_5
        label: PlayStation 5
        card_label: PlayStation 5
        rate: {mul: [{pick: gamer_status, values: {occasional: 0.06, regular: 0.18, heavy: 0.3}, default: 0}, {lookup: console_age, by: socle.age}, {attr: space_index}]}
      - code: xbox
        label: Xbox
        card_label: Xbox
        rate: {mul: [{pick: gamer_status, values: {occasional: 0.02, regular: 0.06, heavy: 0.1}, default: 0}, {lookup: console_age, by: socle.age}, {attr: space_index}]}
      - code: nintendo_switch
        label: Nintendo Switch
        card_label: Nintendo Switch
        rate: {mul: [{pick: gamer_status, values: {occasional: 0.12, regular: 0.22, heavy: 0.28}, default: 0}, {lookup: switch_age, by: socle.age}, {attr: space_index}]}
      - code: cloud_gaming
        label: Cloud gaming
        card_label: cloud gaming
        rate: {mul: [{pick: gamer_status, values: {occasional: 0.01, regular: 0.04, heavy: 0.08}, default: 0}, {lookup: pc_age, by: socle.age}, {attr: space_index}]}
    rate_cap: 0.95
    min_items: 1
    display: {template: "{value}", empty: platforms not recorded}
    sources: [milieu_sg_gaming]
    assumption: true
    justification: "Gamers with neither smartphone nor computer can only play on a console or cloud device (e.g. a TV or a shared device); same item rates as console_cloud_platforms, with at least one platform guaranteed. Rare case, assumed."

  - key: preferred_genres
    label: Preferred game genres
    type: set
    when: gamer
    items:
      - code: action_shooter
        label: Action / shooter
        card_label: action and shooters
        rate: {mul: [0.3, {pick: socle.sex, values: {M: 1.3, F: 0.6}, default: 1}, {lookup: g_age_shooter, by: socle.age}, {pick: gamer_status, values: {occasional: 0.7, regular: 1.0, heavy: 1.3}, default: 1}]}
      - code: rpg
        label: RPG
        card_label: RPGs
        rate: {mul: [0.33, {pick: socle.sex, values: {M: 1.25, F: 0.75}, default: 1}, {lookup: g_age_rpg, by: socle.age}, {pick: gamer_status, values: {occasional: 0.7, regular: 1.0, heavy: 1.3}, default: 1}]}
      - code: sports_racing
        label: Sports / racing
        card_label: sports and racing
        rate: {mul: [0.2, {pick: socle.sex, values: {M: 1.4, F: 0.5}, default: 1}, {lookup: g_age_sports, by: socle.age}, {pick: gamer_status, values: {occasional: 0.7, regular: 1.0, heavy: 1.2}, default: 1}]}
      - code: strategy
        label: Strategy
        card_label: strategy
        rate: {mul: [0.25, {pick: socle.sex, values: {M: 1.1, F: 0.9}, default: 1}, {lookup: g_age_strategy, by: socle.age}, {pick: gamer_status, values: {occasional: 0.8, regular: 1.0, heavy: 1.2}, default: 1}]}
      - code: casual_puzzle
        label: Casual / puzzle
        card_label: casual and puzzle
        rate: {mul: [0.4, {pick: socle.sex, values: {M: 0.8, F: 1.3}, default: 1}, {lookup: g_age_casual, by: socle.age}, {pick: gamer_status, values: {occasional: 1.3, regular: 1.0, heavy: 0.7}, default: 1}]}
      - code: moba_mmo
        label: MOBA / MMO
        card_label: MOBA and MMO
        rate: {mul: [0.18, {pick: socle.sex, values: {M: 1.4, F: 0.6}, default: 1}, {lookup: g_age_moba, by: socle.age}, {pick: gamer_status, values: {occasional: 0.5, regular: 1.0, heavy: 1.8}, default: 1}]}
      - code: gacha
        label: Gacha games
        card_label: gacha games
        rate: {mul: [0.17, {pick: socle.sex, values: {M: 0.9, F: 1.1}, default: 1}, {lookup: g_age_gacha, by: socle.age}, {pick: gamer_status, values: {occasional: 0.6, regular: 1.0, heavy: 1.5}, default: 1}]}
      - code: simulation
        label: Simulation
        card_label: simulation
        rate: {mul: [0.17, {pick: socle.sex, values: {M: 0.9, F: 1.1}, default: 1}, {lookup: g_age_sim, by: socle.age}, {pick: gamer_status, values: {occasional: 0.8, regular: 1.0, heavy: 1.1}, default: 1}]}
    rate_cap: 0.8
    min_items: 1
    max_items: 5
    display: {template: "favourite genres: {value}", empty: no favourite genre}
    sources: [tradegov_sg_esports, commissionfactory_sg, statista_sg_genres_2025]
    assumption: true
    justification: "Genre shares by sex and age are partly documented (puzzle, strategy and action on mobile; shooter, RPG and strategy on PC: Trade.gov; men favour RPG, women casual: Commission Factory; Statista page not verified). Shares for MOBA, gacha, sports and simulation, and the age and intensity gradients, are extrapolated."

  - key: play_mode
    label: Main play mode
    type: enum
    when: gamer
    values:
      - {code: mostly_solo, label: mostly solo}
      - {code: casual_multiplayer, label: casual multiplayer with friends}
      - {code: competitive_esports, label: competitive / esports}
    distribution:
      weights:
        mostly_solo: {mul: [{pick: gamer_status, values: {occasional: 70, regular: 50, heavy: 30}, default: 50}, {lookup: mode_solo_age, by: socle.age}]}
        casual_multiplayer: {pick: gamer_status, values: {occasional: 28, regular: 41, heavy: 45}, default: 38}
        competitive_esports: {mul: [{pick: gamer_status, values: {occasional: 2, regular: 9, heavy: 25}, default: 9}, {pick: socle.sex, values: {M: 1.4, F: 0.6}, default: 1}, {lookup: mode_comp_age, by: socle.age}]}
    sources: [tradegov_sg_esports]
    assumption: true
    justification: "No direct source on play mode; 21% of online gamers watch esports content (Trade.gov), used as a ceiling for competitive play (assumed about 10-15% of gamers, higher among heavy young men)."

  - key: monthly_gaming_spend
    label: Monthly gaming spending
    type: number
    unit: S$/month
    when: gamer
    value:
      min:
        - 600
        - round:
            mul:
              - {bernoulli: {lookup: pay_rate, by: gamer_status}}
              - {lookup: spend_median, by: gamer_status}
              - {lookup: spend_age, by: socle.age}
              - {min: [1.6, {max: [0.6, {add: [0.5, {mul: [0.5, {attr: socle.living_standard_ratio}]}]}]}]}
              - {exp: {mul: [{lookup: spend_sigma, by: gamer_status}, {normal: {}}]}}
    display: {template: "about {value} S$ per month on games, in-app purchases and gaming subscriptions", empty: "spends nothing on games"}
    sources: [milieu_sg_gaming]
    assumption: true
    justification: "Milieu (2020): mobile players typically spend S$1-10 per month, 22% of console players spend nothing and 36% spend more than S$25. Zero-inflated lognormal by intensity, scaled by living standard (square-root-like effect) and age: parameters assumed. Information only: no budget effect (the gaming pass subscription is covered by sg-digital-subscriptions)."

  - key: purchase_channels
    label: Main game purchase channels
    type: set
    when: gamer
    items:
      - code: steam
        label: Steam
        card_label: Steam
        rate:
          if: plays_on_pc
          then: {mul: [{pick: gamer_status, values: {occasional: 0.6, regular: 0.8, heavy: 0.9}, default: 0}, {pick: socle.sex, values: {M: 1.1, F: 0.85}, default: 1}]}
          else: 0
      - code: console_stores
        label: Console online stores (PlayStation Store, Nintendo eShop, Xbox)
        card_label: console online stores
        rate: {if: plays_on_console, then: {pick: gamer_status, values: {occasional: 0.55, regular: 0.75, heavy: 0.85}, default: 0}, else: 0}
      - code: app_stores
        label: Mobile app stores (App Store, Google Play)
        card_label: mobile app stores
        rate: {if: plays_on_phone, then: {pick: gamer_status, values: {occasional: 0.85, regular: 0.8, heavy: 0.7}, default: 0}, else: 0}
      - code: physical_retail
        label: Physical retail
        card_label: physical shops
        rate: {if: plays_on_console, then: {mul: [{pick: gamer_status, values: {occasional: 0.15, regular: 0.3, heavy: 0.35}, default: 0}, {lookup: phys_age, by: socle.age}]}, else: 0}
    rate_cap: 0.9
    min_items: 1
    display: {template: "buys games through {value}", empty: no regular channel}
    sources: [yougov_apac_2022]
    assumption: true
    justification: "No source on purchase channels; each channel is only possible on the platforms drawn: mobile app stores for smartphone gamers, Steam for gaming PC players, console online stores and physical retail (boxed games) for console owners, physical retail higher among 35+. Rates within each platform are assumed. Gamers whose only platform is cloud gaming get no purchase channel."

  - key: gaming_community_streaming
    label: Gaming communities and streaming
    type: set
    when: gamer
    items:
      - code: youtube_gaming
        label: YouTube Gaming
        card_label: YouTube Gaming
        rate: {mul: [0.38, {lookup: status_social_factor, by: gamer_status}, {lookup: social_age, by: socle.age}, {lookup: social_media_factor, by: socle.social_media}]}
      - code: tiktok
        label: TikTok gaming content
        card_label: TikTok
        rate: {mul: [0.22, {lookup: status_social_factor, by: gamer_status}, {lookup: social_age, by: socle.age}, {lookup: social_media_factor, by: socle.social_media}]}
      - code: discord
        label: Discord
        card_label: Discord
        rate: {mul: [0.17, {lookup: status_social_factor, by: gamer_status}, {lookup: social_age, by: socle.age}, {lookup: social_media_factor, by: socle.social_media}, {pick: socle.sex, values: {M: 1.2, F: 0.8}, default: 1}]}
      - code: twitch
        label: Twitch
        card_label: Twitch
        rate: {mul: [0.1, {lookup: status_social_factor, by: gamer_status}, {lookup: social_age, by: socle.age}, {lookup: social_media_factor, by: socle.social_media}, {pick: socle.sex, values: {M: 1.3, F: 0.7}, default: 1}]}
    rate_cap: 0.85
    display: {template: "follows gaming on {value}", empty: "does not follow gaming content or communities"}
    sources: [tradegov_sg_esports]
    assumption: true
    justification: "46% of online gamers watch game content and 21% esports content (Trade.gov). Per-platform shares (YouTube about 35-40% of gamers, TikTok 20-25%, Discord 15-20%, Twitch 8-12%) and the age, intensity and social media gradients are assumed."

card:
  - when: gamer
    template: "Video games: {gamer_status}, {weekly_play_hours}"
  - when: {not: gamer}
    template: "Video games: {gamer_status}"
  - when: gamer_with_device
    template: "Platforms: {mobile_pc_platforms}; consoles and cloud: {console_cloud_platforms}; {preferred_genres}"
  - when: gamer_without_device
    template: "Platforms: {fallback_platforms}; {preferred_genres}"
  - when: gamer
    template: "Play style: {play_mode}; {monthly_gaming_spend}"
  - when: gamer
    template: "Games bought through {purchase_channels}; {gaming_community_streaming}"

segments:
  - {id: gamingIntensity, attribute: gamer_status, label: Gamer status, compare: 3}
  - {id: gamingPlayMode, attribute: play_mode, label: Play mode}

eligibility_helpers:
  gamer: "sg-video-games.gamer_status != non_gamer"
  non_gamer: "sg-video-games.gamer_status == non_gamer"
  core_gamer: "sg-video-games.gamer_status == heavy"
  regular_or_heavy_gamer: "sg-video-games.gamer_status in [regular, heavy]"
  young_active_gamer: "age < 35 and sg-video-games.gamer_status in [regular, heavy]"
  student_gamer: "activity_status == student and sg-video-games.gamer_status != non_gamer"
  esports_player: "sg-video-games.play_mode == competitive_esports"
  solo_player: "sg-video-games.play_mode == mostly_solo"
  gamer_aged_35_plus: "age >= 35 and sg-video-games.gamer_status != non_gamer"

validation:
  margins:
    - {attribute: gamer_status, title: "Gamer status (expected given age, sex, tech adoption and devices)"}
    - {attribute: play_mode, title: "Play mode (expected given intensity, age and sex)"}
  shares:
    - label: "Gamers among adults under 35 (Newzoo/Rakuten: 68-72% play on mobile, online population aged 16-34)"
      among: {attr: socle.age, lt: 35}
      share_of: gamer
      range: [0.58, 0.78]
    - label: "Gamers among adults aged 35-44 (Newzoo/Rakuten: 57% play on mobile)"
      among: {all: [{attr: socle.age, gt: 34}, {attr: socle.age, lt: 45}]}
      share_of: gamer
      range: [0.46, 0.66]
    - label: "Competitive / esports play among gamers (ceiling: 21% watch esports content)"
      among: gamer
      share_of: {attr: play_mode, eq: competitive_esports}
      range: [0.06, 0.18]

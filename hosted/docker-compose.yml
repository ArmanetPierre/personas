# Service hébergé seul (API + front, port interne 8081). Aucun port publié : le reverse proxy
# rejoint le conteneur par le réseau Docker (même modèle que hub/).
#   cp hosted/.env.example hosted/.env   # puis renseigner les valeurs
#   docker compose -f hosted/docker-compose.yml up -d --build
services:
  hosted:
    build:
      context: ..
      dockerfile: hosted/Dockerfile
    image: personas-hosted:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PERSONAS_MODE: hosted
      PORT: "8081"
      HOSTED_DATA_ROOT: /data
      TRUST_PROXY: "1"
    expose:
      - "8081"
    volumes:
      - personas-hosted-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  personas-hosted-data:

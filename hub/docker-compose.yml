# Service Hub seul ; Postgres externe (Supabase auto-hébergé, schéma personas_hub) via DATABASE_URL.
# Le reverse proxy TLS (et le nom de domaine) sont gérés hors de ce fichier.
#   cp hub/.env.example hub/.env   # puis renseigner les valeurs
#   docker compose -f hub/docker-compose.yml up -d --build
services:
  hub:
    build:
      context: ..
      dockerfile: hub/Dockerfile
    image: personas-hub:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      TRUST_PROXY: "1"
    ports:
      # Exposé sur la boucle locale seulement : le reverse proxy publie le service.
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

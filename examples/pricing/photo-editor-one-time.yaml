# Démonstration du format de prix : achat unique, avec une version gratuite.
# Projet fictif.
id: demo-pricing-photo-editor
name: Lumen
pitch: >-
  Lumen est une application pour Mac qui retouche et classe vos photos sur votre ordinateur, sans rien envoyer sur
  internet. Elle reconnaît les visages, regroupe les photos d'un même événement et peut corriger l'exposition de
  toute une série, toujours en local. Elle fonctionne sur les Mac récents (puces Apple) et télécharge environ
  1,6 Go de modèles au premier lancement.
targetAudience: Photographes amateurs sur Mac avec de grosses photothèques, attachés à la confidentialité.
businessModel: Version gratuite, version Pro en achat unique.
price:
  currency: EUR
  offers:
    - id: pro
      label: Lumen Pro
      amount: 29
      unit: one_time
  tiers: [15, 29, 49]
  freemium:
    free: retouche locale illimitée et reconnaissance des visages
    paid: corrections par lots, regroupement par événement, export RAW (Lumen Pro)
competitors: [Lightroom, Pixelmator Pro, l'application Photos du Mac]
alternatives: [garder les photos telles quelles sur le disque]

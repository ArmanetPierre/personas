# Fictional project on the Singapore base population (sg socle), with the published modules barbecue-reception,
# viande-alimentation and achats-groupes-communaute: pitch, protocol and answers in English, amounts in SGD.
id: home-barbecue-chef
name: Pit Crew
pitch: >-
  Pit Crew sends a barbecue chef to your home in Singapore. You book a date at least five days ahead, choose a menu
  (pork belly, lamb chops, chicken wings, beef short ribs, grilled vegetables) and the number of guests, from 8 to
  20. The chef arrives two hours before the meal with the meat, the charcoal and the tools, cooks on your condo
  barbecue pit or your own barbecue, serves, then cleans the pit and leaves. Prices are per guest: S$45 per person
  for the Classic menu and S$65 for the Signature menu, with a minimum of 8 guests; prices include 9% GST. You pay a
  30% deposit by PayNow when booking and the rest after the event. Menus can exclude pork or beef; the meat is not
  halal-certified. Service available every day from 11am to 10pm, in three zones (West, Central/South, East).
pitchOriginal: >-
  Singapore · Est. 2026 · Your barbecue, without the work. Classic menu $45/guest. 100% whole cuts, cooked on site.
  No middleman, no catering trays: you pay what restaurants pay for the meat. −50% vs. Singapore caterers.
  Book 5 days ahead, minimum 8 guests. We bring everything, we clean the pit.
targetAudience: >-
  Core: residents aged 30 to 45 living in a condo with a barbecue pit or a landed home, hosting 8 to 20 people a few
  times a year. Extension: birthdays, office gatherings at home, large families. Not targeted at first: couples and
  singles (small groups), corporate events.
businessModel: >-
  Price per guest, minimum 8 guests: S$45 (Classic) or S$65 (Signature), GST included. 30% deposit at booking by
  PayNow, balance after the event. Physical cap: about 10 events a week with three chefs.
price:
  currency: SGD
  offers:
    - id: classic
      label: Classic menu, per guest (minimum 8 guests, GST included)
      amount: 45
      unit: quantity
      quantity: { unit: guest, per: per guest }
      expectedFrequency: one event a few times a year for a regular host
      purchasesPerMonth: 0.3
    - id: signature
      label: Signature menu, per guest (minimum 8 guests, GST included)
      amount: 65
      unit: quantity
      quantity: { unit: guest, per: per guest }
  reference: classic
  tiers: [35, 45, 60]
  minimumOrder:
    amount: 360
    note: minimum 8 guests; 30% deposit at booking, balance after the event
competitors:
  - home catering services (buffet trays delivered)
  - private chef platforms
  - restaurants with private rooms
alternatives:
  - cooking the barbecue yourself with meat from the supermarket or the wet market
  - ordering ready-cooked food from a caterer
  - eating out at a restaurant or hawker centre instead of hosting
target:
  socle: sg
  modules: [barbecue-reception, viande-alimentation, achats-groupes-communaute]
  eligibility: >-
    age >= 30 and age <= 45
    and barbecue-reception.bbq_grill_access in [condo_shared_pit, landed_private_grill]
    and barbecue-reception.typical_table_size >= 6
    and barbecue-reception.home_hosting_frequency in [monthly, twice_monthly, weekly]
    and viande-alimentation.dietary_restriction != vegetarian
  n: 60
control:
  socle: sg
  modules: [barbecue-reception, viande-alimentation, achats-groupes-communaute]
  eligibility: residency_status != mdw and dwelling != dormitory
  n: 30
protocol:
  productType: online_service
  behaviors:
    - code: ignore
      label: Ignores
      description: you move on and do not think about Pit Crew again
      level: inaction
      short: Ignores
    - code: save_for_later
      label: Keeps it in mind, no likely follow-up
      description: you note the name or the link somewhere, without setting a time to come back to it
      level: inaction
      short: Later
    - code: visit_site
      label: Looks at the menus
      description: you open the site and look at the menus, prices and available dates
      level: interest
      short: Looks
    - code: ask_around
      label: Asks around or compares
      description: you ask friends or a condo or WhatsApp group, or compare with a caterer or doing it yourself
      level: interest
      short: Asks
    - code: first_booking
      label: Books a first event
      description: you book and pay the deposit for a coming gathering
      level: payment
      short: Books
    - code: recommend
      label: Books and recommends
      description: you book an event and recommend Pit Crew to a specific person around you
      level: recommendation
      short: Recommend
  objections:
    - code: no_need
      label: No occasion
      description: Rarely host; no gathering large enough to need a chef
      canonical: no_need
      short: No need
    - code: already_covered
      label: Usual solution is enough
      description: I cook the barbecue myself, or a caterer or restaurant already covers what I need
      canonical: already_covered
      short: Covered
    - code: dietary
      label: Dietary rules
      description: Halal requirement, no pork or no beef at home or among my guests
      canonical: other
      short: Diet
    - code: pit_access
      label: Barbecue access
      description: No barbecue at home, or the condo pit has to be booked weeks in advance
      canonical: effort_time
      short: Pit
    - code: stranger_at_home
      label: A stranger at home
      description: Not comfortable having someone I do not know cook in my home
      canonical: trust_privacy
      short: Trust
    - code: price
      label: Price or minimum
      description: The price per guest or the 8-guest minimum is too high for my budget
      canonical: price
      short: Price
    - code: other
      label: Other
      description: A reason that fits no other category
      canonical: other
      short: Other
  relevance:
    - code: core_host
      label: Regular host with a barbecue
      description: Has a condo barbecue pit or a private barbecue and hosts groups of 8 or more a few times a year
      canonical: concerned
    - code: occasional_host
      label: Occasional host
      description: Hosts once or twice a year, or for smaller groups
      canonical: marginal
    - code: not_concerned
      label: Not concerned
      description: Rarely hosts, or the offer does not match how they entertain
      canonical: not_concerned
  rationale: >-
    Occasional purchase tied to hosting occasions, not a habit: payment behaviour is a first booking with a deposit;
    no free trial exists. Objections cover the real constraints of the offer in Singapore: dietary rules, barbecue
    access, having a stranger at home, price per guest and the minimum number of guests.

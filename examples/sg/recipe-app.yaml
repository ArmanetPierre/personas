# Fictional consumer app on the Singapore base population (sg socle): pitch and answers in English, amounts in SGD.
id: sg-recipe-app
name: Weeknight
pitch: >-
  Weeknight is a phone app that plans the week's dinners for the whole household. You enter how many people eat at
  home, what they like, what they avoid (pork, beef, meat, allergies), how much time you want to spend
  cooking and your budget. The app suggests five dinners, step-by-step recipes and a shopping list sorted by aisle,
  which you can send to an online grocery. You can swap a dish, and leftovers are reused in the next
  menus. Basic menus are free; personalised menus, the shopping list and the grocery link cost S$6.90 a month, with
  no commitment. The app has just launched and has a few hundred users so far.
targetAudience: Working adults aged 25 to 50, often with children, who cook at home on weeknights.
businessModel: Freemium; S$6.90 a month for personalised menus, the shopping list and the grocery link. No ads.
price:
  currency: SGD
  offers:
    - id: monthly
      label: Weeknight Plus
      amount: 6.9
      unit: month
  tiers: [3.9, 6.9, 9.9]
  freemium:
    free: basic weekly menus and recipes
    paid: personalised menus, shopping list, grocery link (Weeknight Plus)
competitors: [recipe websites and YouTube channels, meal-kit deliveries, online grocery apps]
alternatives: [cooking the usual family dishes, buying dinner at a hawker centre]
target:
  socle: sg
  eligibility: "age >= 25 and age <= 50 and residency_status != mdw and dwelling != dormitory"
  n: 60

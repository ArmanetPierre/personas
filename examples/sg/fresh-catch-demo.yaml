# Demo of the Singapore base population (sg socle): pitch, prices and answers in English, amounts in SGD.
# Fictional project, used to demonstrate the format.
id: demo-sg-fresh-catch
name: Fresh Catch Club
pitch: >-
  Fresh Catch Club is a seafood buying club in Singapore. Each week you order between Monday and Wednesday whole
  fish (a 1.5 kg seabass, sea bream, a whole salmon), prawns or a family box, delivered on Saturday morning, or
  collected with a discount. Prices are set per kg, 30 to 40% below specialist fishmongers, because the fish is bought
  directly from fish farms and sold in volume. The fish are sold whole: one salmon feeds 8 to 10 people.
targetAudience: Adults aged 30 to 45 in condos or landed houses who cook for 6 to 12 people at weekends.
businessModel: Sold per kg and per box, minimum order S$150, grouped delivery on Saturdays.
price:
  currency: SGD
  offers:
    - id: kg
      label: Fish by weight (average price)
      amount: 24
      unit: quantity
      quantity: { unit: kg, per: per kg }
      expectedFrequency: one order every 2 to 4 weeks, 6 to 8 kg
      purchasesPerMonth: 10
    - id: family
      label: Family box (5 kg, 8 to 10 people)
      amount: 156
      unit: quantity
      quantity: { unit: box, per: per box }
  reference: kg
  tiers: [18, 24, 32]
  minimumOrder:
    amount: 150
    note: free delivery; S$15 delivery between S$100 and S$150
competitors: [a premium fishmonger, Cold Storage, the wet market fishmonger]
alternatives: [supermarket, restaurant or caterer]
target:
  socle: sg
  eligibility: "age >= 30 and age <= 45 and dwelling in [condo, landed] and residency_status != mdw"
  n: 60

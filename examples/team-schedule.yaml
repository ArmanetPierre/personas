# Projet fictif en multi-rôles : le responsable paie, les membres de l'équipe utilisent gratuitement.
# Modules NON ENCORE CRÉÉS, à proposer avec l'assistant (npm run module:propose) : `horaires-travail`
# (horaires décalés, secteur, planning actuel) et `role-encadrant` (encadre une équipe, taille, outils actuels).
# Tant qu'ils n'existent pas, utiliser examples/team-schedule-no-module.yaml.
id: team-schedule
name: Créneau
pitch: >-
  Créneau est une application de planning pour les petites équipes en horaires décalés (commerce, restauration,
  aide à domicile) : le responsable prépare le planning de la semaine, les membres de l'équipe le consultent sur
  leur téléphone, indiquent leurs disponibilités et s'échangent des créneaux. L'application est gratuite pour les
  membres. Le responsable la paie s'il veut plus de 2 équipes ou plus de 30 membres.
targetAudience: Responsables de petites équipes (payeurs) et membres de leurs équipes (utilisateurs gratuits).
businessModel: Freemium payé par le responsable seul ; Premium Équipe à 9,99 $/mois ou 99 $/an ; membres toujours gratuits.
price:
  currency: USD
  offers:
    - id: mensuel
      amount: 9.99
      unit: month
    - id: annuel
      amount: 99
      unit: year
  reference: mensuel
  tiers: [4.99, 9.99, 14.99]
  freemium:
    free: jusqu'à 2 équipes ou 30 membres ; toujours gratuit pour les membres
    paid: Premium Équipe (équipes illimitées, statistiques d'heures, export paie, modèles de planning)
competitors: [Skello, Combo, groupes WhatsApp]
alternatives: [un tableur partagé, un planning papier affiché en salle de pause]
roles:
  - id: manager
    label: Responsables
    perspective: payer
    intro: Tu encadres une ou plusieurs petites équipes qui travaillent en horaires décalés.
    pitch: >-
      Créneau est une application de planning pour les responsables de petites équipes : tu prépares le planning
      de la semaine, tes équipiers le consultent sur leur téléphone, indiquent leurs disponibilités et s'échangent
      des créneaux, et tu vois les heures de chacun. Gratuit jusqu'à 2 équipes ou 30 membres ; au-delà, Premium
      Équipe (équipes illimitées, statistiques d'heures, export paie, modèles de planning).
    dependsOn: { role: member }
    target:
      socle: fr
      modules: [horaires-travail, role-encadrant]
      eligibility: age >= 20 and age <= 45 and role-encadrant.is_manager == true
      n: 60
  - id: member
    label: Membres
    perspective: user
    intro: Tu travailles en horaires décalés, avec un planning qui change d'une semaine à l'autre.
    pitch: >-
      Créneau est une application de planning d'équipe : ton responsable prépare le planning de la semaine, tu le
      consultes sur ton téléphone quand tu veux, tu indiques tes disponibilités et tu échanges des créneaux avec
      tes collègues.
    offerNote: gratuit pour les membres ; c'est le responsable qui paie s'il veut plus de 2 équipes ou 30 membres
    target:
      socle: fr
      modules: [horaires-travail]
      eligibility: age <= 35 and horaires-travail.shift_work == true
      n: 100

id: productivite-reunions
version: "2026.1"
label: Productivité et réunions
applies_to: [fr]
sources:
  ex: {org: Exemple, title: Enquête sur les réunions, year: 2025, url: "https://example.org/enquete"}
attributes:
  - key: meetings_per_week
    label: Réunions par semaine
    type: enum
    when: {attr: socle.activity_status, eq: employed}
    values: []


    distribution:
      given: socle.pcs
      table:
        "3": {few: 0.3, many: 0.7}
        default: {few: 0.7, many: 0.3}
    sources: [ex]
  - key: takes_notes
    label: Prend des notes en réunion
    type: boolean
    when: {attr: meetings_per_week, eq: many}
    rate: 0.5
    assumption: true
    justification: "Hypothèse de travail, à sourcer."
card:
  - "Réunions : {meetings_per_week}"
segments:
  - {id: meetingLoad, attribute: meetings_per_week, label: Charge de réunions}
